onfigured web search source is also supported). Why not the others: A agents do not ground by end users screen-scraping arbitrary sites at runtime; D a Tableau dashboard export is not a supported Data Library source type.","reference":"Salesforce Help — Agentforce Data Library source types"},{"id":"DC-006","domain":"data-360","topic":"Agentforce Data Library","difficulty":"medium","type":"single","stem":"After an admin at Northern Trail Outfitters saves a new file-based Data Library, what does Salesforce do automatically?","options":[{"id":"A","text":"Nothing happens until the admin manually builds each pipeline component by hand"},{"id":"B","text":"It retrains the underlying LLM on the uploaded files so the answers are memorized"},{"id":"C","text":"It provisions the RAG pipeline (DLO, DMO, index, retriever) and a Q&A action"},{"id":"D","text":"It publishes every uploaded file as a new Salesforce Knowledge article automatically"}],"correct":["C"],"explanation":"Correct: C — Saving a file-based library auto-provisions the RAG components (DLO, then DMO, then search index, then retriever) and wires up the 'Answer Questions with Knowledge' action and a prompt template. Why not the others: A the pipeline is built automatically with default settings; B RAG grounds on your data and never retrains the base model; D uploaded files are not converted into Knowledge articles.","reference":"Trailhead — Enhance Agents with Business Knowledge Using RAG"},{"id":"DC-007","domain":"data-360","topic":"Agentforce Data Library","difficulty":"medium","type":"single","stem":"Universal Containers already manages support content in Salesforce Knowledge with an approval and publishing lifecycle, and content changes weekly. Which grounding approach minimizes ongoing maintenance while keeping answers current?","options":[{"id":"A","text":"Create a Knowledge-based library so published versions are indexed automatically"},{"id":"B","text":"Export Knowledge to PDFs weekly and upload them into a new file-based library each time"},{"id":"C","text":"Paste the full article text straight into the agent's system prompt again each week"},{"id":"D","text":"Delete and recreate the entire Data Library from scratch on a fixed weekly schedule"}],"correct":["A"],"explanation":"Correct: A — A Knowledge-based library reuses the existing publish lifecycle and native versioning, indexing published versions automatically with little upkeep. Why not the others: B weekly PDF exports add manual re-upload and re-index effort; C hard-coding article text into the prompt does not scale and goes stale fast; D recreating the library every week is unnecessary and error-prone.","reference":"Salesforce Help — Ground Agentforce with Salesforce Knowledge"},{"id":"DC-008","domain":"data-360","topic":"Agentforce Data Library","difficulty":"hard","type":"single","stem":"Cloud Kicks already built and activated a Custom Retriever over a curated FAQ search index. They want a new Data Library to reuse that exact retriever rather than re-provisioning data objects. Which source type should they choose?","options":[{"id":"A","text":"SFDRIVE (file-based), which would provision a brand-new file pipeline and index"},{"id":"B","text":"KNOWLEDGE, which would index published articles instead of the existing retriever"},{"id":"C","text":"A brand-new data stream that re-ingests the FAQ content into fresh data objects"},{"id":"D","text":"RETRIEVER, which points the library at the existing active Custom Retriever"}],"correct":["D"],"explanation":"Correct: D — The RETRIEVER source type builds a library that points at an existing active Custom Retriever, so no new data objects are provisioned. Why not the others: A SFDRIVE would provision a new file pipeline; B KNOWLEDGE would index articles rather than reuse the retriever; C a data stream ingests new data instead of reusing the existing retriever.","reference":"Salesforce Help — Agentforce Data Library (RETRIEVER source type)"},{"id":"DC-009","domain":"data-360","topic":"Identifying Fields","difficulty":"medium","type":"single","stem":"Ursa Major Solar is setting up Salesforce Knowledge as a Data Library source. The articles are long and detailed. For the Identifying Fields (primary index fields) that help Agentforce identify the right article, what should the admin select?","options":[{"id":"A","text":"The full article body field, so every word is available for identification"},{"id":"B","text":"A concatenated formula field that combines every field into one identifier key"},{"id":"C","text":"Concise Text or Text Area fields, such as Title and a short Summary"},{"id":"D","text":"A Rich Text field holding the article's fully formatted HTML content"}],"correct":["C"],"explanation":"Correct: C — Identifying Fields should be short, meaningful Text or Text Area fields (like Title and Summary) so Agentforce identifies and sorts the right article. Why not the others: A the full body is long and noisy, which hurts identification; B a concatenated formula key just adds noise and is not a clean identifier; D Rich Text carries HTML markup that degrades grounding quality.","reference":"Salesforce Help — Configure Identifying Fields for a Knowledge Data Library"},{"id":"DC-010","domain":"data-360","topic":"Identifying Fields","difficulty":"medium","type":"single","stem":"While configuring a Knowledge-based Data Library, an admin considers using a Rich Text Area field as an Identifying Field. Why does Salesforce recommend against this?","options":[{"id":"A","text":"Its HTML markup lowers grounding quality, so plain Text/Text Area fields are advised"},{"id":"B","text":"Rich Text fields can never be indexed by Data 360 under any configuration"},{"id":"C","text":"Rich Text fields are always stored completely empty on Knowledge articles across every org"},{"id":"D","text":"Rich Text is actually the officially recommended choice for the identifying fields"}],"correct":["A"],"explanation":"Correct: A — Rich Text fields include HTML markup that can reduce identification and grounding quality, so Salesforce recommends plain Text or Text Area fields. Why not the others: B Rich Text can be indexed as content but is discouraged for identification; C Rich Text fields are not inherently empty; D Rich Text is explicitly not recommended for Identifying Fields.","reference":"Salesforce Help — Identifying Fields best practices"},{"id":"DC-011","domain":"data-360","topic":"Identifying Fields","difficulty":"hard","type":"single","stem":"Three weeks after creating a Knowledge-based Data Library, an admin realizes they chose the wrong primary Identifying Field. What is true?","options":[{"id":"A","text":"All fields, including Identifying Fields, can be freely edited at any time later"},{"id":"B","text":"Identifying (primary index) fields are immutable; content fields remain updatable"},{"id":"C","text":"Only Identifying Fields stay editable, while the content fields are permanently locked"},{"id":"D","text":"Editing an Identifying Field just triggers a harmless re-index with no other impact"}],"correct":["B"],"explanation":"Correct: B — Primary Identifying Fields are immutable once the library exists, whereas content fields are mutable and updating them triggers re-indexing. Why not the others: A Identifying Fields cannot change after creation; C the reverse is true — content fields are the editable ones; D you cannot edit a locked Identifying Field to force a re-index.","reference":"Salesforce Help — Agentforce Data Library field configuration"},{"id":"DC-012","domain":"data-360","topic":"Identifying Fields","difficulty":"medium","type":"multi","stem":"An architect is advising a team on choosing Identifying Fields for a Knowledge Data Library over long articles. Which two practices should they follow? (Choose 2)","options":[{"id":"A","text":"Use concise, human-readable Text/Text Area fields like Title and Summary"},{"id":"B","text":"Use the entire article body as the identifying field for maximum coverage"},{"id":"C","text":"Concatenate all fields into one formula field to guarantee uniqueness"},{"id":"D","text":"Prefer fields that clearly distinguish one article from another one"},{"id":"E","text":"Use a Rich Text field so the article's original formatting is preserved"}],"correct":["A","D"],"explanation":"Correct: A, D — Good Identifying Fields are concise Text or Text Area fields (Title, Summary) that clearly distinguish one article from another. Why not the others: B the full body is too long and noisy to identify a single article; C a concatenated formula key adds noise without improving identification; E Rich Text HTML markup degrades quality.","reference":"Salesforce Help — Configure Identifying Fields"},{"id":"DC-013","domain":"data-360","topic":"Identifying Fields","difficulty":"medium","type":"single","stem":"In a Knowledge-based Data Library, what is the difference between Identifying Fields and Content Fields?","options":[{"id":"A","text":"They are simply the same thing described under two slightly different field names"},{"id":"B","text":"Content Fields identify the article, while Identifying Fields store the full body text"},{"id":"C","text":"Content Fields are immutable, while Identifying Fields change on every article publish"},{"id":"D","text":"Identifying Fields find the article and stay fixed; Content Fields hold indexed text"}],"correct":["D"],"explanation":"Correct: D — Identifying Fields (immutable) let Agentforce identify and sort the right article, while Content Fields (mutable) hold the chunked, indexed text; updating them triggers re-indexing. Why not the others: A they serve different purposes; B the two roles are reversed; C Content Fields are the mutable ones, not Identifying Fields.","reference":"Salesforce Help — Knowledge Data Library fields"},{"id":"DC-014","domain":"data-360","topic":"Identifying Fields","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters' agent often grounds on the wrong Knowledge article because many articles share similar body text. The Identifying Field is currently set to a generic 'Article Type' picklist value. What is the best improvement?","options":[{"id":"A","text":"Remove every Identifying Field so the agent just searches all content equally"},{"id":"B","text":"Add the full article body as an additional Identifying Field for more matching signal"},{"id":"C","text":"Switch the Identifying Fields to concise, distinctive Title and Summary fields"},{"id":"D","text":"Retrain the underlying model on the articles so it learns to tell them apart"}],"correct":["C"],"explanation":"Correct: C — A generic picklist cannot separate similar articles; concise, distinctive fields like Title and Summary give the agent clear signals to pick the right one. Why not the others: A removing identifying fields makes disambiguation worse; B the full body is noisy and a poor identifier; D retrieval accuracy comes from better grounding config, not model retraining.","reference":"Salesforce Help — Improve Knowledge grounding accuracy"},{"id":"DC-015","domain":"data-360","topic":"Structured vs Unstructured","difficulty":"easy","type":"single","stem":"Which of the following is an example of UNSTRUCTURED data that Agentforce grounds on via a Data Library?","options":[{"id":"A","text":"The Amount currency field stored on each individual Opportunity record"},{"id":"B","text":"A Contact's Email address field on the standard Contact object"},{"id":"C","text":"A single normalized row stored inside a Data Model Object (DMO)"},{"id":"D","text":"A PDF product manual that gets chunked and indexed for retrieval"}],"correct":["D"],"explanation":"Correct: D — A PDF manual is unstructured content that is chunked, vectorized, and indexed for RAG grounding. Why not the others: A, B, and C are structured data (CRM fields and a DMO row) grounded through structured retrievers, not document chunking.","reference":"Trailhead — Use Knowledge in Agentforce for Service (structured vs unstructured)"},{"id":"DC-016","domain":"data-360","topic":"Structured vs Unstructured","difficulty":"medium","type":"single","stem":"Pizza Time wants its agent to answer questions like what is the status of my order using live order records stored on a custom CRM object mapped into Data 360. What grounding approach fits this STRUCTURED data?","options":[{"id":"A","text":"Create a search index and retriever on the order DMO and ground the action on it"},{"id":"B","text":"Export the live orders to PDF files and upload them into a file-based Data Library"},{"id":"C","text":"Paste the most recent orders straight into the agent's standing instructions"},{"id":"D","text":"Add each order to Salesforce Knowledge as an individual published article"}],"correct":["A"],"explanation":"Correct: A — Structured records in a DMO are grounded by building a search index on that object and a retriever the prompt or action uses to fetch the right rows. Why not the others: B converting live orders to PDFs is impractical and stale; C static instructions cannot reflect live order status; D orders are structured data, not Knowledge articles.","reference":"Trailhead — Implement Data 360 for Agentforce"},{"id":"DC-017","domain":"data-360","topic":"Structured vs Unstructured","difficulty":"medium","type":"single","stem":"An architect must decide how to ground an agent. The content is a 60-page policy PDF. Which statement is correct?","options":[{"id":"A","text":"The PDF is structured, so map it into a DMO and query its individual fields"},{"id":"B","text":"PDFs simply cannot be used to ground an Agentforce agent at all today"},{"id":"C","text":"The PDF is unstructured, so chunk and index it in a Data Library for RAG retrieval"},{"id":"D","text":"The PDF must first be retyped by hand into standard CRM record fields"}],"correct":["C"],"explanation":"Correct: C — A policy PDF is unstructured content, best handled by chunking and indexing in a Data Library so a retriever pulls relevant passages. Why not the others: A mapping to a DMO suits structured records, not free-form document text; B PDFs are a supported unstructured source; D retyping the PDF into fields is unnecessary and defeats RAG.","reference":"Salesforce Help — Grounding with unstructured data (RAG)"},{"id":"DC-018","domain":"data-360","topic":"Structured vs Unstructured","difficulty":"medium","type":"multi","stem":"Which of the following are UNSTRUCTURED data sources suitable for RAG grounding in Agentforce? (Choose 3)","options":[{"id":"A","text":"A Knowledge article body full of free-form paragraph text"},{"id":"B","text":"The CloseDate date field defined on the Opportunity object"},{"id":"C","text":"A PDF troubleshooting guide with step-by-step instructions"},{"id":"D","text":"A saved customer chat transcript stored as a plain text file"},{"id":"E","text":"A single normalized row from the Unified Individual DMO"}],"correct":["A","C","D"],"explanation":"Correct: A, C, D — Article bodies, PDFs, and chat transcripts are unstructured text that is chunked, vectorized, and indexed for RAG. Why not the others: B CloseDate is a structured CRM field; E a DMO row is structured data grounded through structured retrievers, not document chunking.","reference":"Trailhead — Use Knowledge in Agentforce for Service"},{"id":"DC-019","domain":"data-360","topic":"Structured vs Unstructured","difficulty":"hard","type":"single","stem":"Cloud Kicks' agent must answer product questions using both an FAQ document library (unstructured) and live inventory from a Product DMO (structured) in a single response. What is the best design?","options":[{"id":"A","text":"Use just the file-based FAQ retriever and completely ignore the live inventory data"},{"id":"B","text":"An ensemble retriever combining the FAQ and the Product DMO retrievers"},{"id":"C","text":"Merge both data sets into one large PDF file and upload that to a file library"},{"id":"D","text":"Retrain the base model on both the FAQs and the current inventory data"}],"correct":["B"],"explanation":"Correct: B — An ensemble retriever consolidates multiple retrievers (unstructured FAQ plus structured Product DMO) and ranks the combined results for one grounded response. Why not the others: A ignoring inventory drops required data; C dumping live inventory into a static PDF goes stale immediately; D grounding is a retrieval problem, not a model-training one.","reference":"Trailhead — Create an Ensemble Retriever (Data 360)"},{"id":"DC-020","domain":"data-360","topic":"Structured vs Unstructured","difficulty":"medium","type":"single","stem":"An agent needs to return only orders where Status equals 'Shipped' for the current contact. Which characteristic makes STRUCTURED grounding the right fit here?","options":[{"id":"A","text":"Structured data is always chunked into fixed 1,200-token passages"},{"id":"B","text":"Structured retrieval requires vector embeddings of the entire record body"},{"id":"C","text":"Structured data cannot be filtered at all, so it always returns every single record"},{"id":"D","text":"Structured data supports precise field filters like Status or matched contact"}],"correct":["D"],"explanation":"Correct: D — Structured retrievers apply exact field filters (Status = Shipped, matched contact), ideal for precise record queries. Why not the others: A chunking applies to unstructured documents, not structured rows; B structured retrieval does not embed a record body; C structured data is highly filterable — the opposite of this claim.","reference":"Salesforce Help — Create a Retriever with filters (AI Models)"},{"id":"DC-021","domain":"data-360","topic":"Structured vs Unstructured","difficulty":"medium","type":"single","stem":"Why is uploading PDFs to a file-based Data Library convenient for unstructured content compared with structured grounding?","options":[{"id":"A","text":"The PDFs are automatically converted into structured CRM record fields"},{"id":"B","text":"It retrains the model so that it memorizes the entire PDF word for word"},{"id":"C","text":"You skip field mapping — document text is chunked and indexed automatically"},{"id":"D","text":"It guarantees strict, exact-keyword-only matching against every single user query"}],"correct":["C"],"explanation":"Correct: C — For unstructured documents you do not map fields; Agentforce chunks and indexes the text automatically for retrieval. Why not the others: A PDFs are not converted into CRM fields; B RAG does not retrain or memorize content in the model; D indexing enables semantic (and optional hybrid) search, not keyword-only matching.","reference":"Trailhead — Agentforce Data Library Basics"},{"id":"DC-022","domain":"data-360","topic":"Chunking & Indexing","difficulty":"easy","type":"single","stem":"Why does Agentforce break a long document into smaller 'chunks' before indexing?","options":[{"id":"A","text":"So the retriever returns the most relevant passages, not a whole document"},{"id":"B","text":"To automatically scan for and delete duplicate documents before indexing them"},{"id":"C","text":"To convert each source document into an equivalent structured CRM record"},{"id":"D","text":"To retrain the underlying LLM separately on each individual text chunk"}],"correct":["A"],"explanation":"Correct: A — Chunking splits long content into passages so the retriever returns the most relevant pieces and stays within context limits. Why not the others: B chunking is not a deduplication step; C chunks are not CRM records; D chunks feed retrieval at runtime, not model retraining.","reference":"Trailhead — Advanced RAG with Data 360 and Agentforce (chunking)"},{"id":"DC-023","domain":"data-360","topic":"Chunking & Indexing","difficulty":"medium","type":"single","stem":"In a Data Library, what does the 'indexing' step accomplish?","options":[{"id":"A","text":"It publishes the indexed content as a brand-new Salesforce Knowledge article"},{"id":"B","text":"It builds the search index by vectorizing chunks for efficient retrieval"},{"id":"C","text":"It deploys the finished agent from the sandbox out into the production org"},{"id":"D","text":"It trains a custom, org-specific LLM directly on the indexed content"}],"correct":["B"],"explanation":"Correct: B — Indexing vectorizes the chunks and builds the search index that retrievers query at runtime. Why not the others: A indexing does not create Knowledge articles; C indexing is unrelated to agent deployment; D indexing prepares data for retrieval — it does not train a model.","reference":"Salesforce Help — Create a Search Index in Data 360"},{"id":"DC-024","domain":"data-360","topic":"Chunking & Indexing","difficulty":"medium","type":"single","stem":"Ursa Major Solar updated three PDFs in a file-based Data Library, but the agent still returns the old text. What is the most likely fix?","options":[{"id":"A","text":"Retrain the base model directly on the three newly updated PDF files"},{"id":"B","text":"Delete the whole agent and then recreate it entirely from scratch"},{"id":"C","text":"Re-upload the updated files and rebuild the index so the new chunks are used"},{"id":"D","text":"Nothing is needed — file-based libraries always reflect document edits instantly"}],"correct":["C"],"explanation":"Correct: C — File-based content must be re-uploaded and re-indexed so the new chunks replace the old ones in the search index. Why not the others: A RAG does not retrain the model; B recreating the agent does not refresh the index; D file-based libraries do not auto-update — that automatic behavior belongs to Knowledge versioning.","reference":"Salesforce Help — Refresh/Rebuild a Search Index"},{"id":"DC-025","domain":"data-360","topic":"Chunking & Indexing","difficulty":"hard","type":"multi","stem":"A team enables enriched chunking on a Data 360 search index to improve retrieval. Beyond the plain-text chunk, which chunk types does enriched indexing generate? (Choose 2)","options":[{"id":"A","text":"A plain chunk that only holds the original source text again"},{"id":"B","text":"A special chunk that retrains the model on that passage"},{"id":"C","text":"A metadata chunk of keywords, entities, topics, and a summary"},{"id":"D","text":"A cleanup chunk that deletes the original source document"},{"id":"E","text":"A synthetic chunk of sample questions the passage can answer"}],"correct":["C","E"],"explanation":"Correct: C, E — Enriched indexing adds, on top of the plain-text chunk, a metadata chunk (keywords, entities, topics, summary) and a synthetic-questions chunk representing questions the passage answers, improving query match. Why not the others: A the plain chunk is the original text, not an enriched addition; B indexing never retrains the model; D indexing does not delete source content.","reference":"Trailhead — Search Index Types in Data 360 (enriched chunks)"},{"id":"DC-026","domain":"data-360","topic":"Chunking & Indexing","difficulty":"medium","type":"single","stem":"A company grounds its agent with a Knowledge-based Data Library. An author publishes a new version of an article. What happens to grounding?","options":[{"id":"A","text":"The admin must manually re-upload that same article as a file on every change"},{"id":"B","text":"Grounding fully breaks until the entire agent is redeployed again"},{"id":"C","text":"The old version keeps serving until the base model gets retrained"},{"id":"D","text":"The library indexes the newly published version automatically for grounding"}],"correct":["D"],"explanation":"Correct: D — Knowledge-based libraries index automatically and use native versioning, so the current published version is grounded with no manual re-upload. Why not the others: A re-uploading is a file-based workflow; B publishing does not require redeploying the agent; C grounding currency has nothing to do with model retraining.","reference":"Salesforce Help — Knowledge Data Library indexing"},{"id":"DC-027","domain":"data-360","topic":"Chunking & Indexing","difficulty":"hard","type":"single","stem":"An architect notices answers are missing key context because chunks are extremely small (roughly one sentence each). What is a reasonable adjustment?","options":[{"id":"A","text":"Reduce the chunk size even further, down to only a few words per chunk"},{"id":"B","text":"Increase chunk size or use section-aware chunking so chunks stay coherent"},{"id":"C","text":"Disable content indexing on the entire library completely for the time being"},{"id":"D","text":"Switch the agent over to an entirely different LLM vendor instead"}],"correct":["B"],"explanation":"Correct: B — Overly small chunks fragment context; larger, section-aware chunks preserve coherent meaning so retrieved passages are useful. Why not the others: A even smaller chunks worsen the problem; C disabling indexing removes grounding entirely; D the issue is chunking configuration, not the model vendor.","reference":"Trailhead — Advanced RAG with Data 360 (chunking strategy)"},{"id":"DC-028","domain":"data-360","topic":"Chunking & Indexing","difficulty":"medium","type":"single","stem":"In a Knowledge Data Library, an admin adds a new Content Field to be indexed. What is the effect?","options":[{"id":"A","text":"Adding or updating content fields triggers re-indexing so the text is retrievable"},{"id":"B","text":"Content fields simply cannot be changed in any way once the library has been created"},{"id":"C","text":"It permanently deletes the library's existing search index for good"},{"id":"D","text":"It silently converts the entire library over to a file-based source"}],"correct":["A"],"explanation":"Correct: A — Content fields are mutable; adding or updating them triggers re-indexing so their text joins retrieval. Why not the others: B content fields are the editable ones (Identifying Fields are immutable); C re-indexing rebuilds rather than permanently deletes grounding; D changing content fields does not change the source type.","reference":"Salesforce Help — Update content fields (triggers indexing)"},{"id":"DC-029","domain":"data-360","topic":"Retrievers","difficulty":"easy","type":"single","stem":"In Agentforce RAG, what is the primary job of a retriever?","options":[{"id":"A","text":"To train the underlying large language model on the grounding data"},{"id":"B","text":"To deploy finished agents from a sandbox into the production org"},{"id":"C","text":"To search the index and return the most relevant chunks that ground the prompt"},{"id":"D","text":"To author brand-new Salesforce Knowledge articles for the team"}],"correct":["C"],"explanation":"Correct: C — A retriever queries the search index and returns the most relevant chunks or records that are injected into the prompt to ground the response. Why not the others: A retrievers do not train models; B deployment is a separate concern; D retrievers read indexed content, they do not author Knowledge.","reference":"Salesforce Help — Retrievers in AI Models"},{"id":"DC-030","domain":"data-360","topic":"Retrievers","difficulty":"medium","type":"single","stem":"When Northern Trail Outfitters creates a Data Library, they notice a retriever already exists without them building one. Why?","options":[{"id":"A","text":"This retriever was silently copied from another connected Salesforce org"},{"id":"B","text":"A default retriever is created automatically with the search index"},{"id":"C","text":"The agent auto-generates one only after 100 completed conversations"},{"id":"D","text":"Retrievers must always be fully hand-coded in Apex code before they can be used"}],"correct":["B"],"explanation":"Correct: B — Creating a Data Library auto-provisions a default retriever over its search index with default settings. Why not the others: A retrievers are not copied across orgs; C retriever creation is not gated on conversation volume; D custom retrievers are optional — a default one is created automatically.","reference":"Trailhead — Enhance Agents with RAG (default components)"},{"id":"DC-031","domain":"data-360","topic":"Retrievers","difficulty":"medium","type":"single","stem":"Cloud Kicks wants a retriever that returns only the 'Answer' field from an FAQ DMO and filters to published FAQs. Which retriever type gives this control?","options":[{"id":"A","text":"The default retriever, which cannot be customized in any way at all"},{"id":"B","text":"An ensemble retriever, which can only merge together other existing retrievers"},{"id":"C","text":"No retriever, since grounding fields are always fixed by Salesforce"},{"id":"D","text":"A custom Individual Retriever, where you pick the returned fields and filters"}],"correct":["D"],"explanation":"Correct: D — A custom Individual Retriever (built in AI Models) lets you specify exactly which fields to return and apply filters for pinpoint accuracy. Why not the others: A a default retriever uses default settings, so you build a custom one; B an ensemble retriever merges retrievers rather than defining fields and filters for one source; C returned fields and filters are configurable, not fixed.","reference":"Salesforce Help — Create an Individual Retriever (AI Models)"},{"id":"DC-032","domain":"data-360","topic":"Retrievers","difficulty":"medium","type":"multi","stem":"An admin is building a custom retriever in AI Models. Which of the following can they configure? (Choose 3)","options":[{"id":"A","text":"The base LLM's internal training weights and biases"},{"id":"B","text":"Which specific fields the retriever returns in its results"},{"id":"C","text":"The customer's account password reset policy settings"},{"id":"D","text":"Filters that limit which records or chunks stay eligible"},{"id":"E","text":"The maximum number of results the retriever will return"}],"correct":["B","D","E"],"explanation":"Correct: B, D, E — A custom retriever lets you set the returned fields, apply filters, and cap the number of results (the default is 20; a lower value often improves quality). Why not the others: A retrievers never touch model training weights; C password policy is unrelated to retriever configuration.","reference":"Salesforce Help — Configure a Retriever (AI Models)"},{"id":"DC-033","domain":"data-360","topic":"Retrievers","difficulty":"medium","type":"single","stem":"After creating a retriever, how does it actually get used to ground an agent's answer?","options":[{"id":"A","text":"It can only ever be run from the developer command line tool"},{"id":"B","text":"It is embedded in a prompt template or grounded action the agent runs"},{"id":"C","text":"It is attached directly onto a standard Salesforce report as a component"},{"id":"D","text":"It fully replaces all of the agent's existing configured topics"}],"correct":["B"],"explanation":"Correct: B — A retriever is referenced by a prompt template or grounded action; when the agent invokes it, the retriever supplies relevant context to the prompt. Why not the others: A retrievers run at runtime inside prompts/actions, not only via CLI; C retrievers ground prompts, not reports; D retrievers supply data rather than replace topics.","reference":"Trailhead — Create a Prompt Template that Calls a Retriever"},{"id":"DC-034","domain":"data-360","topic":"Retrievers","difficulty":"hard","type":"single","stem":"A complex agent must simultaneously reference three separate indexes — HR policies, IT support docs, and a benefits DMO — and return a single ranked context. Which retriever design is most appropriate?","options":[{"id":"A","text":"An ensemble retriever consolidating the three retrievers and ranking results"},{"id":"B","text":"Three separate, unrelated agents, one built for each single index"},{"id":"C","text":"A single individual retriever pointed at only the HR index"},{"id":"D","text":"Manually copy text from all three separate sources into the prompt each time"}],"correct":["A"],"explanation":"Correct: A — An ensemble retriever combines multiple retrievers and ranks the merged results, ideal for cross-domain grounding in one prompt. Why not the others: B splitting into three agents breaks the single-response requirement; C one individual retriever covers only one source; D manual copying is not a runtime grounding solution.","reference":"Trailhead — Create an Ensemble Retriever"},{"id":"DC-035","domain":"data-360","topic":"Retrievers","difficulty":"hard","type":"multi","stem":"Which statements about retrievers in Data 360 are TRUE? (Choose 2)","options":[{"id":"A","text":"Increasing the number of returned results always improves quality"},{"id":"B","text":"An individual retriever targets a single search index or source"},{"id":"C","text":"A retriever retrains the base LLM using the chunks that it returns"},{"id":"D","text":"An ensemble retriever merges and ranks results from many retrievers"},{"id":"E","text":"Retrievers can only ever be used with file-based libraries, never DMOs"}],"correct":["B","D"],"explanation":"Correct: B, D — An individual retriever targets one source or index, while an ensemble retriever consolidates and ranks results across several retrievers. Why not the others: A returning more results often adds noise — a lower count (3–5) frequently helps; C retrievers feed prompts, they never retrain the model; E retrievers also work with structured DMOs and Knowledge, not only files.","reference":"Salesforce Help — Individual vs Ensemble Retrievers"},{"id":"DC-036","domain":"data-360","topic":"Retrievers","difficulty":"medium","type":"single","stem":"Pizza Time needs a retriever, configured with the Agentforce Data Library, that filters results using the end user's search query and locale at runtime. Which retriever type fits?","options":[{"id":"A","text":"A static default retriever that completely ignores any runtime input values"},{"id":"B","text":"An ensemble retriever, whose only real purpose is merging sources"},{"id":"C","text":"A dynamic retriever, which reads runtime parameters like query and locale"},{"id":"D","text":"No retriever type is able to use runtime parameters at all"}],"correct":["C"],"explanation":"Correct: C — A dynamic retriever is configured with the Data Library and evaluates runtime parameters (such as the user's query and locale) to filter and fetch results. Why not the others: A a static retriever cannot adapt to runtime locale; B ensemble retrievers merge sources rather than apply runtime parameters; D dynamic retrievers exist precisely to use runtime parameters.","reference":"Salesforce Help — Dynamic Retrievers"},{"id":"DC-037","domain":"data-360","topic":"Search Types","difficulty":"easy","type":"single","stem":"Which search type matches results based on MEANING rather than exact words (e.g., recognizing 'sign in' and 'log in' as similar)?","options":[{"id":"A","text":"Keyword (lexical) search, which matches exact tokens"},{"id":"B","text":"Wildcard filename pattern search across the files"},{"id":"C","text":"Boolean report filtering applied on the records"},{"id":"D","text":"Vector (semantic) search, which matches by meaning"}],"correct":["D"],"explanation":"Correct: D — Vector/semantic search embeds text and matches by meaning, so paraphrases like 'sign in' and 'log in' are recognized as similar. Why not the others: A keyword search matches exact tokens, not meaning; B filename wildcards are not a RAG retrieval method; C report filtering is not semantic retrieval.","reference":"Trailhead — Search Index Types in Data 360 (vector search)"},{"id":"DC-038","domain":"data-360","topic":"Search Types","difficulty":"medium","type":"single","stem":"Ursa Major Solar's customers search using exact part numbers like 'UMS-4400-X'. Pure semantic search keeps returning near-miss parts (e.g., 'UMS-4404-X'). Which search approach best captures exact tokens?","options":[{"id":"A","text":"Vector-only semantic search, actually best for exact part codes"},{"id":"B","text":"Keyword (lexical) matching, strong on exact terms via a hybrid index"},{"id":"C","text":"Disabling the search index on this library completely for now"},{"id":"D","text":"Report-based filtering over the entire agent conversation transcript log"}],"correct":["B"],"explanation":"Correct: B — Keyword/lexical matching excels at exact tokens like part numbers; in Data 360 you get that precision by using a hybrid search index (vector plus keyword). Why not the others: A vector-only returns semantic near-misses on codes; C disabling the index removes grounding; D filtering transcripts does not improve retrieval of part data.","reference":"Salesforce Engineering — Data Cloud Hybrid Search"},{"id":"DC-039","domain":"data-360","topic":"Search Types","difficulty":"medium","type":"single","stem":"Which statement best describes HYBRID search in Data 360?","options":[{"id":"A","text":"It performs only lexical keyword matching on the incoming query"},{"id":"B","text":"It performs only semantic vector matching on the query text"},{"id":"C","text":"It disables all ranking and returns the raw unsorted results"},{"id":"D","text":"It runs vector and keyword search in parallel and fuses the ranked results"}],"correct":["D"],"explanation":"Correct: D — Hybrid search combines semantic (vector) and keyword (lexical) retrieval and fuses the results with a ranker (like Reciprocal Rank Fusion) for the best matches. Why not the others: A and B each describe only one half of hybrid; C hybrid specifically ranks and fuses results rather than disabling ranking.","reference":"Trailhead — Search Index Types in Data 360 (hybrid search)"},{"id":"DC-040","domain":"data-360","topic":"Search Types","difficulty":"hard","type":"single","stem":"An architect must choose between a vector and a hybrid search index for a knowledge base full of domain acronyms, SKUs, and policy names where exact terms matter. Hybrid costs more and adds latency. What is the best recommendation?","options":[{"id":"A","text":"Use hybrid search, since exact terms are critical and it beats each alone"},{"id":"B","text":"Use vector-only search to cut costs, accepting frequent near-misses on codes"},{"id":"C","text":"Use neither approach and simply rely on the base model's general knowledge"},{"id":"D","text":"Use keyword-only and drop all semantic understanding entirely"}],"correct":["A"],"explanation":"Correct: A — When exact domain vocabulary (acronyms, SKUs, policy names) is critical, hybrid's fusion of keyword plus vector gives the best accuracy despite added cost/latency. Why not the others: B vector-only risks near-miss errors on the terms that matter; C the base model is not grounded in company content; D keyword-only loses semantic understanding for natural-language questions.","reference":"Data 360 — Vector vs Hybrid search decision guidance"},{"id":"DC-041","domain":"data-360","topic":"Search Types","difficulty":"medium","type":"multi","stem":"In which situations is a HYBRID search index the strongest choice? (Choose 2)","options":[{"id":"A","text":"Only broad, conversational questions with no exact terms are expected"},{"id":"B","text":"You want to minimize both cost and latency above everything else"},{"id":"C","text":"Queries mix natural-language meaning with exact product codes or SKUs"},{"id":"D","text":"You want to completely eliminate all semantic understanding from the index"},{"id":"E","text":"The domain relies on precise acronyms and policy names matched exactly"}],"correct":["C","E"],"explanation":"Correct: C, E — Hybrid shines when both meaning and exact terms matter, such as mixed natural-language plus SKU queries or domains full of precise acronyms and policy names. Why not the others: A purely conversational queries do well with vector search; B hybrid adds cost/latency, so it is not the pick when minimizing those; D hybrid keeps semantic understanding rather than removing it.","reference":"Data 360 — When to use hybrid search"},{"id":"DC-042","domain":"data-360","topic":"Search Types","difficulty":"medium","type":"single","stem":"Cloud Kicks expects mostly long, conversational questions with lots of synonyms and few exact codes. Which search index type is a sensible default?","options":[{"id":"A","text":"Keyword-only search, which matches only the exact literal query tokens"},{"id":"B","text":"Vector (semantic) search, which handles synonyms and paraphrases well"},{"id":"C","text":"No search index at all; just rely on the prompt text by itself"},{"id":"D","text":"A relational SQL join executed across the source tables"}],"correct":["B"],"explanation":"Correct: B — Vector search handles paraphrasing and synonyms well, a good default for long, conversational questions without exact-term needs. Why not the others: A keyword-only misses synonyms and paraphrases; C without an index there is no grounding; D a SQL join is not a semantic retrieval method for unstructured content.","reference":"Trailhead — Search Index Types in Data 360"},{"id":"DC-043","domain":"data-360","topic":"Search Types","difficulty":"hard","type":"single","stem":"An agent grounded with vector-only search frequently confuses two similarly named products, 'Aurora 200' and 'Aurora 220', giving customers wrong specs. What is the most targeted fix?","options":[{"id":"A","text":"Increase the LLM's sampling temperature setting substantially higher"},{"id":"B","text":"Add more vector dimensions by completely retraining the base model"},{"id":"C","text":"Switch to a hybrid index so keyword matching separates the model numbers"},{"id":"D","text":"Remove the product documentation from grounding for these items altogether"}],"correct":["C"],"explanation":"Correct: C — Similar names and model numbers are a classic vector near-miss; hybrid adds keyword precision to separate 'Aurora 200' from 'Aurora 220'. Why not the others: A higher temperature adds randomness and hurts accuracy; B you change the index/search type, not retrain the model, to fix retrieval; D removing the docs eliminates grounding entirely.","reference":"Salesforce Engineering — Hybrid Search disambiguation"},{"id":"DC-044","domain":"data-360","topic":"Search Types","difficulty":"medium","type":"single","stem":"A team wants to further boost retrieval accuracy by generating extra LLM-built chunks (metadata and synthetic questions) on top of their index, accepting the added cost. What should they enable?","options":[{"id":"A","text":"Keyword-only retrieval mode on the whole index"},{"id":"B","text":"A chunk overlap of zero to fully switch off enrichment"},{"id":"C","text":"Full base-model fine-tuning on the source content"},{"id":"D","text":"Enriched chunks, built on an enriched search index"}],"correct":["D"],"explanation":"Correct: D — Enabling enriched chunks generates extra metadata and synthetic-question chunks that improve match quality, at added cost. Why not the others: A keyword-only mode adds no enriched chunks; B zeroing chunk overlap does not create enriched chunks; C fine-tuning the model is a different, unnecessary approach for improving retrieval.","reference":"Trailhead — Search Index Types (enriched search index)"},{"id":"DC-045","domain":"data-360","topic":"Data 360 Data Model","difficulty":"easy","type":"single","stem":"In Data 360, what is a 'data stream'?","options":[{"id":"A","text":"The set of trained internal weights inside the LLM"},{"id":"B","text":"A configured connection that pulls source data into Data 360"},{"id":"C","text":"A single, already-published Salesforce Knowledge article record"},{"id":"D","text":"A retriever's internal result-ranking algorithm logic"}],"correct":["B"],"explanation":"Correct: B — A data stream ingests data from a source (an object, file, or external system) into Data 360 for processing. Why not the others: A model weights are not a data stream; C a Knowledge article is content, not an ingestion stream; D ranking is a retriever/search concern, not a data stream.","reference":"Salesforce Help — Data Streams in Data 360"},{"id":"DC-046","domain":"data-360","topic":"Data 360 Data Model","difficulty":"medium","type":"single","stem":"An admin ingests data via a stream. Which sequence correctly describes how that data becomes usable in the unified data model?","options":[{"id":"A","text":"The stream lands data in a DLO, which is then mapped to a DMO"},{"id":"B","text":"The stream first creates the DMO, then maps it back onto a DLO"},{"id":"C","text":"The stream writes its data straight into a Knowledge article"},{"id":"D","text":"The stream writes its data directly into the base LLM itself"}],"correct":["A"],"explanation":"Correct: A — Ingested data lands in a Data Lake Object (DLO) and is then mapped to a Data Model Object (DMO) in the standardized model. Why not the others: B the order is reversed — DLOs map to DMOs, not the other way; C streams do not write Knowledge articles; D data does not stream into the model — grounding happens through retrieval.","reference":"Salesforce Help — DLOs and DMOs in Data 360"},{"id":"DC-047","domain":"data-360","topic":"Data 360 Data Model","difficulty":"medium","type":"multi","stem":"Which Data 360 components are part of preparing data so an agent can be grounded on it? (Choose 3)","options":[{"id":"A","text":"Data streams that ingest the raw source data"},{"id":"B","text":"The Einstein Trust Layer's toxicity scoring step"},{"id":"C","text":"A Flow screen component used to collect input"},{"id":"D","text":"Mapping DLOs to DMOs to standardize the model"},{"id":"E","text":"A search index built over the data for retrieval"}],"correct":["A","D","E"],"explanation":"Correct: A, D, E — Grounding prep involves ingesting via data streams, mapping DLOs to DMOs, and building a search index for retrieval. Why not the others: B the Trust Layer's toxicity scoring governs generation safety, not data prep; C a Flow screen component is UI, unrelated to grounding data prep.","reference":"Trailhead — Implement Data 360 for Agentforce"},{"id":"DC-048","domain":"data-360","topic":"Data 360 Data Model","difficulty":"medium","type":"single","stem":"To ground an agent on structured Case data in Data 360, what must be created over the Case DMO?","options":[{"id":"A","text":"One Salesforce Knowledge article created for each Case"},{"id":"B","text":"A file-based Data Library full of exported Case PDFs"},{"id":"C","text":"A search index and a retriever built over the Case DMO"},{"id":"D","text":"Nothing at all; DMOs are automatically searchable by agents"}],"correct":["C"],"explanation":"Correct: C — Structured grounding requires a search index on the DMO plus a retriever the prompt or action uses. Why not the others: A turning cases into Knowledge articles is unnecessary and duplicative; B exporting cases to PDFs is the wrong path for live structured data; D DMOs are not automatically exposed to agents — you build the index and retriever.","reference":"Trailhead — Implement Data 360 for Agentforce (search index on DMO)"},{"id":"DC-049","domain":"data-360","topic":"Data 360 Data Model","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters has the same customer represented in three source systems. They want the agent to use one consolidated profile. Which Data 360 capability produces this?","options":[{"id":"A","text":"Chunking, which merges the customer's separate PDF files together"},{"id":"B","text":"A hybrid search index, which automatically deduplicates all the customers"},{"id":"C","text":"Prompt grounding, which merges all the source records at runtime"},{"id":"D","text":"Identity resolution, unifying source records into one Unified Individual"}],"correct":["D"],"explanation":"Correct: D — Identity resolution matches and reconciles source records into a unified profile (Unified Individual), giving the agent a single consolidated view. Why not the others: A chunking splits documents, it does not reconcile identities; B hybrid search improves retrieval relevance, not identity unification; C prompt grounding retrieves data but does not resolve identities.","reference":"Salesforce Help — Identity Resolution in Data 360"},{"id":"DC-050","domain":"data-360","topic":"Data 360 Data Model","difficulty":"medium","type":"single","stem":"Why is mapping DLOs to DMOs important before grounding an agent on that data?","options":[{"id":"A","text":"Mapping trains the underlying LLM on the full data schema definition"},{"id":"B","text":"Mapping standardizes ingested data into the common model so it can be queried/indexed"},{"id":"C","text":"Mapping permanently deletes all the original ingested source records"},{"id":"D","text":"Mapping publishes the mapped data out as external public web pages"}],"correct":["B"],"explanation":"Correct: B — Mapping to DMOs normalizes ingested data into a standardized model, enabling consistent querying, indexing, and grounding. Why not the others: A mapping aligns schema, it does not train the model; C mapping does not delete source data; D mapping does not publish web pages.","reference":"Salesforce Help — Data Model and Mapping in Data 360"},{"id":"DC-051","domain":"data-360","topic":"Grounding Troubleshooting","difficulty":"medium","type":"single","stem":"After deployment, Universal Containers' agent gives outdated return-policy information; the policy changed last month. What is the best remediation?","options":[{"id":"A","text":"Disable the whole agent completely so it stops answering questions"},{"id":"B","text":"Add a disclaimer warning customers that answers may be outdated"},{"id":"C","text":"Update the source with the current policy, re-index, and re-test the answer"},{"id":"D","text":"Retrain the underlying base LLM directly on the newly changed return policy text"}],"correct":["C"],"explanation":"Correct: C — Trace the grounding source, update the content with the current policy, ensure the retriever references it, re-index, and validate in Conversation Preview. Why not the others: A disabling the agent avoids the problem instead of fixing it; B a disclaimer does not correct the answer; D Agentforce grounds on your data via RAG — you update the data, not retrain the model.","reference":"Salesforce Help — Troubleshoot grounding with Conversation Preview"},{"id":"DC-052","domain":"data-360","topic":"Grounding Troubleshooting","difficulty":"hard","type":"single","stem":"A stakeholder insists the only way to fix an agent that cites an old pricing sheet is to 'retrain the AI model'. How should the specialist respond?","options":[{"id":"A","text":"Agentforce uses RAG; update and re-index the source, no retraining"},{"id":"B","text":"Agree, and go schedule a multi-week model training project"},{"id":"C","text":"Recommend switching the agent over to a completely different LLM vendor"},{"id":"D","text":"Recommend turning grounding off entirely to avoid stale data"}],"correct":["A"],"explanation":"Correct: A — Agentforce grounds on your data via RAG, so correcting the source content and re-indexing resolves stale answers with no model retraining. Why not the others: B retraining is unnecessary and not how RAG works; C the vendor/model is not the issue — the grounding data is; D turning off grounding removes the company-specific accuracy you need.","reference":"Trailhead — RAG grounds on your data (no retraining)"},{"id":"DC-053","domain":"data-360","topic":"Grounding Troubleshooting","difficulty":"hard","type":"multi","stem":"An agent returns outdated answers from a Knowledge Data Library. Which steps belong in a correct troubleshooting workflow? (Choose 3)","options":[{"id":"A","text":"Retrain the base LLM directly on the corrected article text"},{"id":"B","text":"Trace which retriever, index, and source the answer is grounded on"},{"id":"C","text":"Update the source article to the current version and let it re-index"},{"id":"D","text":"Confirm that the retriever references the correct current source"},{"id":"E","text":"Delete the library and use only free-text prompt instructions"}],"correct":["B","C","D"],"explanation":"Correct: B, C, D — Proper troubleshooting traces the grounding source, updates the content (republish/re-index), and confirms the retriever points to the correct current source, then re-tests. Why not the others: A RAG never requires retraining the base model; E abandoning the library for hard-coded instructions removes scalable, current grounding.","reference":"Salesforce Help — Troubleshoot agent grounding quality"},{"id":"DC-054","domain":"data-360","topic":"Grounding Troubleshooting","difficulty":"medium","type":"single","stem":"An agent returns irrelevant results even though the correct article exists and is indexed. Investigation shows the prompt template references a retriever built over a DIFFERENT, older search index. What is the fix?","options":[{"id":"A","text":"Delete every single one of the Knowledge articles across the whole org"},{"id":"B","text":"Point the prompt at the retriever tied to the correct current index"},{"id":"C","text":"Increase the language model's sampling temperature much higher"},{"id":"D","text":"Retrain the base model directly on the correct current search index"}],"correct":["B"],"explanation":"Correct: B — If the prompt uses a retriever over the wrong index, repoint it to the retriever tied to the correct current index so retrieval matches the intended source. Why not the others: A deleting articles removes valid content; C temperature affects wording randomness, not which index is queried; D retraining does not change which retriever or index the prompt uses.","reference":"Salesforce Help — Verify retriever and prompt configuration"},{"id":"DC-055","domain":"data-360","topic":"Grounding Troubleshooting","difficulty":"medium","type":"single","stem":"After updating a grounding source, where can a specialist quickly validate that the agent now returns the corrected answer before a broad release?","options":[{"id":"A","text":"The org's monthly billing, usage, and limits summary page"},{"id":"B","text":"The Knowledge article's printable print-preview layout in the browser"},{"id":"C","text":"The data stream's ingestion refresh history status log only"},{"id":"D","text":"Conversation Preview, to test the agent conversationally in Builder"}],"correct":["D"],"explanation":"Correct: D — Conversation Preview lets you interact with the agent and confirm the corrected, grounded answer before release. Why not the others: A billing is unrelated to grounding validation; B an article print view does not test the agent's retrieval; C a refresh log shows ingestion status but not the conversational answer.","reference":"Salesforce Help — Test agents in Conversation Preview"},{"id":"DC-056","domain":"data-360","topic":"Grounding Troubleshooting","difficulty":"hard","type":"single","stem":"Pizza Time uploaded a new policy PDF to a file-based Data Library an hour ago, but the agent says it has no information on the topic. Index status shows 'in progress'. What is the most likely explanation?","options":[{"id":"A","text":"File-based libraries simply can never index PDF files at all"},{"id":"B","text":"Indexing is not done; content is retrievable once the build completes"},{"id":"C","text":"The whole agent must first be fully rebuilt again from scratch"},{"id":"D","text":"The base model needs complete retraining before it can learn the new PDF"}],"correct":["B"],"explanation":"Correct: B — New file content is retrievable only after the search index build finishes; an 'in progress' status means indexing is still running. Why not the others: A file-based libraries do index PDFs; C rebuilding the agent will not speed up indexing; D RAG does not require model retraining to use new documents.","reference":"Salesforce Help — Monitor Data Library index status"},{"id":"DC-057","domain":"data-360","topic":"Personalization","difficulty":"medium","type":"single","stem":"Cloud Kicks wants its agent to greet a known customer with recommendations based on their past purchases and product interests stored across systems. Which Data 360 capability enables this personalization?","options":[{"id":"A","text":"Ground the prompt on the customer's Unified Individual profile in Data 360"},{"id":"B","text":"Increase the chunk overlap setting on the whole FAQ index"},{"id":"C","text":"Switch the agent over to a much larger, more capable LLM model"},{"id":"D","text":"Add a static list of top-selling items to everyone's prompt"}],"correct":["A"],"explanation":"Correct: A — Grounding on the unified profile lets the agent personalize using the customer's consolidated purchases and interests from Data 360. Why not the others: B chunk overlap affects document retrieval, not personalization; C a bigger model does not add customer-specific data; D a static top-sellers list is not personalized to the individual.","reference":"Trailhead — Personalize with Unified Profiles (Data 360)"},{"id":"DC-058","domain":"data-360","topic":"Personalization","difficulty":"hard","type":"single","stem":"An architect wants the agent to reference a specific customer's last three orders during a chat. Which approach is correct?","options":[{"id":"A","text":"Upload every customer's full order history as PDF files to a file library"},{"id":"B","text":"Put all customers' orders into the agent's static instructions"},{"id":"C","text":"A retriever over the order DMO, filtered to the current profile"},{"id":"D","text":"Retrain the base model nightly on all of the incoming order data"}],"correct":["C"],"explanation":"Correct: C — Personalized, record-specific data is best served by a structured retriever over the order DMO, filtered to the current customer's unified profile. Why not the others: A PDF exports of orders are stale and unscalable; B static instructions cannot hold per-customer live data; D nightly retraining is unnecessary and not how grounding works.","reference":"Salesforce Help — Ground agents on structured customer data"},{"id":"DC-059","domain":"data-360","topic":"Personalization","difficulty":"medium","type":"multi","stem":"With a unified customer profile from Data 360 identity resolution, which personalization outcomes become possible for an agent? (Choose 2)","options":[{"id":"A","text":"Automatically retraining the LLM for each individual customer"},{"id":"B","text":"Guaranteeing exact keyword matches on all the part numbers"},{"id":"C","text":"Fully eliminating the need for any retriever at all here"},{"id":"D","text":"Referencing the customer's consolidated cross-system purchase history"},{"id":"E","text":"Tailoring recommendations to the individual's known product interests"}],"correct":["D","E"],"explanation":"Correct: D, E — A unified profile lets the agent reference consolidated cross-system purchase history and tailor recommendations to the individual's interests. Why not the others: A personalization uses grounding, not per-customer model retraining; B exact part-number matching is a search-type (hybrid) concern, not a profile outcome; C you still need a retriever to fetch the profile data.","reference":"Salesforce Help — Unified profiles for personalization"},{"id":"DC-060","domain":"data-360","topic":"Personalization","difficulty":"medium","type":"single","stem":"Ursa Major Solar wants agent greetings personalized with each customer's current loyalty tier, which updates daily in Data 360. Which grounding choice keeps the greeting accurate?","options":[{"id":"A","text":"Hard-code all of the loyalty tiers into the prompt template"},{"id":"B","text":"Ground on the structured loyalty field via a retriever over the profile"},{"id":"C","text":"Upload a monthly PDF listing all of the loyalty tiers into a file library"},{"id":"D","text":"Retrain the whole model every time a customer's tier changes"}],"correct":["B"],"explanation":"Correct: B — Grounding on the structured, current loyalty field (via a retriever over the unified profile/DMO) ensures the greeting reflects the latest daily value. Why not the others: A hard-coded tiers cannot reflect daily changes; C a monthly PDF is stale and not per-customer; D retraining per change is impractical and unnecessary for grounded data.","reference":"Salesforce Help — Ground agents on unified profile data"},{"id":"GO-001","domain":"governance-observability","topic":"Agent Analytics","difficulty":"easy","type":"single","stem":"A support manager at Universal Containers wants a native, prebuilt way to see aggregated agent performance — total sessions, escalation rate, and CSAT — without building reports from scratch. Which Agentforce capability should they use?","options":[{"id":"A","text":"The Einstein Trust Layer audit trail, which logs prompts and responses for compliance"},{"id":"B","text":"Agent Analytics dashboards, the prebuilt view in Agentforce Observability"},{"id":"C","text":"The Salesforce Optimizer report, which scans the org for unused fields and limits"},{"id":"D","text":"A manual export of raw session logs into a spreadsheet you pivot yourself"}],"correct":["B"],"explanation":"Correct: B — Agent Analytics provides prebuilt dashboards in Agentforce Observability that surface aggregated KPIs like sessions, escalation rate, and CSAT. Why not the others: A is the Trust Layer compliance log, not a performance view; C is Salesforce Optimizer, which only flags org technical debt; D is manual and gives no governed, aggregated dashboard.","reference":"Salesforce Help — Agentforce Observability & Agent Analytics"},{"id":"GO-002","domain":"governance-observability","topic":"Session Tracing","difficulty":"medium","type":"single","stem":"After noticing a spike in escalations on the Agent Analytics dashboard, a Cloud Kicks admin needs to drill into individual conversations to see which topics and actions ran during the failed sessions. Which capability captures this session- and interaction-level detail?","options":[{"id":"A","text":"Salesforce Optimizer, which reports on deprecated components and org limits"},{"id":"B","text":"The Digital Wallet, which itemizes consumption against your credit entitlement"},{"id":"C","text":"A Trust Layer export of per-response toxicity scores saved as raw JSON"},{"id":"D","text":"The Session Tracing Data Model, which captures session and interaction detail"}],"correct":["D"],"explanation":"Correct: D — The Session Tracing Data Model records session/interaction-level detail (topics matched, actions invoked, reasoning steps) so you can drill into specific conversations. Why not the others: A only scans org technical debt; B reports usage and cost, not conversation flow; C captures a safety score, not the topics and actions that ran.","reference":"Salesforce Help — Agentforce Session Tracing"},{"id":"GO-003","domain":"governance-observability","topic":"Agent Analytics","difficulty":"medium","type":"single","stem":"An analyst asks: \"What is the relationship between Agent Analytics dashboards and the Session Tracing Data Model?\" Which statement is most accurate?","options":[{"id":"A","text":"Dashboards show aggregated trends; Session Tracing drills into individual sessions"},{"id":"B","text":"They are simply two different names for one Agent Analytics dashboard view"},{"id":"C","text":"Session Tracing shows the aggregates while dashboards display only single sessions"},{"id":"D","text":"Session Tracing fully replaces dashboards, so aggregate trends are no longer needed"}],"correct":["A"],"explanation":"Correct: A — Agent Analytics dashboards summarize performance in aggregate, and Session Tracing captures the granular session data you drill into for root cause. Why not the others: B treats two distinct layers as one; C reverses their roles; D wrongly claims tracing eliminates the need for aggregate dashboards.","reference":"Salesforce Help — Agentforce Observability"},{"id":"GO-004","domain":"governance-observability","topic":"Agent Analytics","difficulty":"medium","type":"multi","stem":"Northern Trail Outfitters wants to understand which insights the native Agent Analytics dashboards surface out of the box. Which THREE are aggregated performance insights Agent Analytics is designed to provide? (Choose 3)","options":[{"id":"A","text":"The masked-PII audit record captured for one single prompt"},{"id":"B","text":"Escalation and transfer rate measured across all sessions"},{"id":"C","text":"The topics with the lowest resolution scores over time"},{"id":"D","text":"A list of deprecated Apex classes flagged in the org"},{"id":"E","text":"Overall session volume and how it trends week over week"}],"correct":["B","C","E"],"explanation":"Correct: B, C, E — Agent Analytics aggregates escalation/transfer rate, resolution scores by topic, and session volume and trends to guide optimization. Why not the others: A is an Einstein Trust Layer audit-trail record for a single prompt (compliance, not aggregated analytics); D is Salesforce Optimizer output about org technical debt.","reference":"Salesforce Help — Agent Analytics"},{"id":"GO-005","domain":"governance-observability","topic":"Observability","difficulty":"hard","type":"single","stem":"A support manager at Ursa Major Solar wants aggregated metrics — escalation rate, average session duration, and which topics have the lowest resolution scores — to prioritize which actions to optimize. Which native capability best fits?","options":[{"id":"A","text":"The Einstein Trust Layer audit trail, exporting raw token-count and temperature logs"},{"id":"B","text":"The Salesforce Optimizer report, scanning the org for deprecated components and limits"},{"id":"C","text":"Agentforce Observability, pairing Agent Analytics dashboards with Session Tracing"},{"id":"D","text":"A custom Apex trigger that increments a counter every time a session escalates"}],"correct":["C"],"explanation":"Correct: C — Agentforce Observability (Agent Analytics plus Session Tracing) delivers aggregated KPIs and lets you drill into the weakest topics and actions. Why not the others: A logs safety and model data, not aggregated performance KPIs; B only scans org technical debt; D reinvents native analytics by hand and captures just one metric.","reference":"Salesforce Help — Agentforce Observability"},{"id":"GO-006","domain":"governance-observability","topic":"Agent Analytics","difficulty":"medium","type":"single","stem":"A Pizza Time admin installed the Agent Analytics app and wants the dashboards to reflect real conversation activity. What must be true for the dashboards to populate?","options":[{"id":"A","text":"The org must first run Salesforce Optimizer to seed the dashboard with data"},{"id":"B","text":"Zero data retention must be switched off in the Einstein Trust Layer"},{"id":"C","text":"Every prompt template in the agent must first be rebuilt as a Flow"},{"id":"D","text":"Agents must handle live or tested sessions so interaction data is captured"}],"correct":["D"],"explanation":"Correct: D — Dashboards aggregate captured session and interaction data, so real (or tested) agent activity must exist to populate them. Why not the others: A Optimizer is an unrelated technical-debt scan; B zero data retention governs the model provider, not analytics capture; C a template's format has no bearing on analytics.","reference":"Salesforce Help — Agent Analytics Setup"},{"id":"GO-007","domain":"governance-observability","topic":"Session Tracing","difficulty":"medium","type":"single","stem":"While reviewing a single problematic conversation in Session Tracing, what level of detail can a Cloud Kicks admin expect to see?","options":[{"id":"A","text":"Only the total count of sessions the agent handled during that day"},{"id":"B","text":"The topics matched, actions invoked, and flow of that single interaction"},{"id":"C","text":"Aggregated CSAT across every agent for the entire quarter to date"},{"id":"D","text":"A list of unused custom fields that Salesforce Optimizer flagged on objects"}],"correct":["B"],"explanation":"Correct: B — Session Tracing captures interaction-level detail: which topics were matched, which actions ran, and how the conversation progressed. Why not the others: A and C are aggregate dashboard metrics, not a single trace; D is Salesforce Optimizer technical-debt output about fields.","reference":"Salesforce Help — Agentforce Session Tracing"},{"id":"GO-008","domain":"governance-observability","topic":"Observability","difficulty":"easy","type":"single","stem":"In one sentence, what is the primary purpose of Agentforce Observability?","options":[{"id":"A","text":"To monitor and analyze agent performance so teams can improve outcomes"},{"id":"B","text":"To mask PII in the prompt before it is sent to the external LLM"},{"id":"C","text":"To scan the org for deprecated metadata and surface accumulated technical debt"},{"id":"D","text":"To meter each conversation so finance can bill it against credits"}],"correct":["A"],"explanation":"Correct: A — Observability exists to monitor and analyze agent performance so teams can measure outcomes and target improvements. Why not the others: B describes a Trust Layer masking function; C is Salesforce Optimizer's technical-debt scan; D is Digital Wallet billing, not observability.","reference":"Salesforce Help — Agentforce Observability"},{"id":"GO-009","domain":"governance-observability","topic":"Session Tracing","difficulty":"hard","type":"multi","stem":"An analyst at a company sees on the dashboard that the \"Returns\" topic has a low resolution score. Which TWO actions use Agentforce Observability correctly to investigate the root cause? (Choose 2)","options":[{"id":"A","text":"Run Salesforce Optimizer to locate the specific action that keeps failing"},{"id":"B","text":"Disable the Einstein Trust Layer entirely so the \"Returns\" responses come back much faster"},{"id":"C","text":"Open representative \"Returns\" sessions in Session Tracing to see which actions failed"},{"id":"D","text":"Export the Digital Wallet statement to see why the \"Returns\" topic fails"},{"id":"E","text":"Filter Agent Analytics to the \"Returns\" topic to quantify how often it underperforms"}],"correct":["C","E"],"explanation":"Correct: C, E — Quantify the weak topic in Agent Analytics, then drill into specific \"Returns\" sessions with Session Tracing to see the failing actions. Why not the others: A only scans technical debt; B removes safety controls without diagnosing anything; D shows cost and usage, not conversation quality.","reference":"Salesforce Help — Agentforce Observability"},{"id":"GO-010","domain":"governance-observability","topic":"Agent Analytics","difficulty":"medium","type":"single","stem":"Universal Containers wants standard, Salesforce-maintained dashboards for agent KPIs before investing in custom reporting. What is the recommended first step?","options":[{"id":"A","text":"Build every performance dashboard from scratch in CRM Analytics before launch"},{"id":"B","text":"Rely solely on the Trust Layer audit trail as the source for those KPIs"},{"id":"C","text":"Use the Salesforce Optimizer report as the primary source for agent KPIs"},{"id":"D","text":"Adopt the prebuilt Agent Analytics dashboards, extending with custom reports"}],"correct":["D"],"explanation":"Correct: D — Start with the prebuilt Agent Analytics dashboards for standard KPIs, then extend with custom reports as needs grow. Why not the others: A discards ready-made value; B the audit trail is compliance logging, not a KPI dashboard; C Optimizer only measures org technical debt.","reference":"Salesforce Help — Agent Analytics"},{"id":"GO-011","domain":"governance-observability","topic":"Performance Metrics","difficulty":"medium","type":"single","stem":"A Cloud Kicks executive asks which metric best indicates that the agent is resolving customer issues without needing a human. Which metric?","options":[{"id":"A","text":"Average session duration, measured end to end for each chat"},{"id":"B","text":"The total number of prompt templates configured in the agent"},{"id":"C","text":"Deflection rate, the share of issues resolved through self-service"},{"id":"D","text":"The count of distinct topics enabled on the agent right now"}],"correct":["C"],"explanation":"Correct: C — Deflection (self-service resolution) rate measures conversations the agent resolves without a human handoff. Why not the others: A measures length, not resolution; B counts build-time templates; D counts configured topics, not outcomes.","reference":"Salesforce Help — Agent Performance Metrics"},{"id":"GO-012","domain":"governance-observability","topic":"Performance Metrics","difficulty":"medium","type":"single","stem":"Northern Trail Outfitters sees its escalation (transfer-to-human) rate climbing month over month. What does this most directly indicate?","options":[{"id":"A","text":"That post-interaction CSAT is guaranteed to be trending upward"},{"id":"B","text":"A growing share of conversations the agent cannot resolve on its own"},{"id":"C","text":"That the org has accumulated too many unused custom fields"},{"id":"D","text":"That zero data retention was misconfigured somewhere in the Trust Layer"}],"correct":["B"],"explanation":"Correct: B — A rising escalation/transfer rate means more conversations are handed to humans, signaling gaps in the agent's coverage. Why not the others: A escalation guarantees nothing about satisfaction; C unused fields are Salesforce Optimizer territory; D zero data retention governs provider data handling, unrelated to escalations.","reference":"Salesforce Help — Agent Performance Metrics"},{"id":"GO-013","domain":"governance-observability","topic":"Performance Metrics","difficulty":"medium","type":"single","stem":"Pizza Time wants to know whether customers are happy after chatting with the agent. Which metric is the most direct measure?","options":[{"id":"A","text":"Post-interaction CSAT, the score customers give after the chat"},{"id":"B","text":"Session volume, the raw number of conversations handled each day"},{"id":"C","text":"The number of separate actions configured under each topic in the agent"},{"id":"D","text":"Deflection rate, the share of chats resolved without a handoff"}],"correct":["A"],"explanation":"Correct: A — Post-interaction CSAT surveys directly capture how satisfied customers are with the experience. Why not the others: B counts activity, not satisfaction; C is a build-time configuration count; D shows resolution without handoff but not stated happiness.","reference":"Salesforce Help — Agent Performance Metrics"},{"id":"GO-014","domain":"governance-observability","topic":"Metric Selection","difficulty":"hard","type":"multi","stem":"A support director at Universal Containers asks: \"Is the agent reducing case volume while keeping customers satisfied?\" Which THREE metrics together best answer this question? (Choose 3)","options":[{"id":"A","text":"Deflection, the self-service resolution rate across sessions"},{"id":"B","text":"The number of prompt templates the team has published so far"},{"id":"C","text":"Escalation rate, how often chats transfer to a human agent"},{"id":"D","text":"Post-interaction CSAT gathered right after each conversation"},{"id":"E","text":"The count of deprecated Apex classes Optimizer found in the org"}],"correct":["A","C","D"],"explanation":"Correct: A, C, D — Deflection and escalation rates show whether the agent absorbs case volume, and CSAT confirms customers stay satisfied. Why not the others: B is a build-time template count, not an outcome; E is Salesforce Optimizer technical-debt data.","reference":"Salesforce Help — Agent Performance Metrics"},{"id":"GO-015","domain":"governance-observability","topic":"Metric Selection","difficulty":"medium","type":"single","stem":"An analyst proposes measuring agent success solely by \"total conversations handled.\" Why is this insufficient on its own?","options":[{"id":"A","text":"Volume simply cannot be measured anywhere within the Agent Analytics product"},{"id":"B","text":"Volume is strictly a Trust Layer compliance metric and nothing else"},{"id":"C","text":"Volume alone can't show whether chats were resolved or customers satisfied"},{"id":"D","text":"Volume is visible only inside the Salesforce Optimizer health report"}],"correct":["C"],"explanation":"Correct: C — Total volume is an activity metric; without resolution/deflection and CSAT you can't tell if outcomes are good. Why not the others: A volume is readily available in Agent Analytics; B it isn't a Trust Layer compliance metric; D it isn't sourced from Salesforce Optimizer.","reference":"Salesforce Help — Agent Performance Metrics"},{"id":"GO-016","domain":"governance-observability","topic":"Performance Metrics","difficulty":"medium","type":"single","stem":"Ursa Major Solar wants to know how often conversations reach a natural conclusion instead of being abandoned midway. Which metric fits?","options":[{"id":"A","text":"Average tokens per response returned by the underlying model"},{"id":"B","text":"The number of grounding knowledge sources attached to each topic"},{"id":"C","text":"The PII masking rate recorded by the Einstein Trust Layer"},{"id":"D","text":"Conversation completion rate, how often sessions reach an end"}],"correct":["D"],"explanation":"Correct: D — Completion rate captures how many sessions reach a proper conclusion instead of being abandoned. Why not the others: A is a model-level detail, not completion; B counts grounding configuration; C is a Trust Layer safety measure.","reference":"Salesforce Help — Agent Performance Metrics"},{"id":"GO-017","domain":"governance-observability","topic":"Metric Selection","difficulty":"hard","type":"single","stem":"Cloud Kicks notices the agent's average handling time is much shorter than human reps, but wants to be sure faster isn't worse. Which pairing of metrics best validates that speed isn't hurting quality?","options":[{"id":"A","text":"Average handling time reviewed together with the total number of topics"},{"id":"B","text":"Average handling time reviewed together with resolution rate and CSAT"},{"id":"C","text":"Session volume reviewed together with the count of Apex classes"},{"id":"D","text":"Handling time reviewed together with Digital Wallet credit spend"}],"correct":["B"],"explanation":"Correct: B — Pair speed (handling time) with resolution rate and CSAT to confirm faster chats still resolve issues and satisfy customers. Why not the others: A topic count is configuration, not quality; C is unrelated technical debt; D shows cost, not conversation quality.","reference":"Salesforce Help — Agent Performance Metrics"},{"id":"GO-018","domain":"governance-observability","topic":"Performance Metrics","difficulty":"medium","type":"single","stem":"A company wants to identify which specific topics the agent handles poorly so it can improve them. Which metric, broken out by topic, is most useful?","options":[{"id":"A","text":"Resolution or coherence score broken out for each topic"},{"id":"B","text":"Total org storage consumed across all objects and files"},{"id":"C","text":"The number of permission sets assigned to the agent user"},{"id":"D","text":"The overall user login rate reported across the entire org this month"}],"correct":["A"],"explanation":"Correct: A — Resolution/coherence score by topic pinpoints which topics underperform, guiding targeted improvement. Why not the others: B, C, and D are org/admin metrics unrelated to per-topic agent quality.","reference":"Salesforce Help — Agent Analytics"},{"id":"GO-019","domain":"governance-observability","topic":"Metric Selection","difficulty":"hard","type":"multi","stem":"Northern Trail Outfitters' leadership wants to gauge adoption of a newly launched service agent. Which TWO metrics most directly reflect adoption? (Choose 2)","options":[{"id":"A","text":"The count of deprecated flows Optimizer found in the org"},{"id":"B","text":"The number of active users or customers engaging the agent"},{"id":"C","text":"The agent's average response temperature setting per single reply"},{"id":"D","text":"The volume of sessions and conversations trending over time"},{"id":"E","text":"The number of masked entities recorded in the audit trail"}],"correct":["B","D"],"explanation":"Correct: B, D — Adoption shows up as how many users engage the agent and how sess
