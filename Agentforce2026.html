"D","text":"Conditional content that varies by grounded values"},{"id":"E","text":"Turning off the Einstein Trust Layer entirely"}],"correct":["C","D"],"explanation":"Correct: C and D — merge-field grounding and conditional content let one template adapt per record. Why not the others: A many templates is the opposite of scalable; B hard-coding ignores per-record data; E disabling governance adds no adaptability.","reference":"Salesforce Help — Dynamic Content in Prompt Templates"},{"id":"PE-060","domain":"prompt-engineering","topic":"Dynamic Content","difficulty":"hard","type":"single","stem":"Ursa Major Solar wants a prompt to output a short summary plus a priority label (High, Medium, or Low) that a Flow will use to route cases. What is the best design?","options":[{"id":"A","text":"Return a long essay; let the Flow find the priority word"},{"id":"B","text":"Have reps read it and set priority by hand each time"},{"id":"C","text":"Use a Sales Email template to try to handle the case routing"},{"id":"D","text":"Return a structured summary plus a set priority value"}],"correct":["D"],"explanation":"Correct: D — a structured summary plus a constrained priority value integrates cleanly with the Flow. Why not the others: A essays are unreliable to parse; B manual routing defeats automation; C Sales Email isn't for case routing.","reference":"Salesforce Help — Structured Output from Prompts"},{"id":"TDM-001","domain":"testing-deployment","topic":"Batch vs Ad-hoc Testing","difficulty":"medium","type":"single","stem":"Universal Containers is preparing to launch a service agent. Before deploying, the admin wants to validate that the agent responds correctly across a broad, repeatable set of scenarios rather than relying on a few informal chats. What is the best approach?","options":[{"id":"A","text":"Have three colleagues each hold one informal chat with the agent and share their general impressions afterward."},{"id":"B","text":"Deploy the agent to production first and fix issues reactively as customers report them in live chats."},{"id":"C","text":"Build test cases in Testing Center, run the agent against them in a batch, review pass/fail, then deploy."},{"id":"D","text":"Spot-check only the happy-path utterance in Conversation Preview and assume the edge cases behave too."}],"correct":["C"],"explanation":"Correct: C — Testing Center runs the agent against many predefined scenarios in a repeatable batch and reports pass/fail, so defects surface before deployment. Why not the others: A a handful of ad-hoc chats miss edge cases and aren't repeatable; B deploying first exposes real customers to defects; D a happy-path spot-check ignores edge and negative cases.","reference":"Salesforce Help — Agentforce Testing Center"},{"id":"TDM-002","domain":"testing-deployment","topic":"Test Cases","difficulty":"medium","type":"single","stem":"A Cloud Kicks admin is authoring test cases in Agentforce Testing Center. For each test case, what should the admin define so an evaluation can compare expected versus actual behavior?","options":[{"id":"A","text":"The utterance plus the expected topic, expected action(s), and the expected response or outcome to compare."},{"id":"B","text":"Only the customer utterance, letting reviewers eyeball whatever the agent replies with no set expectation."},{"id":"C","text":"An Apex test class with assertions that exercises the agent's underlying logic instead of a declarative case."},{"id":"D","text":"The production URL where the agent is embedded, so the run knows which live site to open during testing."}],"correct":["A"],"explanation":"Correct: A — a Testing Center test case pairs the input utterance with the expected topic, action(s), and outcome, which the run compares against what the agent actually did. Why not the others: B the response is exactly what's evaluated, so it can't be left undefined; C Testing Center uses declarative test cases, not Apex test classes; D the embed URL is irrelevant to test-case definition.","reference":"Salesforce Help — Create Test Cases in Testing Center"},{"id":"TDM-003","domain":"testing-deployment","topic":"Evaluations & Scoring","difficulty":"medium","type":"single","stem":"After running a test in Testing Center for Northern Trail Outfitters, the admin reviews the results. What does each test-case evaluation primarily tell the admin?","options":[{"id":"A","text":"Whether the agent chose the expected topic and action(s) and then returned the expected final outcome."},{"id":"B","text":"The server response time in milliseconds for each turn, so slower answers get flagged as failures."},{"id":"C","text":"How many tokens the language model consumed per reply, so the cost of each conversation is tracked."},{"id":"D","text":"The number of users currently chatting with the agent live while the batch evaluation runs against the org."}],"correct":["A"],"explanation":"Correct: A — evaluations judge whether the correct topic/action(s) were chosen and whether the response matches the expected outcome (accuracy/coherence). Why not the others: B and C latency and token counts are operational metrics, not the behavioral pass/fail evaluation; D concurrency is unrelated to a test-case evaluation.","reference":"Salesforce Help — Review Test Results in Testing Center"},{"id":"TDM-004","domain":"testing-deployment","topic":"Test Specs","difficulty":"medium","type":"multi","stem":"An Ursa Major Solar admin is building a robust test specification in Agentforce Testing Center. Which THREE elements should each test case include so evaluations are meaningful? (Choose 3.)","options":[{"id":"A","text":"A representative customer utterance or input that reflects how real users phrase the request."},{"id":"B","text":"The admin's personal Salesforce password, so the test can authenticate into the org as them."},{"id":"C","text":"The expected topic the agent should classify the incoming request into during reasoning."},{"id":"D","text":"The physical server region that is hosting the org, so results can be compared across data centers."},{"id":"E","text":"The expected action(s) the agent should invoke and the expected outcome or final response."}],"correct":["A","C","E"],"explanation":"Correct: A, C, E — a meaningful test case pairs a realistic input with the expected topic, expected action(s), and expected outcome so the evaluation can compare actual against expected. Why not the others: B credentials are never part of a test case and would be a security risk; D the hosting region has no bearing on behavioral testing.","reference":"Salesforce Help — Create Test Cases in Testing Center"},{"id":"TDM-005","domain":"testing-deployment","topic":"Test Case Generation","difficulty":"hard","type":"single","stem":"Pizza Time wants a large, realistic test set quickly instead of hand-writing every case. Which Testing Center capability best helps?","options":[{"id":"A","text":"Test only one utterance and trust the model to generalize automatically to every other scenario."},{"id":"B","text":"Copy the agent's instructions into a spreadsheet, email it to reviewers, and collect their notes."},{"id":"C","text":"Disable evaluations so every case passes automatically and the suite finishes far more quickly."},{"id":"D","text":"Auto-generate test cases (for example, from sample utterances or CRM data) and then refine them."}],"correct":["D"],"explanation":"Correct: D — Testing Center can generate candidate test cases (for example, from utterances or CRM data) that the admin then refines, producing broad coverage fast. Why not the others: A a single utterance can't validate coverage across scenarios; B a spreadsheet email isn't executable testing; C disabling evaluations defeats the purpose.","reference":"Salesforce Help — Generate Agent Test Cases"},{"id":"TDM-006","domain":"testing-deployment","topic":"Regression Testing","difficulty":"medium","type":"single","stem":"Cloud Kicks changed several topic instructions. Before deploying, they want to confirm that previously working scenarios still behave correctly. What should they do?","options":[{"id":"A","text":"Delete the old test cases and only test the newly changed topic to keep the suite small and fast."},{"id":"B","text":"Re-run the existing Testing Center suite as a regression test and compare to the prior baseline."},{"id":"C","text":"Deploy immediately, since only instructions changed and instructions rarely affect agent behavior."},{"id":"D","text":"Ask one power user to try the new topic a single time and deploy if that one attempt looks fine."}],"correct":["B"],"explanation":"Correct: B — re-running the full suite is regression testing; it confirms the changes didn't break previously passing scenarios. Why not the others: A deleting old cases removes regression coverage; C instruction changes can shift the agent's reasoning and must be validated; D a single manual try isn't repeatable coverage.","reference":"Salesforce Help — Regression Testing for Agents"},{"id":"TDM-007","domain":"testing-deployment","topic":"Batch vs Ad-hoc Testing","difficulty":"medium","type":"single","stem":"An admin argues that having the team \"just chat with the agent for a while\" is sufficient testing. Why is a Testing Center batch run preferable?","options":[{"id":"A","text":"It automatically deploys the agent to production the moment every test case in the batch passes."},{"id":"B","text":"It removes any need to ever review the agent's responses again because the scoring is fully automated."},{"id":"C","text":"It guarantees the underlying language model will never change or be updated in a future release."},{"id":"D","text":"It is repeatable, it covers many scenarios consistently, and it produces objective pass/fail results."}],"correct":["D"],"explanation":"Correct: D — batch testing is repeatable and consistent, covering many scenarios with objective scoring, unlike ad-hoc chats. Why not the others: A running tests does not auto-deploy the agent; B reviewers still inspect results even when scoring is automated; C testing does not freeze the model.","reference":"Salesforce Help — Agentforce Testing Center"},{"id":"TDM-008","domain":"testing-deployment","topic":"Evaluations & Scoring","difficulty":"hard","type":"single","stem":"In a Testing Center run for Ursa Major Solar, a test case shows the correct topic was selected but the response was scored as not matching the expected outcome. What is the most reasonable next step?","options":[{"id":"A","text":"Delete the failing test case from the suite so the overall pass rate climbs back above the target."},{"id":"B","text":"Conclude the agent is fine because the topic matched, and close the failing case as a pass instead."},{"id":"C","text":"Investigate the action, grounding, or instructions behind that topic, since routing worked."},{"id":"D","text":"Deactivate Testing Center for now and rely on customers to report any wrong answers in production."}],"correct":["C"],"explanation":"Correct: C — a correct topic but wrong output points to the action, grounding, or instructions within that topic, so that's where to investigate. Why not the others: A deleting failing tests hides real defects; B a matched topic with a wrong answer is still a failure; D disabling the tool and waiting for customer reports doesn't fix the issue.","reference":"Salesforce Help — Review Test Results in Testing Center"},{"id":"TDM-009","domain":"testing-deployment","topic":"Batch vs Ad-hoc Testing","difficulty":"medium","type":"multi","stem":"Northern Trail Outfitters is justifying investment in Agentforce Testing Center. Which TWO are genuine benefits of repeatable batch testing over ad-hoc conversations? (Choose 2.)","options":[{"id":"A","text":"It removes the need to define expected outcomes because scoring becomes fully automatic."},{"id":"B","text":"Consistent coverage of many scenarios, including edge cases, on every single run."},{"id":"C","text":"It permanently prevents any future edits to the agent's topics, actions, or instructions."},{"id":"D","text":"Objective, comparable pass/fail results across versions for detecting regressions."},{"id":"E","text":"It makes the deployed agent completely immune to changes introduced by Salesforce releases."}],"correct":["B","D"],"explanation":"Correct: B, D — batch testing gives consistent multi-scenario coverage and objective, comparable results that reveal regressions across versions. Why not the others: A expected outcomes are required for evaluation; C testing doesn't lock instructions; E releases can still affect behavior, which is exactly why you re-test.","reference":"Salesforce Help — Agentforce Testing Center"},{"id":"TDM-010","domain":"testing-deployment","topic":"Testing Center","difficulty":"easy","type":"single","stem":"What is the primary purpose of Agentforce Testing Center?","options":[{"id":"A","text":"To test an agent's behavior at scale against many scenarios before and after deployment."},{"id":"B","text":"To design the CSS theme, colors, and layout of the chat window customers see on the site."},{"id":"C","text":"To securely store customer payment card information captured during agent conversations."},{"id":"D","text":"To automatically translate the agent's responses into every supported language at runtime."}],"correct":["A"],"explanation":"Correct: A — Testing Center exists to validate agent behavior at scale against defined scenarios. Why not the others: B styling the chat window is unrelated; C it doesn't store payment data; D it isn't a translation tool.","reference":"Trailhead — Agentforce Testing Center"},{"id":"TDM-011","domain":"testing-deployment","topic":"Conversation Preview","difficulty":"medium","type":"single","stem":"While building an agent for Universal Containers in Agent Builder, a developer wants to interact with it conversationally to see how it behaves as they tune it. Which feature should they use?","options":[{"id":"A","text":"The live production Experience Cloud site where real customers reach the agent."},{"id":"B","text":"The Conversation Preview panel built into Agent Builder for interactive testing."},{"id":"C","text":"The Metadata API deploy log that lists every single component moved during the last deployment."},{"id":"D","text":"The Change Set upload screen used to send configuration from the sandbox to production."}],"correct":["B"],"explanation":"Correct: B — Conversation Preview lets you chat with the agent inside Agent Builder while iterating. Why not the others: A testing on the live site risks real customers; C and D deploy logs and change-set screens are for migration, not interactive testing.","reference":"Salesforce Help — Preview Agents in Agent Builder"},{"id":"TDM-012","domain":"testing-deployment","topic":"Reasoning Trace","difficulty":"hard","type":"single","stem":"In Conversation Preview, Cloud Kicks' agent keeps answering an order-status question with a returns response. What should the developer inspect to diagnose why?","options":[{"id":"A","text":"The org's storage usage dashboard, to confirm there is enough room to log the conversation."},{"id":"B","text":"The reasoning/plan trace, to see which topic and action(s) the agent selected and why."},{"id":"C","text":"The browser's network tab, to check whether images and scripts on the page loaded correctly."},{"id":"D","text":"The Salesforce trust status page, to verify the reasoning service is not currently degraded."}],"correct":["B"],"explanation":"Correct: B — the reasoning/plan trace reveals which topic and action(s) the Atlas Reasoning Engine chose, exposing the misclassification. Why not the others: A, C, and D storage usage, page asset loading, and trust status are unrelated to topic selection.","reference":"Salesforce Help — Inspect Agent Reasoning in Agent Builder"},{"id":"TDM-013","domain":"testing-deployment","topic":"Reasoning Trace","difficulty":"hard","type":"single","stem":"The trace shows Ursa Major Solar's agent chose the wrong topic because two topics have overlapping, vague classification descriptions. What is the best fix?","options":[{"id":"A","text":"Switch the org's default language, assuming the misrouting comes from a language mismatch."},{"id":"B","text":"Delete one of the two overlapping topics so the agent simply has fewer choices to weigh."},{"id":"C","text":"Increase the agent's session timeout so it has much more time to think before it classifies the request."},{"id":"D","text":"Clarify and differentiate each topic's scope and classification description, then re-test."}],"correct":["D"],"explanation":"Correct: D — sharpening each topic's description and scope helps the reasoning engine route correctly, and then you re-test. Why not the others: A changing language doesn't affect topic routing here; B deleting a needed topic removes capability; C a longer timeout doesn't fix classification.","reference":"Salesforce Help — Design Effective Agent Topics"},{"id":"TDM-014","domain":"testing-deployment","topic":"Reasoning Trace","difficulty":"medium","type":"single","stem":"Northern Trail Outfitters' agent selects the correct topic but invokes the wrong action. Using the plan trace, what is the most likely root cause to address?","options":[{"id":"A","text":"The action's name, description, or instructions don't clearly say when to use it, so refine them all."},{"id":"B","text":"The org has too many active user licenses, which crowds the reasoning engine's choices."},{"id":"C","text":"The chat window's color contrast is too low, so the model misreads the rendered button labels."},{"id":"D","text":"The agent's welcome message is too short, leaving the model without enough context to pick well."}],"correct":["A"],"explanation":"Correct: A — unclear action names/descriptions or instructions cause the wrong action to be selected; clarifying them fixes routing. Why not the others: B user-license counts don't influence action choice; C button contrast isn't how the model reads actions; D welcome-message length doesn't drive action selection.","reference":"Salesforce Help — Configure Agent Actions"},{"id":"TDM-015","domain":"testing-deployment","topic":"Reasoning Trace","difficulty":"medium","type":"multi","stem":"A Universal Containers developer uses the reasoning/plan trace in Agent Builder to debug behavior. Which THREE things can the trace help reveal? (Choose 3.)","options":[{"id":"A","text":"The end user's saved credit-card number pulled straight from their payment record."},{"id":"B","text":"Which topic the agent classified the incoming request into during its reasoning."},{"id":"C","text":"Which action(s) the agent chose to invoke while handling that particular request."},{"id":"D","text":"The org's exact monthly Salesforce invoice amount for the current billing period."},{"id":"E","text":"The reasoning or plan the agent followed to arrive at the response it produced."}],"correct":["B","C","E"],"explanation":"Correct: B, C, E — the trace surfaces the selected topic, the chosen action(s), and the plan/reasoning behind the response. Why not the others: A exposing stored card numbers would violate security and isn't part of the trace; D billing amounts are unrelated to reasoning.","reference":"Salesforce Help — Inspect Agent Reasoning in Agent Builder"},{"id":"TDM-016","domain":"testing-deployment","topic":"Instruction Iteration","difficulty":"medium","type":"single","stem":"Pizza Time's agent sometimes wanders off-topic and offers unrelated promotions. In Agent Builder, what is the appropriate iterative fix?","options":[{"id":"A","text":"Hide the agent from every user permanently so no one can trigger the off-topic replies."},{"id":"B","text":"Remove all of the agent's topics so it has nothing left to wander toward or talk about."},{"id":"C","text":"Tighten the topic scope and instructions to constrain behavior, then re-test in Preview."},{"id":"D","text":"Increase the model temperature to add more variety, hoping the off-topic promotions become rarer."}],"correct":["C"],"explanation":"Correct: C — constraining scope and instructions and then re-testing is the iterative loop for reducing off-topic replies. Why not the others: A hiding it isn't a fix; B removing topics disables the agent; D more randomness worsens off-topic drift.","reference":"Salesforce Help — Write Effective Agent Instructions"},{"id":"TDM-017","domain":"testing-deployment","topic":"Conversation Preview","difficulty":"medium","type":"single","stem":"Why is iterating with Conversation Preview in a sandbox preferable to testing changes directly against the live production agent?","options":[{"id":"A","text":"It lets you validate the changes without exposing any real customers to unverified behavior."},{"id":"B","text":"Sandboxes run a totally different language model that is guaranteed to never make mistakes."},{"id":"C","text":"Production agents are fully locked and cannot be edited at all once they have been activated live."},{"id":"D","text":"Conversation Preview automatically writes each test result onto the customer's record."}],"correct":["A"],"explanation":"Correct: A — previewing in a sandbox validates changes safely before customers ever see them. Why not the others: B sandboxes don't use a magically perfect model; C production agents can be edited but shouldn't be experimented on live; D preview doesn't write to customer records.","reference":"Salesforce Help — Preview Agents in Agent Builder"},{"id":"TDM-018","domain":"testing-deployment","topic":"Reasoning Trace","difficulty":"hard","type":"single","stem":"The trace shows Cloud Kicks' agent picked the right topic and action, but the action returned no useful data, so the answer was generic. What should the builder check next?","options":[{"id":"A","text":"The org's fiscal year setting, in case the reporting calendar is skewing the returned data."},{"id":"B","text":"The favicon of the site, since a missing icon can interrupt how the page renders replies."},{"id":"C","text":"The number of topics configured in a completely unrelated agent elsewhere in the same org."},{"id":"D","text":"The action's inputs/mappings and the grounding data source it relies on."}],"correct":["D"],"explanation":"Correct: D — a right topic and action but empty result points to the action's input mapping or the grounding source feeding it. Why not the others: A, B, and C fiscal settings, favicons, and unrelated agents don't affect the action's data retrieval.","reference":"Salesforce Help — Ground Agent Actions"},{"id":"TDM-019","domain":"testing-deployment","topic":"Iteration Loop","difficulty":"medium","type":"single","stem":"Which sequence best describes healthy iteration when building an agent in Agent Builder?","options":[{"id":"A","text":"Make every change at once, deploy straight to production, and never test any of it first."},{"id":"B","text":"Make a change, preview and test it, inspect the trace, refine, and repeat before deploying."},{"id":"C","text":"Deploy the empty agent to production first, then design its topics and actions once it is already live."},{"id":"D","text":"Only change the agent's display name over and over until the behavior happens to improve."}],"correct":["B"],"explanation":"Correct: B — the change, preview, inspect, refine loop catches issues early and improves quality before deployment. Why not the others: A deploying untested changes is risky; C you can't meaningfully deploy before designing; D renaming doesn't improve behavior.","reference":"Salesforce Help — Build and Test Agents"},{"id":"TDM-020","domain":"testing-deployment","topic":"Conversation Preview","difficulty":"easy","type":"single","stem":"What does Conversation Preview in Agent Builder let you do?","options":[{"id":"A","text":"Bill customers automatically for the usage they accrue during each conversation."},{"id":"B","text":"Permanently delete the entire production org and all of its stored data at once."},{"id":"C","text":"Interact with the agent to observe and debug its responses while you build."},{"id":"D","text":"Compile the org's Apex triggers and classes and report any build errors found."}],"correct":["C"],"explanation":"Correct: C — Conversation Preview is for interacting with and debugging the agent during building. Why not the others: A, B, and D it doesn't bill customers, delete orgs, or compile Apex.","reference":"Salesforce Help — Preview Agents in Agent Builder"},{"id":"TDM-021","domain":"testing-deployment","topic":"Change Sets","difficulty":"medium","type":"single","stem":"An admin built an agent in a sandbox for Universal Containers and wants to move it to production without writing code. What is the standard approach?","options":[{"id":"A","text":"Screenshot the entire sandbox configuration and rebuild the agent from those saved images."},{"id":"B","text":"Manually recreate every topic, action, and instruction by hand directly inside the production org."},{"id":"C","text":"Create an outbound change set of the agent components, upload it, and deploy the inbound set."},{"id":"D","text":"Email the agent's exported JSON to Salesforce support and ask them to install it for you."}],"correct":["C"],"explanation":"Correct: C — change sets are the standard no-code way to migrate agent metadata from sandbox to production. Why not the others: A rebuilding from screenshots invites mistakes; B manual recreation is error-prone and slow; D support doesn't install agents from emailed JSON.","reference":"Salesforce Help — Deploy Agents with Change Sets"},{"id":"TDM-022","domain":"testing-deployment","topic":"Agent Metadata","difficulty":"medium","type":"single","stem":"Cloud Kicks' team debates whether an agent can be migrated between orgs. Which statement is correct?","options":[{"id":"A","text":"The agent, along with its topics, actions, and prompt templates, is metadata and deploys between orgs."},{"id":"B","text":"Agents live only in the builder UI as runtime state and can never be migrated between orgs."},{"id":"C","text":"Agents can only be moved by exporting a full database backup and importing it into the target."},{"id":"D","text":"Agents must be rebuilt from scratch in every org because nothing about them is portable."}],"correct":["A"],"explanation":"Correct: A — agents and their components are metadata, so standard deployment tools can migrate them. Why not the others: B they aren't UI-only runtime state; C a database backup is not how metadata is migrated; D full rebuilds aren't required.","reference":"Salesforce Help — Agent Metadata and Deployment"},{"id":"TDM-023","domain":"testing-deployment","topic":"DevOps Center","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters wants a source-driven, repeatable pipeline to promote agent changes across multiple sandboxes to production with version control. Which option fits best?","options":[{"id":"A","text":"Copy the metadata files over FTP between the sandbox and the production servers each release."},{"id":"B","text":"Use a single change set uploaded by hand every time, with no version history or tracking."},{"id":"C","text":"Use DevOps Center (or a Metadata API-based CI tool) to manage the deployment pipeline."},{"id":"D","text":"Rebuild the agent by hand in every environment so each org gets its own configuration."}],"correct":["C"],"explanation":"Correct: C — DevOps Center (or a Metadata API-based CI tool) provides source-driven, version-controlled promotion across environments. Why not the others: A orgs aren't migrated via FTP; B untracked manual change sets don't scale or version; D manual rebuilds are error-prone.","reference":"Salesforce Help — DevOps Center"},{"id":"TDM-024","domain":"testing-deployment","topic":"Agent Metadata","difficulty":"medium","type":"multi","stem":"When migrating Ursa Major Solar's agent from sandbox to production, which THREE of the following are agent-related metadata that should be included in the deployment? (Choose 3.)","options":[{"id":"A","text":"The agent (bot) itself together with each of its saved versions."},{"id":"B","text":"The individual live chat transcripts from every past customer conversation."},{"id":"C","text":"Each customer's personal login session cookie saved from their last visit."},{"id":"D","text":"The agent's topics or subagents and the actions those topics invoke."},{"id":"E","text":"The prompt templates the agent relies on to generate its replies."}],"correct":["A","D","E"],"explanation":"Correct: A, D, E — the agent, its topics/actions, and prompt templates are deployable metadata that make up the agent. Why not the others: B chat transcripts are runtime data, not agent metadata; C session cookies are ephemeral runtime artifacts, not metadata.","reference":"Salesforce Help — Agent Metadata and Deployment"},{"id":"TDM-025","domain":"testing-deployment","topic":"Change Sets","difficulty":"medium","type":"single","stem":"A teammate suggests manually rebuilding the agent in production \"because change sets can't handle agents.\" How should you respond?","options":[{"id":"A","text":"Agreed, manual rebuilding really is the only supported way to move an agent into production."},{"id":"B","text":"Change sets and metadata tools do support agents; manual recreation is error-prone."},{"id":"C","text":"Agents cannot be deployed by any tool at all, so recreating them by hand is truly required."},{"id":"D","text":"Only Apex can move an agent, so the whole thing must be rewritten as Apex before deploying."}],"correct":["B"],"explanation":"Correct: B — agent metadata is deployable via change sets and other tools, and manual recreation risks inconsistencies, so it's discouraged. Why not the others: A and C are false because automated deployment is supported; D agents aren't migrated by rewriting them in Apex.","reference":"Salesforce Help — Deploy Agents with Change Sets"},{"id":"TDM-026","domain":"testing-deployment","topic":"Metadata API","difficulty":"medium","type":"single","stem":"A developer at Pizza Time prefers a programmatic deployment they can script and keep in source control. Which is a valid method to deploy agent metadata?","options":[{"id":"A","text":"There is no programmatic option for agents; only the point-and-click UI is supported here."},{"id":"B","text":"Use the browser's print-to-PDF feature to capture the agent and re-enter it in the target."},{"id":"C","text":"Manually type the agent's metadata into the production Developer Console line by line."},{"id":"D","text":"Retrieve and then deploy the agent metadata with the Metadata API via the Salesforce CLI."}],"correct":["D"],"explanation":"Correct: D — the Metadata API (via the Salesforce CLI or similar tooling) is a valid, scriptable, source-controllable deployment path. Why not the others: A a programmatic option does exist; B print-to-PDF isn't deployment; C hand-typing metadata isn't a supported migration.","reference":"Salesforce Help — Metadata API Developer Guide"},{"id":"TDM-027","domain":"testing-deployment","topic":"Packaging","difficulty":"hard","type":"single","stem":"An ISV building a reusable Agentforce solution for many customer orgs wants a distributable, versioned artifact. Which deployment approach is most appropriate?","options":[{"id":"A","text":"Package the agent components (managed or unlocked package) for versioned distribution."},{"id":"B","text":"Send each customer a change set, even though change sets can't leave a related org family."},{"id":"C","text":"Ask every customer's admin to rebuild the whole agent by hand from your documentation."},{"id":"D","text":"Share your own sandbox login with every customer so they can copy the agent themselves."}],"correct":["A"],"explanation":"Correct: A — packaging produces a versioned, distributable artifact suited to deploying the same solution across many orgs. Why not the others: B change sets only work between related orgs, not arbitrary customers; C manual rebuilds don't scale; D sharing logins is insecure and unworkable.","reference":"Salesforce Help — Package Agent Components"},{"id":"TDM-028","domain":"testing-deployment","topic":"Deployment Methods","difficulty":"medium","type":"multi","stem":"Universal Containers' architects are listing ways to move an agent from sandbox to production. Which THREE are legitimate deployment methods? (Choose 3.)","options":[{"id":"A","text":"Manually recreating each agent component by hand in the production org."},{"id":"B","text":"Change sets that move the agent's metadata between related orgs."},{"id":"C","text":"Screenshotting the configuration and rebuilding the agent from images."},{"id":"D","text":"The Metadata API, driven through the Salesforce CLI or DevOps tooling."},{"id":"E","text":"Packaging the components as a managed or unlocked package release."}],"correct":["B","D","E"],"explanation":"Correct: B, D, E — change sets, the Metadata API, and packaging are all supported, automated deployment paths for agent metadata. Why not the others: A and C manual recreation and rebuilding from screenshots are error-prone and aren't real deployment mechanisms.","reference":"Salesforce Help — Deploy Agents Between Orgs"},{"id":"TDM-029","domain":"testing-deployment","topic":"Change Sets","difficulty":"medium","type":"single","stem":"When assembling the outbound change set for Cloud Kicks' agent, what should the admin be careful to include?","options":[{"id":"A","text":"Nothing at all, because change sets rebuild every dependency automatically from scratch."},{"id":"B","text":"Only the agent record itself, since all of its dependencies get auto-created in production later."},{"id":"C","text":"All of the components the agent depends on—topics, actions, prompt templates, and Flows/Apex."},{"id":"D","text":"Only the org's company logo image, which is the sole asset the change set actually needs."}],"correct":["C"],"explanation":"Correct: C — the change set must include the agent plus its dependent components so it deploys intact. Why not the others: A and B dependencies are not auto-created in the target org; D the logo is irrelevant to the agent's function.","reference":"Salesforce Help — Deploy Agents with Change Sets"},{"id":"TDM-030","domain":"testing-deployment","topic":"Sandbox Development","difficulty":"easy","type":"single","stem":"Why should teams build and validate an agent in a sandbox before deploying it to production?","options":[{"id":"A","text":"Because sandboxes are the only environment where an Agentforce agent is allowed to run."},{"id":"B","text":"To develop and test the agent safely without impacting live users, then promote proven changes."},{"id":"C","text":"Because the production org has no ability to store or host an agent's configuration."},{"id":"D","text":"To avoid ever having to test the agent, since sandbox builds are automatically correct."}],"correct":["B"],"explanation":"Correct: B — sandboxes provide a safe build-and-test environment before promoting validated changes to production. Why not the others: A and C agents run in production too; D using a sandbox enables testing rather than removing the need for it.","reference":"Salesforce Help — Sandboxes for Agent Development"},{"id":"TDM-031","domain":"testing-deployment","topic":"Deployment Dependencies","difficulty":"hard","type":"single","stem":"After deploying Universal Containers' agent to production via change set, an action fails because a Flow it calls isn't present. What was the deployment oversight?","options":[{"id":"A","text":"A dependency—the referenced Flow itself—wasn't included and activated in the target org."},{"id":"B","text":"The agent's welcome message was too short for the action to have enough room to run."},{"id":"C","text":"The sandbox used a different font, which changed how the action's inputs were parsed."},{"id":"D","text":"Too many users were online at the moment of deploy, so the action was skipped for now."}],"correct":["A"],"explanation":"Correct: A — the agent's referenced Flow is a dependency that must exist and be active in the target; omitting it breaks the action. Why not the others: B and C greeting length and fonts don't cause action failures; D concurrency isn't the cause of a missing component.","reference":"Salesforce Help — Agent Deployment Dependencies"},{"id":"TDM-032","domain":"testing-deployment","topic":"Permissions & Agent User","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters deployed an agent, but in production it can't access the records it needs. What is the most likely missing dependency?","options":[{"id":"A","text":"The sandbox name didn't match production, so the record links resolved to nothing there."},{"id":"B","text":"The agent's avatar image is the wrong size, so the record panel refuses to load data."},{"id":"C","text":"The org has too few page layouts, leaving the agent no layout to read the records from."},{"id":"D","text":"The required permission set(s) and the agent-user access weren't deployed or assigned."}],"correct":["D"],"explanation":"Correct: D — the agent user's permissions and permission sets govern record access and must be present and assigned in the target. Why not the others: A, B, and C org names, avatars, and layouts don't control the agent's data permissions.","reference":"Salesforce Help — Agent User and Permissions"},{"id":"TDM-033","domain":"testing-deployment","topic":"Grounding Dependencies","difficulty":"hard","type":"single","stem":"Cloud Kicks' agent relies on grounding from a Data Library retriever. After deployment, answers in production are generic and ungrounded. What likely needs attention?","options":[{"id":"A","text":"The agent has too few synonyms configured in its display name for the retriever to work."},{"id":"B","text":"The agent needs a brighter color theme so customers trust the answers it returns to them."},{"id":"C","text":"The sandbox refresh interval is set too long, which stripped the answers of their detail."},{"id":"D","text":"The grounding sources / Data Library must be configured and populated in the production org."}],"correct":["D"],"explanation":"Correct: D — grounding data and its retrievers/indexing are org-specific and must be set up and populated in production for grounded answers. Why not the others: A, B, and C name synonyms, theming, and refresh intervals don't provide grounding data.","reference":"Salesforce Help — Agentforce Data Library"},{"id":"TDM-034","domain":"testing-deployment","topic":"Deployment Dependencies","difficulty":"hard","type":"multi","stem":"Before activating a migrated agent in production for Ursa Major Solar, which THREE dependencies should the admin verify exist in the target org? (Choose 3.)","options":[{"id":"A","text":"Permission sets and agent-user access the agent needs to reach records."},{"id":"B","text":"Referenced Flows, Apex, and connected apps the actions depend on."},{"id":"C","text":"The sandbox's temporary session tokens from the last preview run."},{"id":"D","text":"Grounding sources / Data Library plus the required model access."},{"id":"E","text":"The developer's local browser bookmarks that happen to point at the sandbox org."}],"correct":["A","B","D"],"explanation":"Correct: A, B, D — permissions, referenced automation and connected apps, and grounding/model access are real cross-org dependencies to verify. Why not the others: C session tokens are ephemeral and org-specific; E personal bookmarks are irrelevant.","reference":"Salesforce Help — Agent Deployment Dependencies"},{"id":"TDM-035","domain":"testing-deployment","topic":"Activation","difficulty":"medium","type":"single","stem":"Universal Containers' agent metadata deployed successfully to production, but customers still can't reach it. What step was likely missed?","options":[{"id":"A","text":"Deleting the sandbox where the agent was originally built and tested."},{"id":"B","text":"Activating the agent and enabling it on its channels in production."},{"id":"C","text":"Lowering the org's overall data storage limit to free up room for it."},{"id":"D","text":"Renaming the agent so its label matches the production naming rules."}],"correct":["B"],"explanation":"Correct: B — a deployed agent must be activated and enabled on its channels in the target before users can reach it. Why not the others: A, C, and D deleting sandboxes, changing storage limits, or renaming don't make the agent live.","reference":"Salesforce Help — Activate Agents"},{"id":"TDM-036","domain":"testing-deployment","topic":"Post-Deploy Testing","difficulty":"medium","type":"single","stem":"Immediately after deploying to production, what is the recommended validation step for Pizza Time?","options":[{"id":"A","text":"Immediately delete all of the test cases now that the agent has shipped to production."},{"id":"B","text":"Assume it works fine in production simply because every test case passed back in the sandbox."},{"id":"C","text":"Re-test in production using Testing Center or targeted checks against the production data."},{"id":"D","text":"Turn off conversation logging in production so nothing about the new launch is recorded."}],"correct":["C"],"explanation":"Correct: C — re-testing in the target confirms behavior with production data, permissions, and grounding. Why not the others: A and D deleting tests and disabling logs reduce your ability to verify and monitor; B production dependencies can differ from sandbox.","reference":"Salesforce Help — Validate Agents After Deployment"},{"id":"TDM-037","domain":"testing-deployment","topic":"Model Access","difficulty":"hard","type":"single","stem":"After deployment, Northern Trail Outfitters' agent errors when generating responses in production, though it worked in the sandbox. Which dependency should be checked?","options":[{"id":"A","text":"That the required model access and Einstein generative features are enabled in production."},{"id":"B","text":"That the agent's description has been shortened to fewer characters than the sandbox one."},{"id":"C","text":"That the production org has been given more report folders than the sandbox currently contains."},{"id":"D","text":"That the sandbox the agent came from happened to be refreshed within the last day or two."}],"correct":["A"],"explanation":"Correct: A — generative model access and Einstein settings must be enabled in production for the agent to produce responses. Why not the others: B, C, and D description length, report folders, and refresh timing don't govern model availability.","reference":"Salesforce Help — Enable Einstein Generative AI"},{"id":"TDM-038","domain":"testing-deployment","topic":"Minimizing Disruption","difficulty":"medium","type":"single","stem":"Cloud Kicks must deploy an agent update to a heavily used production org. Which approach minimizes disruption?","options":[{"id":"A","text":"Deploy at the busiest peak time and simply hope that nothing goes wrong during the change."},{"id":"B","text":"Deploy in a low-traffic window, validate, and then roll out carefully with a way to revert."},{"id":"C","text":"Delete the current live agent first, then deploy the replacement several hours later on."},{"id":"D","text":"Disable the entire production org for absolutely everyone during normal business hours to be safe."}],"correct":["B"],"explanation":"Correct: B — deploying in a low-traffic window with validation and a revert path minimizes customer impact. Why not the others: A peak-time deploys maximize risk; C deleting first creates an outage gap; D disabling the org is far more disruptive.","reference":"Salesforce Help — Plan Agent Deployments"},{"id":"TDM-039","domain":"testing-deployment","topic":"Post-Deploy Steps","difficulty":"medium","type":"multi","stem":"After migrating an agent to production for Universal Containers, which THREE steps complete a safe go-live? (Choose 3.)","options":[{"id":"A","text":"Delete the sandbox right away to reclaim the storage space that it uses."},{"id":"B","text":"Turn off the Einstein Trust Layer so that the agent's responses come back much faster."},{"id":"C","text":"Verify permissions, Flows/Apex, grounding, and model access exist in production."},{"id":"D","text":"Activate the agent and enable it on each of its intended production channels."},{"id":"E","text":"Re-test in production and closely monitor the earliest live conversations."}],"correct":["C","D","E"],"explanation":"Correct: C, D, E — verifying dependencies, activating on channels, and re-testing while monitoring are the safe go-live steps. Why not the others: A deleting the sandbox removes your ability to reproduce issues; B disabling the Trust Layer weakens governance and safety.","reference":"Salesforce Help — Validate Agents After Deployment"},{"id":"TDM-040","domain":"testing-deployment","topic":"Data Integrity & Permissions","difficulty":"medium","type":"single","stem":"When promoting an agent that reads and writes CRM records, what must the admin preserve to maintain data integrity and security in production?","options":[{"id":"A","text":"The developer's personal user interface preferences from their own Salesforce profile."},{"id":"B","text":"The exact sandbox record IDs, copied one by one into the matching production records."},{"id":"C","text":"The sandbox's temporary storage cache, moved across so lookups stay warm after go-live."},{"id":"D","text":"Correct object and field-level permissions and sharing for the agent user."}],"correct":["D"],"explanation":"Correct: D — the agent user must have appropriate object and field permissions and sharing so it reads/writes data correctly and securely. Why not the others: A and C personal preferences and caches don't govern data integrity; B record IDs differ across orgs and shouldn't be copied.","reference":"Salesforce Help — Agent User and Permissions"},{"id":"TDM-041","domain":"testing-deployment","topic":"Agent Versioning","difficulty":"medium","type":"single","stem":"Ursa Major Solar wants to make significant changes to a live agent while keeping the current one serving customers. What is the safest approach?","options":[{"id":"A","text":"Duplicate the entire production org just to make the changes in the isolated copy."},{"id":"B","text":"Edit the live version directly in production while customers are actively using the agent."},{"id":"C","text":"Delete the existing agent and start building a brand-new one over again from scratch."},{"id":"D","text":"Build a new agent version, test it, and activate it at cutover while the current one serves."}],"correct":["D"],"explanation":"Correct: D — working on a separate version lets you test before activating, avoiding disruption to the running agent. Why not the others: A duplicating the org is unnecessary and impractical; B live edits risk exposing half-finished changes; C deleting causes an outage.","reference":"Salesforce Help — Manage Agent Versions"},{"id":"TDM-042","domain":"testing-deployment","topic":"Activation & Deactivation","difficulty":"medium","type":"single","stem":"An admin needs to take Pizza Time's agent offline briefly to perform maintenance. Which action accomplishes this cleanly?","options":[{"id":"A","text":"Delete the agent's metadata now and simply rebuild the whole thing later on."},{"id":"B","text":"Deactivate the agent, perform the change, then reactivate it when done."},{"id":"C","text":"Revoke every single user's license so no one is able to reach the agent."},{"id":"D","text":"Shut down the entire production org for the duration of the maintenance work."}],"correct":["B"],"explanation":"Correct: B — deactivating cleanly takes the agent offline for maintenance, and reactivating restores it. Why not the others: A deleting is destructive and unnecessary; C and D revoking licenses or shutting down the org is disproportionate and disruptive.","reference":"Salesforce Help — Activate and Deactivate Agents"},{"id":"TDM-043","domain":"testing-deployment","topic":"Safe Rollout","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters wants to roll out a new agent to customers gradually to limit risk. Which strategy aligns with a safe rollout?","options":[{"id":"A","text":"Release to a limited channel or audience first, monitor with analytics, then expand."},{"id":"B","text":"Enable it for every customer worldwide on day one with no monitoring in place at all."},{"id":"C","text":"Roll it out only after first removing all of the conversation logging from the org."},{"id":"D","text":"Roll it straight to production without ever testing the agent in a sandbox first at all."}],"correct":["A"],"explanation":"Correct: A — a limited initial release with monitoring, then expansion, contains risk during rollout. Why not the others: B a global day-one launch with no monitoring maximizes blast radius; C removing logging blinds you; D skipping sandbox testing is reckless.","reference":"Salesforce Help — Plan a Safe Agent Rollout"},{"id":"TDM-044","domain":"testing-deployment","topic":"Safe Rollout","difficulty":"medium","type":"multi","stem":"Which THREE practices support a safe, low-risk rollout of a new agent version for Universal Containers? (Choose 3.)","options":[{"id":"A","text":"Test the new version in a sandbox and in Testing Center before activating it."},{"id":"B","text":"Skip testing entirely so the new version can be released a lot faster."},{"id":"C","text":"Activate for a limited audience or channel first and monitor early chats."},{"id":"D","text":"Keep the ability to deactivate or revert to the prior version if needed."},{"id":"E","text":"Disable analytics entirely so the monitoring dashboards stay quiet after the launch."}],"correct":["A","C","D"],"explanation":"Correct: A, C, D — pre-activation testing, a limited and monitored release, and a revert path are core safe-rollout practices. Why not the others: B skipping testing increases risk; E disabling analytics removes the monitoring you need.","reference":"Salesforce Help — Plan a Safe Agent Rollout"},{"id":"TDM-045","domain":"testing-deployment","topic":"Rollback","difficulty":"medium","type":"single","stem":"Shortly after activating a new version, Cloud Kicks notices a spike in incorrect answers. What is the fastest way to protect customers?","options":[{"id":"A","text":"Delete the agent entirely and remove it from each and every channel it currently serves on."},{"id":"B","text":"Wait a full week to collect more data while customers keep getting the wrong answers."},{"id":"C","text":"Deactivate the new version, or revert to the last known working one, then investigate."},{"id":"D","text":"Rebuild the agent from scratch directly in production while the errors keep happening."}],"correct":["C"],"explanation":"Correct: C — reverting or deactivating immediately stops customer impact while you diagnose. Why not the others: A deleting is destructive overkill; B waiting prolongs harm; D rebuilding live is slow and risky.","reference":"Salesforce Help — Manage Agent Versions"},{"id":"TDM-046","domain":"testing-deployment","topic":"Agent Versioning","difficulty":"medium","type":"single","stem":"A teammate asks how customers know which agent behavior they get when multiple versions exist. What is the correct concept?","options":[{"id":"A","text":"Versions have no real effect on which behavior customers actually end up experiencing."},{"id":"B","text":"Every version serves customers at the same time, chosen at random for each new chat."},{"id":"C","text":"The oldest version created is the one that always serves customers by default here."},{"id":"D","text":"The active version serves users; other versions exist for editing and testing only."}],"correct":["D"],"explanation":"Correct: D — the active version defines live behavior while inactive versions are for development and testing. Why not the others: A, B, and C customers aren't served random or oldest versions, and versioning clearly affects live behavior.","reference":"Salesforce Help — Manage Agent Versions"},{"id":"TDM-047","domain":"testing-deployment","topic":"Agent Versioning","difficulty":"hard","type":"single","stem":"Ursa Major Solar wants an auditable history of agent changes and the ability to roll back. How do agent versions help?","options":[{"id":"A","text":"Versions capture distinct agent states, enabling controlled activation and rollback."},{"id":"B","text":"Versions automatically email every customer a notice about each change that is made."},{"id":"C","text":"Creating a new version permanently and immediately deletes the previous configuration."},{"id":"D","text":"Versions are only cosmetic labels and have no functional effect on the agent at all."}],"correct":["A"],"explanation":"Correct: A — versions represent discrete configurations you can activate or roll back to, supporting change management. Why not the others: B they don't email customers; C activating a new version doesn't erase prior ones; D they're functional, not cosmetic.","reference":"Salesforce Help — Manage Agent Versions"},{"id":"TDM-048","domain":"testing-deployment","topic":"Activation & Deactivation","difficulty":"medium","type":"single","stem":"Why might an admin need to deactivate an agent, or work in a new version, before making certain structural changes?","options":[{"id":"A","text":"Because an active agent can never be modified at all and always has to be deleted first."},{"id":"B","text":"To avoid disrupting any live conversations and apply the changes in a controlled way."},{"id":"C","text":"To force every user in the org to log out of Salesforce before the edit applies."},{"id":"D","text":"To reduce the org's overall data storage by clearing the agent's cached state."}],"correct":["B"],"explanation":"Correct: B — deactivating or using a new version prevents disruption to live sessions and applies changes in a controlled manner. Why not the others: A agents can be changed via versions rather than deletion; C and D it doesn't log users out or reclaim storage.","reference":"Salesforce Help — Activate and Deactivate Agents"},{"id":"TDM-049","domain":"testing-deployment","topic":"Safe Rollout","difficulty":"hard","type":"single","stem":"After a limited rollout of Northern Trail Outfitters' agent, how should the team decide whether to expand it to all customers?","options":[{"id":"A","text":"Expand based on whichever option happens to be the CEO's favorite color that week."},{"id":"B","text":"Expand it to everyone automatically after 24 hours no matter what the results show."},{"id":"C","text":"Review analytics and Testing Center results, and expand only if the quality bar is met."},{"id":"D","text":"Never expand it under any circumstances at all and keep the pilot audience limited forever."}],"correct":["C"],"explanation":"Correct: C — data-driven expansion uses analytics and test results to confirm readiness. Why not the others: A is arbitrary; B time alone isn't a quality signal; D refusing to expand ignores successful validation.","reference":"Salesforce Help — Monitor Agent Performance"},{"id":"TDM-050","domain":"testing-deployment","topic":"Activation","difficulty":"easy","type":"single","stem":"What does activating an agent do?","options":[{"id":"A","text":"Disables the org's login so that users can no longer sign in."},{"id":"B","text":"Permanently deletes all of the agent's topics and their instructions."},{"id":"C","text":"Converts the agent into a compiled Apex class stored in the org."},{"id":"D","text":"Makes the agent available to serve users on its configured channels."}],"correct":["D"],"explanation":"Correct: D — activation makes the agent live on its channels. Why not the others: A, B, and C it doesn't disable logins, delete topics, or become Apex.","reference":"Salesforce Help — Activate Agents"},{"id":"TDM-051","domain":"testing-deployment","topic":"Instruction Iteration","difficulty":"medium","type":"single","stem":"Over the first month live, Universal Containers notices the agent misunderstands a common request. What is the appropriate maintenance action?","options":[{"id":"A","text":"Leave it exactly as-is because the agent has already been deployed to production once."},{"id":"B","text":"Iterate on the topic's instructions and examples using real conversations, and then re-test."},{"id":"C","text":"Turn the agent off permanently so it can no longer misunderstand that request again."},{"id":"D","text":"Ask customers to reword questions until the phrasing matches what the agent expects."}],"correct":["B"],"explanation":"Correct: B — refining instructions based on real usage and re-testing is normal maintenance to improve accuracy. Why not the others: A deployment isn't the end of improvement; C disabling removes value; D expecting customers to adapt to the agent is poor UX.","reference":"Salesforce Help — Improve Agent Accuracy Over Time"},{"id":"TDM-052","domain":"testing-deployment","topic":"Ongoing Maintenance","difficulty":"medium","type":"multi","stem":"Which THREE are appropriate ongoing maintenance activities for a live Agentforce agent at Cloud Kicks? (Choose 3.)","options":[{"id":"A","text":"Never changing anything at all once the agent has already gone live."},{"id":"B","text":"Iterating on instructions and topics from real conversations and analytics."},{"id":"C","text":"Updating grounding sources when policies or products change over time."},{"id":"D","text":"Deleting every conversation log each and every day just to reclaim storage space."},{"id":"E","text":"Re-running Testing Center periodically, including after each release."}],"correct":["B","C","E"],"explanation":"Correct: B, C, E — refining instructions, keeping grounding current, and re-testing (especially after releases) keep the agent accurate over time. Why not the others: A stagnation lets quality drift; D deleting logs destroys the data needed to monitor and improve.","reference":"Salesforce Help — Maintain and Improve Agents"},{"id":"TDM-053","domain":"testing-deployment","topic":"Grounding Maintenance","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters updates its return policy from 30 to 45 days, but the agent still tells customers \"30 days.\" What maintenance is required?","options":[{"id":"A","text":"Update the grounding source the agent uses now, re-index if needed, and then re-test."},{"id":"B","text":"Change the agent's avatar image to visually signal that the policy has changed."},{"id":"C","text":"Have every single customer restart their browser so the newer policy text loads for them."},{"id":"D","text":"Increase the model temperature so the agent stops repeating the same stale number."}],"correct":["A"],"explanation":"Correct: A — the agent reflects its grounding, so the knowledge / Data Library must be updated (and re-indexed) and then re-tested. Why not the others: B avatars don't change answers; C browser restarts don't update grounding; D temperature doesn't fix stale facts.","reference":"Salesforce Help — Keep Grounding Sources Current"},{"id":"TDM-054","domain":"testing-deployment","topic":"Release Maintenance","difficulty":"hard","type":"single","stem":"A Salesforce seasonal release just rolled out. Why should Ursa Major Solar re-run Testing Center against its production agent?","options":[{"id":"A","text":"Testing Center is only available to use during the actual week of a Salesforce release."},{"id":"B","text":"Releases always break every agent completely, so the agent has to be rebuilt each time."},{"id":"C","text":"Platform and model updates can subtly shift behavior, so regression testing finds drift."},{"id":"D","text":"Re-testing is unnecessary because deployed agents are completely unaffected by any release."}],"correct":["C"],"explanation":"Correct: C — seasonal releases can shift model or platform behavior, so regression testing detects drift. Why not the others: A Testing Center isn't limited to release week; B releases don't necessarily break agents; D agents can be affected, which is why you re-test.","reference":"Salesforce Release Notes — Agentforce"},{"id":"TDM-055","domain":"testing-deployment","topic":"Analytics-driven Maintenance","difficulty":"medium","type":"single","stem":"How should Pizza Time decide which parts of the agent to improve during maintenance?","options":[{"id":"A","text":"Never look at any of the data and rely purely on personal intuition about the agent."},{"id":"B","text":"Randomly change a few of the instructions every week and just see whether anything improves."},{"id":"C","text":"Only change the specific things that the single loudest employee on the team dislikes."},{"id":"D","text":"Use analytics and session data with Testing Center results to target the weakest topics."}],"correct":["D"],"explanation":"Correct: D — analytics and test results pinpoint where the agent underperforms so effort is well targeted. Why not the others: A and C intuition and anecdote without data lead to poor prioritization; B random changes aren't systematic.","reference":"Salesforce Help — Use Analytics to Improve Agents"},{"id":"TDM-056","domain":"testing-deployment","topic":"Continuous Improvement","difficulty":"medium","type":"single","stem":"Which best describes a healthy long-term maintenance cycle for a production agent?","options":[{"id":"A","text":"Deploy the agent one time at launch and then never revisit or touch it again afterward."},{"id":"B","text":"Monitor, find issues via analytics, adjust the instructions and grounding, then re-test."},{"id":"C","text":"Only fix the agent on the rare occasion that it stops responding to customers completely."},{"id":"D","text":"Rebuild the whole agent from scratch every single week regardless of how it performs."}],"correct":["B"],"explanation":"Correct: B — a monitor, adjust, test, release loop sustains and improves quality over time. Why not the others: A set-and-forget causes drift; C waiting for total failure ignores accuracy degradation; D weekly rebuilds are wasteful and risky.","reference":"Salesforce Help — Maintain and Improve Agents"},{"id":"TDM-057","domain":"testing-deployment","topic":"Regression Testing","difficulty":"medium","type":"multi","stem":"At which TWO points is it most important for Universal Containers to re-run Agentforce Testing Center? (Choose 2.)","options":[{"id":"A","text":"Only once, during the very first build, and then never running it again."},{"id":"B","text":"Every single time one customer happens to send the agent one message."},{"id":"C","text":"Before deploying changes to production, as a pre-deployment regression check."},{"id":"D","text":"Never, since all agent testing is considered fully finished at the go-live moment."},{"id":"E","text":"After a Salesforce seasonal release that could affect the agent's behavior."}],"correct":["C","E"],"explanation":"Correct: C, E — regression-test before deploying changes and after seasonal releases that could shift behavior. Why not the others: A one-time testing ignores ongoing change; B per-message testing is impractical and unnecessary; D testing continues well past go-live.","reference":"Salesforce Help — When to Test Agents"},{"id":"TDM-058","domain":"testing-deployment","topic":"Certification Maintenance","difficulty":"easy","type":"single","stem":"To keep the Salesforce Agentforce Specialist credential current, what does Salesforce generally expect of the certified professional?","options":[{"id":"A","text":"Complete periodic, release-aligned maintenance modules on Trailhead to stay current."},{"id":"B","text":"Retake the full proctored certification exam again every single month without any exception."},{"id":"C","text":"Do nothing at all ever, because Salesforce certifications never require any upkeep."},{"id":"D","text":"Rebuild a live production agent once a year and submit it to Salesforce for review."}],"correct":["A"],"explanation":"Correct: A — Salesforce credentials are kept current through periodic, release-aligned maintenance (typically Trailhead modules). Why not the others: B monthly full re-exams aren't required; C credentials do require maintenance; D there's no requirement to submit a production agent.","reference":"Trailhead — Maintain Your Salesforce Certification"},{"id":"TDM-059","domain":"testing-deployment","topic":"Grounding Maintenance","difficulty":"medium","type":"single","stem":"Six months after launch, Cloud Kicks' agent gives outdated product details even though the topics are unchanged. What is the most likely maintenance gap?","options":[{"id":"A","text":"The chat widget needs rounded corners so the newer product info can render properly for users."},{"id":"B","text":"The agent simply needs a new display name to refresh how it answers the questions."},{"id":"C","text":"The org needs several more list views before the agent can read the newer details."},{"id":"D","text":"The grounding sources (knowledge articles / Data Library) weren't kept up to date."}],"correct":["D"],"explanation":"Correct: D — outdated answers with unchanged topics point to stale grounding data that should be refreshed. Why not the others: A, B, and C styling, names, and list views don't affect the accuracy of grounded facts.","reference":"Salesforce Help — Keep Grounding Sources Current"},{"id":"TDM-060","domain":"testing-deployment","topic":"Maintenance Planning","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters wants a sustainable plan so its agent stays accurate as the business and platform evolve. Which plan is best?","options":[{"id":"A","text":"Only take action on the agent when it has completely stopped working for customers."},{"id":"B","text":"Freeze the agent completely and forbid making any changes whatsoever to it after launch."},{"id":"C","text":"Review analytics, refresh grounding, iterate instructions, and re-run Testing Center."},{"id":"D","text":"Replace the agent with a static FAQ page and stop maintaining any of it going forward."}],"correct":["C"],"explanation":"Correct: C — a recurring cycle of analytics review, grounding refresh, instruction iteration, and regression testing keeps the agent accurate as things change. Why not the others: A reacting only to total outages ignores quality decay; B freezing guarantees drift; D abandoning the agent forfeits its value.","reference":"Salesforce Help — Maintain and Improve Agents"}]</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('bank').textContent);
const DOMAINS=[['ai-agents','AI Agents',35,21],['prompt-engineering','Prompt Engineering',20,12],['data-360','Data 360',20,12],['testing-deployment','Testing / Deployment',10,6],['governance-observability','Governance / Observability',10,6],['multi-agent','Multi-Agent Orchestration',5,3]];
const byId=new Map(BANK.map(q=>[q.id,q]));
const KEY='af_offline_v1';
let store={session:null,history:[],wrong:[]},storageOK=true,screen='home',result=null,filter='all',ticker=null;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.history)&&Array.isArray(saved.wrong)){store=saved;store.wrong=store.wrong.filter(id=>byId.has(id));if(store.session&&(!Array.isArray(store.session.ids)||store.session.ids.some(id=>!byId.has(id))))store.session=null;}}catch(e){storageOK=false;}
const root=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const domainName=id=>DOMAINS.find(d=>d[0]===id)?.[1]||id;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));storageOK=true;}catch(e){storageOK=false;}const n=document.getElementById('storage');if(n)n.classList.toggle('hidden',storageOK);}
function notice(){return '<div id="storage" role="status" class="notice '+(storageOK?'hidden':'')+'">瀏覽器無法儲存進度；目前仍可練習，但關閉頁面後資料可能遺失。</div>';}
function footer(){return '<footer>獨立練習工具，非 Salesforce 官方產品。題目及原解析保留英文，未逐題官方驗證。<details><summary>來源與使用說明</summary><p>題庫來自 Fernandoliveira05 / agentforce-specialist-prep，版本 057b2c38eef2fb3fd776afab3f8dc4f94e155c1d。新介面獨立撰寫，未包含原站追蹤程式或外部字型。題庫原專案未見授權檔；此副本供個人學習。</p><p>360 題，各科 60 題；完整模考抽取 21 / 12 / 12 / 6 / 6 / 3 題，105 分鐘。練習門檻設為 72%，不代表正式考試通過預測。題目 reference 僅為原作者提供的文件名稱。</p><p>紀錄僅存於目前瀏覽器。清除瀏覽資料、更換瀏覽器或移動本檔案可能使紀錄無法存取。計時模考在離開或關閉頁面期間仍持續計時。</p><p><a href="https://github.com/Fernandoliveira05/agentforce-specialist-prep" target="_blank" rel="noopener noreferrer">原始題庫</a> · <a href="https://help.salesforce.com/s/articleView?id=005298924&amp;language=en_US&amp;type=1" target="_blank" rel="noopener noreferrer">官方考綱</a>（只有主動點擊連結時才會開啟外部網站）</p></details></footer>';}
function home(){screen='home';stopTimer();const count=store.wrong.length,best=store.history.length?Math.max(...store.history.map(h=>score(h).pct)).toFixed(1)+'%':'—';root.innerHTML=notice()+`<section class="hero"><div><div class="eyebrow">PERSONAL STUDY / 01</div><h1>把每一道題，<br>變成真正懂的觀念。</h1><p class="muted">六大考科、英文原題與解析。選一科練習，或用完整模考檢查準備程度。</p></div><div class="stats"><div class="stat"><b>360</b><span>練習題</span></div><div class="stat"><b>${count}</b><span>待複習錯題</span></div><div class="stat"><b>${best}</b><span>歷次最高分</span></div></div></section>`+(store.session?`<div class="notice row spread"><span>有一份未完成的「${esc(store.session.title)}」，可繼續作答。</span><div class="row"><button class="btn small primary" data-action="resume">繼續練習</button><button class="btn small" data-action="discard">捨棄進度</button></div></div>`:'')+`<div class="grid"><section class="card"><h2>開始一輪練習</h2><label class="field"><span>練習方式</span><select id="mode"><option value="domain">分科練習</option><option value="mock">完整模考 · 60 題 / 105 分鐘</option><option value="mixed">六科隨機練習</option><option value="wrong">錯題複習 · ${count} 題</option></select></label><label class="field" id="domain-field"><span>考科</span><select id="domain">${DOMAINS.map(d=>`<option value="${d[0]}">${d[1]} · ${d[2]}%</option>`).join('')}</select></label><label class="field" id="count-field"><span>題數</span><select id="count"><option value="10">10 題</option><option value="20" selected>20 題</option><option value="30">30 題</option><option value="60">60 題</option><option value="all">全部可用題目</option></select></label><div class="checks" id="options"><label><input type="checkbox" id="instant" checked>每題即時解析</label><label><input type="checkbox" id="timed">啟用計時</label></div><p id="mode-hint" class="muted" style="font-size:13px;margin-top:16px">練習可隨時回到首頁，再繼續作答。</p><button class="btn primary" data-action="start">開始練習 →</button></section><aside class="card accent"><div class="eyebrow">STUDY NOTES</div><h2 style="margin-top:12px">先理解，再選答案。</h2><p>複選題必須選對全部答案才得分。提交後可查看正確選項、解析與各科表現。</p><p>答錯或未答的題目會加入錯題本；之後在新一輪練習答對並交卷，就會移除。</p><p>題號旁可標記待複查，也能記下自己的判斷理由。</p><span class="badge">所有題目已內嵌 · 不需安裝</span></aside></div><section class="section"><h2>考科分布</h2><div class="domains">${DOMAINS.map(d=>`<div class="domain"><b>${d[1]}</b><span>考綱 ${d[2]}% · 題庫 60 題 · 模考 ${d[3]} 題</span></div>`).join('')}</div></section><section class="section card"><div class="row spread"><h2>最近練習</h2>${store.history.length?'<button class="btn small danger" data-action="clear">清除所有紀錄</button>':''}</div>${store.history.length?store.history.slice(0,10).map(h=>`<div class="history-item row spread"><div><b>${esc(h.title)}</b><br><small>${esc(new Date(h.finished).toLocaleString('zh-TW'))} · ${score(h).pct.toFixed(1)}% · ${h.ids.length} 題</small></div><button class="btn small" data-history="${h.uid}">查看解析</button></div>`).join(''):'<p class="muted">完成第一輪後，成績會顯示在這裡。</p>'}</section>`+footer();document.getElementById('mode').addEventListener('change',modeChanged);}
function modeChanged(){const m=document.getElementById('mode').value;document.getElementById('domain-field').classList.toggle('hidden',m!=='domain');document.getElementById('count-field').classList.toggle('hidden',m==='mock');document.getElementById('options').classList.toggle('hidden',m==='mock');document.getElementById('mode-hint').textContent=m==='mock'?'依考綱比例抽題，交卷後才顯示解析。離開頁面期間仍持續計時。':m==='wrong'?'若題數超過錯題數，將使用所有可用錯題。':'題數超過可用題目時，將使用所有可用題目。';}
function start(){const mode=document.getElementById('mode').value;let ids,title;const n=document.getElementById('count').value;const instant=mode!=='mock'&&document.getElementById('instant').checked,timed=mode==='mock'||document.getElementById('timed').checked;if(mode==='mock'){ids=shuffle(DOMAINS.flatMap(d=>shuffle(BANK.filter(q=>q.domain===d[0])).slice(0,d[3]).map(q=>q.id)));title='完整模考';}else{let pool=mode==='wrong'?BANK.filter(q=>store.wrong.includes(q.id)):mode==='domain'?BANK.filter(q=>q.domain===document.getElementById('domain').value):BANK;ids=shuffle(pool).slice(0,n==='all'?pool.length:Number(n)).map(q=>q.id);title=mode==='wrong'?'錯題複習':mode==='domain'?domainName(document.getElementById('domain').value):'六科隨機練習';}if(!ids.length){confirmBox('還沒有錯題','完成練習後，答錯或未答的題目會自動加入錯題本。',()=>{},'知道了');return;}const begin=()=>{store.session={uid:Date.now().toString(36),title,mode,ids,answers:{},checked:{},flags:{},notes:{},index:0,instant,started:Date.now(),deadline:timed?Date.now()+(mode==='mock'?6300:ids.length*105)*1000:null};persist();exam();};if(store.session)confirmBox('取代未完成的練習？','開始新練習會捨棄目前尚未交卷的進度。',begin,'開始新練習');else begin();}
const correct=(s,q)=>{const a=s.answers[q.id]||[];return a.length===q.correct.length&&q.correct.every(id=>a.includes(id));};
function score(s){const total=s.ids.length,good=s.ids.filter(id=>correct(s,byId.get(id))).length;return {good,total,pct:total?good/total*100:0};}
function remaining(){return Math.max(0,Math.ceil((store.session.deadline-Date.now())/1000));}
function fmt(sec){return Math.floor(sec/60).toString().padStart(2,'0')+':'+(sec%60).toString().padStart(2,'0');}
function stopTimer(){if(ticker)clearInterval(ticker);ticker=null;}
function tick(){if(!store.session?.deadline)return;const left=remaining(),el=document.getElementById('timer');if(el){el.textContent=fmt(left);el.classList.toggle('warn',left<=60);}if(left===0){document.getElementById('dialog').close();finish(true);}}
function exam(){screen='exam';stopTimer();const s=store.session;if(!s)return home();if(s.deadline&&remaining()===0)return finish(true);renderQuestion();if(s.deadline)ticker=setInterval(tick,500);}
function renderQuestion(){const s=store.session,q=byId.get(s.ids[s.index]),a=s.answers[q.id]||[],locked=!!s.checked[q.id],answered=s.ids.filter(id=>(s.answers[id]||[]).length).length;root.innerHTML=notice()+`<div class="row spread"><div><div class="eyebrow">${esc(s.title)}</div><small>${esc(domainName(q.domain))} · ${esc(q.id)} · ${esc(q.difficulty)}</small></div><div class="row"><span id="timer" class="timer">${s.deadline?fmt(remaining()):'不限時'}</span><button class="btn small" data-action="home">儲存並回首頁</button></div></div><div class="progress"><i style="width:${(s.index+1)/s.ids.length*100}%"></i></div><div class="exam-layout"><section class="card"><div class="row spread"><span class="badge">第 ${s.index+1} / ${s.ids.length} 題 · 選 ${q.correct.length} 個答案</span><button class="btn small" aria-pressed="${!!s.flags[q.id]}" data-action="flag">${s.flags[q.id]?'★ 已標記':'☆ 標記複查'}</button></div><h1 class="stem" tabindex="-1">${esc(q.stem)}</h1><div>${q.options.map(o=>`<button class="option ${a.includes(o.id)?'selected':''} ${locked&&q.correct.includes(o.id)?'correct':''} ${locked&&a.includes(o.id)&&!q.correct.includes(o.id)?'wrong':''}" data-option="${o.id}" aria-pressed="${a.includes(o.id)}" ${locked?'disabled':''}><span class="letter">${o.id}</span><span>${esc(o.text)}${locked&&q.correct.includes(o.id)?'<small>正確答案</small>':''}${locked&&a.includes(o.id)?'<small>你的選擇</small>':''}</span></button>`).join('')}</div>${s.instant&&!locked?`<button class="btn primary" data-action="check" ${a.length?'':'disabled'}>確認答案並看解析</button>`:''}${locked?`<div class="explanation ${correct(s,q)?'':'bad'}"><b>${correct(s,q)?'答對了':'再理解一下'}</b><p>${esc(q.explanation)}</p><small>原題參考：${esc(q.reference)}</small></div>`:''}<details ${s.notes[q.id]?'open':''}><summary>我的筆記</summary><textarea id="note" aria-label="本題筆記" placeholder="寫下你的判斷理由…">${esc(s.notes[q.id]||'')}</textarea></details><div class="row spread section"><button class="btn" data-action="prev" ${s.index===0?'disabled':''}>← 上一題</button>${s.index<s.ids.length-1?'<button class="btn primary" data-action="next">下一題 →</button>':'<button class="btn primary" data-action="submit">交卷與查看成績</button>'}</div></section><aside class="card"><h3>答題進度</h3><p class="muted">已答 ${answered} / ${s.ids.length}<br>標記 ${Object.values(s.flags).filter(Boolean).length} 題</p><small>綠底：已答 · 金點：待複查</small><div class="nav-scroll"><div class="nav-grid">${s.ids.map((id,i)=>`<button title="第 ${i+1} 題${s.flags[id]?'，已標記':''}" aria-label="第 ${i+1} 題" data-jump="${i}" class="${(s.answers[id]||[]).length?'answered':''} ${i===s.index?'current':''} ${s.flags[id]?'flagged':''}">${i+1}</button>`).join('')}</div></div><button class="btn primary section" data-action="submit">交卷與查看成績</button></aside></div>`;document.getElementById('note').addEventListener('input',e=>{s.notes[q.id]=e.target.value;persist();});}
function answer(id){const s=store.session,q=byId.get(s.ids[s.index]);if(s.checked[q.id])return;let a=s.answers[q.id]||[];s.answers[q.id]=q.correct.length===1?[id]:a.includes(id)?a.filter(x=>x!==id):[...a,id];persist();renderQuestion();}
function submit(){const s=store.session,missing=s.ids.filter(id=>!(s.answers[id]||[]).length).length;confirmBox('確定交卷？',missing?`還有 ${missing} 題未作答，將以答錯計算並加入錯題本。`:'交卷後會顯示成績與所有題目解析。',()=>finish(false),'交卷');}
function finish(auto){const s=store.session;if(!s)return;stopTimer();s.finished=Date.now();s.auto=auto;const wrong=new Set(store.wrong);for(const id of s.ids){if(correct(s,byId.get(id)))wrong.delete(id);else wrong.add(id);}store.wrong=[...wrong];store.history.unshift(s);store.history=store.history.slice(0,20);store.session=null;persist();result=s;filter='all';showResults();}
function showResults(){screen='results';stopTimer();const s=result,r=score(s);root.innerHTML=notice()+`<div class="row spread"><div><div class="eyebrow">SESSION COMPLETE</div><h1>這一輪，學到了什麼？</h1></div><button class="btn" data-action="home">回首頁</button></div>${s.auto?'<div class="notice">時間已到，本輪已自動交卷。</div>':''}<section class="card"><div class="row spread"><div><div class="score">${r.pct.toFixed(1)}<span style="font-size:25px">%</span></div><p>${r.good} / ${r.total} 題正確 · ${r.pct>=72?'達到 72% 練習門檻':'尚未達到 72% 練習門檻'}</p></div><div class="muted">${esc(s.title)}<br>錯題與未答題已更新至錯題本</div></div><div class="domains">${DOMAINS.map(d=>{const ids=s.ids.filter(id=>byId.get(id).domain===d[0]);if(!ids.length)return '';const n=ids.filter(id=>correct(s,byId.get(id))).length;return `<div class="domain"><b>${d[1]}</b><span>${n} / ${ids.length} 題 · ${Math.round(n/ids.length*100)}%</span><div class="bar"><i style="width:${n/ids.length*100}%"></i></div></div>`;}).join('')}</div></section><section class="section card"><div class="row spread"><h2>答案與解析</h2><select id="result-filter" aria-label="解析篩選" style="width:auto"><option value="all" ${filter==='all'?'selected':''}>全部題目</option><option value="wrong" ${filter==='wrong'?'selected':''}>只看錯題 / 未答</option><option value="flagged" ${filter==='flagged'?'selected':''}>只看標記</option></select></div><div id="reviews">${s.ids.filter(id=>filter==='all'||filter==='wrong'&&!correct(s,byId.get(id))||filter==='flagged'&&s.flags[id]).map(id=>{const q=byId.get(id),a=s.answers[id]||[];return `<article class="review-item"><small>${esc(q.id)} · ${esc(domainName(q.domain))} · ${correct(s,q)?'答對':a.length?'答錯':'未答'}${s.flags[id]?' · ★ 已標記':''}</small><h3>${esc(q.stem)}</h3><ul class="answer-list">${q.options.map(o=>`<li class="${q.correct.includes(o.id)?'correct-text':a.includes(o.id)?'wrong-text':''}"><b>${o.id}.</b> ${esc(o.text)} ${q.correct.includes(o.id)?' ✓ 正解':''}${a.includes(o.id)?' ← 你的選擇':''}</li>`).join('')}</ul><div class="explanation">${esc(q.explanation)}<br><small>原題參考：${esc(q.reference)}</small></div>${s.notes[id]?`<p style="margin-top:14px;white-space:pre-wrap"><b>我的筆記：</b>${esc(s.notes[id])}</p>`:''}</article>`;}).join('')||'<p class="muted">這個篩選沒有題目。</p>'}</div></section>`+footer();document.getElementById('result-filter').addEventListener('change',e=>{filter=e.target.value;showResults();});}
function confirmBox(title,body,action,label='確認'){const d=document.getElementById('dialog');document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').textContent=body;const yes=document.getElementById('confirm');yes.textContent=label;yes.onclick=()=>{d.close();action();};document.getElementById('cancel').onclick=()=>d.close();d.showModal();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.option)return answer(b.dataset.option);if(b.dataset.jump!==undefined){store.session.index=Number(b.dataset.jump);persist();return renderQuestion();}if(b.dataset.history){result=store.history.find(h=>h.uid===b.dataset.history);filter='all';return showResults();}const s=store.session;switch(b.dataset.action){case 'start':start();break;case 'resume':exam();break;case 'home':persist();home();break;case 'discard':confirmBox('捨棄未完成進度？','已完成的練習紀錄與錯題本會保留。',()=>{store.session=null;persist();home();},'捨棄');break;case 'clear':confirmBox('清除所有本機紀錄？','將刪除練習紀錄、錯題本及未完成進度，無法復原。',()=>{store={session:null,history:[],wrong:[]};persist();home();},'清除');break;case 'flag':s.flags[s.ids[s.index]]=!s.flags[s.ids[s.index]];persist();renderQuestion();break;case 'check':s.checked[s.ids[s.index]]=true;persist();renderQuestion();break;case 'prev':case 'next':s.index+=b.dataset.action==='next'?1:-1;persist();renderQuestion();break;case 'submit':submit();break;}});
window.addEventListener('pagehide',persist);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&screen==='exam')tick();});
persist();home();
</script>
</body>
