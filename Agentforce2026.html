 tasks are instant; C — synchronous interactions are also possible; D — async has nothing to do with removing security.","reference":"A2A Protocol — long-running tasks"},{"id":"MA-037","domain":"multi-agent","topic":"Agent API","difficulty":"easy","type":"single","stem":"A specialist must let an external system trigger and exchange data with an Agentforce agent programmatically — for example, a company website sends a request and receives a structured response. Which is the correct approach?","options":[{"id":"A","text":"Hard-code the agent's login credentials directly into the website's front-end JavaScript code."},{"id":"B","text":"Email a staff member to copy the agent's answers over to the requesting system by hand each time."},{"id":"C","text":"Use the Agent API so external systems invoke the agent and exchange structured data over REST."},{"id":"D","text":"Export a static list of canned answers each night and serve those instead of calling the agent."}],"correct":["C"],"explanation":"Correct: C — the Agent API provides secure, real-time, programmatic REST access for external systems to invoke an agent and exchange structured data. Why not the others: A — front-end credentials are exposed to everyone and insecure; B — a human copy loop is not real-time or scalable; D — nightly static exports are stale.","reference":"Salesforce Developers — Agent API"},{"id":"MA-038","domain":"multi-agent","topic":"Agent API","difficulty":"medium","type":"single","stem":"Using the Agent API, what is the typical sequence to interact with an agent from an external app?","options":[{"id":"A","text":"Directly edit the agent's underlying metadata on each and every single request the app sends in."},{"id":"B","text":"Retrain the large language model from scratch before each message is sent to the agent."},{"id":"C","text":"Log into the Salesforce web UI by hand to relay each individual message to the agent."},{"id":"D","text":"Start a session, send messages and receive structured responses, then end the session."}],"correct":["D"],"explanation":"Correct: D — the Agent API flow is to create/start a session, exchange messages (requests and structured responses), then end the session. Why not the others: A — you do not edit metadata to hold a conversation; B — no retraining per message; C — the point is programmatic access, not manual UI logins.","reference":"Salesforce Developers — Agent API sessions"},{"id":"MA-039","domain":"multi-agent","topic":"Agent API","difficulty":"medium","type":"single","stem":"How should an external server-to-server application authenticate to the Agent API?","options":[{"id":"A","text":"Embedding the administrator's username and password directly in the client-side application code."},{"id":"B","text":"A connected app using OAuth 2.0 (client credentials flow), keeping the secrets on the server."},{"id":"C","text":"Disabling authentication on the endpoint so the external application can reach it without a login."},{"id":"D","text":"Sharing one personal session cookie among all of the external application's end users at once."}],"correct":["B"],"explanation":"Correct: B — a connected app with OAuth 2.0 (server-side client credentials) is the secure pattern, with secrets kept on the backend. Why not the others: A — client-side credentials are exposed; C — unauthenticated endpoints are unsafe; D — sharing a session cookie is insecure and does not scale.","reference":"Salesforce Help — Connected Apps and OAuth for Agent API"},{"id":"MA-040","domain":"multi-agent","topic":"Agent API","difficulty":"medium","type":"single","stem":"Ursa Major Solar wants to embed an Agentforce agent inside its own custom-built React customer portal (not a standard Salesforce channel) with full control over the UI. Which enables this?","options":[{"id":"A","text":"The Agent API, which gives headless, programmatic access for building fully custom front-ends."},{"id":"B","text":"Exporting the agent as a static PDF document and embedding that document inside the React portal."},{"id":"C","text":"Screen-scraping the Salesforce console UI and replaying its markup inside the custom React portal."},{"id":"D","text":"The favicon.svg file, whose icon markup can be extended to render the agent inside the portal UI."}],"correct":["A"],"explanation":"Correct: A — the Agent API enables headless and custom front-ends by exposing the agent programmatically. Why not the others: B — a static PDF is not interactive; C — screen-scraping is brittle and unsupported; D — a favicon is unrelated.","reference":"Salesforce Developers — Building custom experiences with Agent API"},{"id":"MA-041","domain":"multi-agent","topic":"Agent API","difficulty":"medium","type":"single","stem":"A developer at Cloud Kicks is tempted to call the Agent API directly from browser JavaScript using the client secret. Why is this wrong?","options":[{"id":"A","text":"Browser code is visible to users, exposing the secret; calls should go through a backend proxy."},{"id":"B","text":"Browsers are fundamentally unable to make any outbound network requests to a REST endpoint."},{"id":"C","text":"The Agent API is built to accept requests only from native mobile apps, never from a web browser."},{"id":"D","text":"JavaScript in the browser has no built-in way to parse the JSON that the API returns back."}],"correct":["A"],"explanation":"Correct: A — client-side code is inspectable, so secrets must stay on a backend proxy that authenticates to the API. Why not the others: B — browsers can make requests, so that is not the issue; C — there is no such platform restriction; D — JavaScript parses JSON natively.","reference":"Salesforce Developers — Securing Agent API credentials"},{"id":"MA-042","domain":"multi-agent","topic":"Agent API","difficulty":"hard","type":"multi","stem":"Which statements about the Agentforce Agent API are accurate? (Choose 3)","options":[{"id":"A","text":"It requires no authentication of any kind before a caller may use it."},{"id":"B","text":"It provides real-time, programmatic REST access to invoke an agent."},{"id":"C","text":"It can only ever be used from within the Salesforce Setup menu."},{"id":"D","text":"It returns structured responses that external systems can then parse."},{"id":"E","text":"It lets you integrate an agent into custom or third-party apps."}],"correct":["B","D","E"],"explanation":"Correct: B, D, E — the Agent API is a secure, real-time REST interface that returns structured responses for custom and third-party integrations. Why not the others: A — it requires OAuth authentication; C — it is for programmatic external access, not confined to Setup.","reference":"Salesforce Developers — Agent API overview"},{"id":"MA-043","domain":"multi-agent","topic":"Agent API","difficulty":"medium","type":"single","stem":"When would a company choose the Agent API over a prebuilt channel like Messaging for In-App and Web?","options":[{"id":"A","text":"When they want the least possible control over how the experience looks and feels."},{"id":"B","text":"When they never intend to authenticate any caller that reaches the agent."},{"id":"C","text":"When they need a fully custom or headless integration with programmatic control over requests."},{"id":"D","text":"When they want the agent to avoid returning any structured data to the caller."}],"correct":["C"],"explanation":"Correct: C — the Agent API suits custom or headless builds needing programmatic control, whereas prebuilt channels trade control for convenience. Why not the others: A — the API gives more control, not less; B — it still requires authentication; D — it is designed to return structured data.","reference":"Salesforce Developers — Agent API vs standard channels"},{"id":"MA-044","domain":"multi-agent","topic":"Agent API","difficulty":"medium","type":"single","stem":"An external order system calls an Agentforce agent via the Agent API and needs to act on the result automatically. Why does a structured (for example, JSON) response matter?","options":[{"id":"A","text":"It does not matter at all, since free-form prose is always the easiest format for a machine to act on."},{"id":"B","text":"Structured responses let the calling system parse fields reliably and drive downstream automation."},{"id":"C","text":"Structured responses switch off the Einstein Trust Layer for the duration of that particular call."},{"id":"D","text":"Structured responses always require a human to read and interpret them before any action is taken."}],"correct":["B"],"explanation":"Correct: B — structured responses are machine-parsable, enabling reliable downstream automation. Why not the others: A — free-form text is harder to parse reliably; C — response format does not disable the Trust Layer; D — the point is to avoid a manual step.","reference":"Salesforce Developers — Agent API responses"},{"id":"MA-045","domain":"multi-agent","topic":"Agent API","difficulty":"medium","type":"single","stem":"An Agent API integration should follow least privilege. How is the agent's data access typically scoped?","options":[{"id":"A","text":"Through the agent or integration user's profile and permission sets, limiting objects and fields."},{"id":"B","text":"By granting the connected app every single OAuth scope that the Salesforce platform makes available."},{"id":"C","text":"By running the agent as a Guest user that has been given full write access to the org's records."},{"id":"D","text":"By disabling field-level security so the integration never hits a permission error at any runtime."}],"correct":["A"],"explanation":"Correct: A — access is scoped via the agent or integration user's profile and permission sets. Why not the others: B — granting all scopes violates least privilege; C — a full-write Guest user is dangerous; D — disabling field-level security removes protections.","reference":"Salesforce Help — Agent API user permissions"},{"id":"MA-046","domain":"multi-agent","topic":"Agent API","difficulty":"medium","type":"single","stem":"Northern Trail Outfitters needs its website to get an agent's answer the moment a customer asks, not hours later. Which property of the Agent API meets this?","options":[{"id":"A","text":"It is fundamentally a nightly batch export mechanism that assembles answers for the next morning."},{"id":"B","text":"It only works while completely offline, so answers are prepared and then delivered once reconnected."},{"id":"C","text":"It enforces a mandatory 24-hour processing window before any answer can be returned to the site."},{"id":"D","text":"It supports real-time request and response, including streaming, so answers return immediately."}],"correct":["D"],"explanation":"Correct: D — the Agent API is real-time (with streaming options), returning answers immediately. Why not the others: A — it is not a nightly batch tool; B — it is an online API; C — there is no mandatory 24-hour delay.","reference":"Salesforce Developers — Real-time and streaming with Agent API"},{"id":"MA-047","domain":"multi-agent","topic":"Agent API","difficulty":"hard","type":"multi","stem":"Which are recommended security practices when exposing an Agentforce agent through the Agent API? (Choose 2)","options":[{"id":"A","text":"Authenticate via a connected app with OAuth and keep the secrets stored server-side."},{"id":"B","text":"Put the connected app's client secret directly into public front-end JavaScript code."},{"id":"C","text":"Turn off the Einstein Trust Layer so that agent responses come back a little faster."},{"id":"D","text":"Scope the integration user with a least-privilege permission set for only what it needs."},{"id":"E","text":"Share a single API token publicly so that any caller can reach the agent for convenience."}],"correct":["A","D"],"explanation":"Correct: A, D — OAuth with server-side secrets and a least-privilege integration user are core best practices. Why not the others: B — public secrets are exposed to attackers; C — disabling the Trust Layer removes safety guardrails; E — a public shared token is a serious risk.","reference":"Salesforce Developers — Agent API security best practices"},{"id":"MA-048","domain":"multi-agent","topic":"Agent API","difficulty":"medium","type":"single","stem":"A company website (an external system) needs to send a customer question to the org's Agentforce agent and display the structured reply. Which mechanism is correct?","options":[{"id":"A","text":"MCP, treating the website as an external tool that the agent should call out to for the answer."},{"id":"B","text":"A2A, on the assumption that the company website is itself another autonomous agent to delegate to."},{"id":"C","text":"The Agent API, the inbound programmatic path for external systems to invoke your own agent."},{"id":"D","text":"A nightly CSV export, on the assumption that answer freshness does not really matter to the site."}],"correct":["C"],"explanation":"Correct: C — an external system invoking your agent is the Agent API's inbound use case. Why not the others: A — MCP is for the agent calling out to tools and data, not a website calling in; B — a website is not an agent, so A2A does not apply; D — real-time Q&A needs live data, not a stale export.","reference":"Salesforce Developers — Agent API"},{"id":"MA-049","domain":"multi-agent","topic":"Choosing the mechanism","difficulty":"medium","type":"single","stem":"Match the need to the mechanism: \"An external mobile app must call our Agentforce agent and receive structured answers.\" Best choice?","options":[{"id":"A","text":"MCP, which points outward to let the agent reach external tools and data, not inbound calls."},{"id":"B","text":"The Agent API, so the external mobile app can call the agent and receive structured answers."},{"id":"C","text":"A2A, which handles delegation between two agents rather than an app invoking a single agent."},{"id":"D","text":"Adding one extra topic to the agent, which does not expose any external programmatic access."}],"correct":["B"],"explanation":"Correct: B — external systems invoking your agent programmatically use the Agent API. Why not the others: A — MCP is outbound to tools and data; C — A2A is agent-to-agent; D — a topic does not provide external programmatic access.","reference":"Salesforce Developers — Choosing an interoperability mechanism"},{"id":"MA-050","domain":"multi-agent","topic":"Choosing the mechanism","difficulty":"medium","type":"single","stem":"Match the need to the mechanism: \"Our agent needs standardized access to an external ERP's functions as tools.\" Best choice?","options":[{"id":"A","text":"The Agent API, which instead only lets external systems call inward to invoke your Salesforce agent."},{"id":"B","text":"A2A, which instead handles delegation of a task from one agent to another agent across vendors."},{"id":"C","text":"A nightly export of the ERP data, which is stale between runs and not interactive in a chat."},{"id":"D","text":"MCP, giving the agent standardized access to the external ERP's functions as callable tools."}],"correct":["D"],"explanation":"Correct: D — giving an agent standardized access to external tools and data is MCP's purpose. Why not the others: A — the Agent API is for external systems calling in; B — A2A is agent-to-agent delegation; C — an export is stale and not interactive.","reference":"Salesforce Developers — Choosing an interoperability mechanism"},{"id":"MA-051","domain":"multi-agent","topic":"Choosing the mechanism","difficulty":"medium","type":"single","stem":"Match the need to the mechanism: \"Our agent must delegate part of a task to a partner's third-party agent and get results.\" Best choice?","options":[{"id":"A","text":"A2A, the standard for delegating part of a task to a partner's third-party agent and getting results back."},{"id":"B","text":"MCP, which connects the agent to external tools and data, not to another peer agent."},{"id":"C","text":"The Agent API, which exposes your own agent so external systems can invoke it inbound."},{"id":"D","text":"A Lightning flow on its own, which offers no cross-vendor agent interoperability at all."}],"correct":["A"],"explanation":"Correct: A — cross-vendor agent-to-agent delegation is exactly what A2A enables. Why not the others: B — MCP is for tools and data, not peer agents; C — the Agent API exposes your agent to external systems, not delegation to another agent; D — a flow alone does not provide cross-vendor agent interoperability.","reference":"Salesforce Developers — Choosing an interoperability mechanism"},{"id":"MA-052","domain":"multi-agent","topic":"Choosing the mechanism","difficulty":"medium","type":"single","stem":"Match the need to the mechanism: \"We need our existing service agent to also answer a few closely-related shipping FAQs for the same customers.\" Best choice?","options":[{"id":"A","text":"Build a whole second Salesforce org just to hold the closely related shipping FAQ answers."},{"id":"B","text":"Stand up a separate A2A partner agent to answer the handful of related shipping FAQ questions."},{"id":"C","text":"Add a new topic, with its own actions, to the existing customer-service agent."},{"id":"D","text":"Publish an external MCP server whose only job is to serve those closely related shipping FAQs."}],"correct":["C"],"explanation":"Correct: C — closely related capabilities for the same audience belong as a new topic in the existing agent. Why not the others: A — a second org is unnecessary overhead; B — A2A is for external agent delegation; D — MCP is for external tool and data access, not internal FAQs.","reference":"Salesforce Help — Topics vs new agents"},{"id":"MA-053","domain":"multi-agent","topic":"Choosing the mechanism","difficulty":"hard","type":"single","stem":"A bank wants a customer-facing agent and a separate internal fraud-investigation agent with very different data access, owned by different teams. Best choice?","options":[{"id":"A","text":"One single agent granted administrative access to absolutely everything across the entire org."},{"id":"B","text":"Two specialized agents in one org (SOMA), each with its own scoped permissions and ownership."},{"id":"C","text":"Delegate all of the fraud-investigation work to a random public agent over A2A without vetting."},{"id":"D","text":"Expose the sensitive fraud data through an Agent API endpoint that requires no authentication."}],"correct":["B"],"explanation":"Correct: B — distinct functions, data sensitivity, and separate ownership favor multiple specialized agents (SOMA) with scoped permissions. Why not the others: A — one all-powerful agent violates least privilege; C — delegating sensitive fraud work to an unvetted public agent is reckless; D — an unauthenticated endpoint exposing fraud data is a breach.","reference":"Salesforce Architects — Choosing single vs multi-agent"},{"id":"MA-054","domain":"multi-agent","topic":"Interoperability security","difficulty":"medium","type":"single","stem":"Across MCP, A2A, and Agent API integrations, which principle consistently holds?","options":[{"id":"A","text":"Secrets and credentials must never be embedded in any client-side or front-end code."},{"id":"B","text":"Credentials are actually safest when they are printed directly in the agent's public instructions."},{"id":"C","text":"Authentication should be switched off wherever possible in order to reduce request latency."},{"id":"D","text":"The Einstein Trust Layer should be turned off for any integration in order to keep responses fast."}],"correct":["A"],"explanation":"Correct: A — keeping secrets out of client-side code is a universal security rule across all these integrations. Why not the others: B — public instructions leak secrets; C — disabling authentication is unsafe; D — the Trust Layer should remain on.","reference":"Salesforce Help — Integration security best practices"},{"id":"MA-055","domain":"multi-agent","topic":"Governance","difficulty":"hard","type":"multi","stem":"A company is rolling out MCP, A2A, and Agent API integrations. Which governance practices apply broadly across all of them? (Choose 3)","options":[{"id":"A","text":"Grant every integration full administrative access just to keep setup simple."},{"id":"B","text":"Remove the audit logs afterward to save on storage space in the org."},{"id":"C","text":"Apply least privilege to what each agent or integration is able to access."},{"id":"D","text":"Keep the Einstein Trust Layer active for its monitoring and guardrails."},{"id":"E","text":"Store credentials securely in Named/External Credentials or server-side."}],"correct":["C","D","E"],"explanation":"Correct: C, D, E — least privilege, an active Trust Layer, and secure credential storage apply across all interoperability paths. Why not the others: A — blanket admin access violates least privilege; B — deleting audit logs harms accountability and observability.","reference":"Salesforce Help — Agentforce governance"},{"id":"MA-056","domain":"multi-agent","topic":"Choosing the mechanism","difficulty":"medium","type":"single","stem":"An architect says \"We'll use the Agent API to let our agent pull data from an external inventory tool.\" Why is this the wrong mechanism?","options":[{"id":"A","text":"The Agent API is technically incapable of returning any JSON, so it cannot carry the tool data."},{"id":"B","text":"Calling any external tool from an agent is prohibited, so no mechanism could achieve this at all."},{"id":"C","text":"Nothing is actually wrong here, as the Agent API and MCP are fully interchangeable in practice."},{"id":"D","text":"The Agent API is inbound; letting the agent pull external tool data is instead an MCP use case."}],"correct":["D"],"explanation":"Correct: D — the Agent API lets external systems invoke your agent; letting the agent reach out to an external tool or data source is MCP's role. Why not the others: A — the Agent API does return structured JSON; B — calling external tools is legitimate; C — the two serve opposite directions.","reference":"Salesforce Developers — MCP vs Agent API"},{"id":"MA-057","domain":"multi-agent","topic":"Choosing the mechanism","difficulty":"medium","type":"single","stem":"Cloud Kicks keeps adding unrelated functions to one agent and now sees slower, less accurate topic selection. Which two-part guidance is best?","options":[{"id":"A","text":"Always use exactly one single agent no matter what the functions or audiences happen to be."},{"id":"B","text":"Keep related tasks as topics, but split clearly distinct functions or audiences into new agents."},{"id":"C","text":"Always create a brand-new Salesforce org for each and every distinct function the business supports."},{"id":"D","text":"Never use topics at all; only ever model each capability as its own fully separate agent instead."}],"correct":["B"],"explanation":"Correct: B — group related tasks as topics, and split genuinely distinct functions or audiences into separate agents with orchestration. Why not the others: A — one agent can suffer topic sprawl; C — a new org per function is excessive; D — topics are the right tool for related tasks.","reference":"Salesforce Architects — Agent decomposition guidance"},{"id":"MA-058","domain":"multi-agent","topic":"Interoperability security","difficulty":"medium","type":"single","stem":"When agents or external systems exchange data via A2A or the Agent API, what should govern which fields and PII are shared?","options":[{"id":"A","text":"Always share the full customer record with the other side to be as helpful as possible."},{"id":"B","text":"Whatever the external party requests, handed over without any review or approval."},{"id":"C","text":"A deliberate data-sharing policy and least privilege, sharing only what is necessary across the boundary."},{"id":"D","text":"A randomly selected set of fields, chosen fresh every time that data crosses over."}],"correct":["C"],"explanation":"Correct: C — intentional policy and least privilege should limit shared data to only what is necessary. Why not the others: A — oversharing full records risks privacy violations; B — honoring any request without review is unsafe; D — random sharing is indefensible.","reference":"Salesforce Help — Data sharing and privacy for integrations"},{"id":"MA-059","domain":"multi-agent","topic":"Interoperability overview","difficulty":"medium","type":"single","stem":"Which statement best summarizes how MCP, A2A, and the Agent API fit together in Agentforce interoperability?","options":[{"id":"A","text":"MCP links an agent to tools and data, A2A links agents to each other, and the Agent API lets systems invoke an agent."},{"id":"B","text":"All three of them do the exact same job, so any one can simply be swapped in for the others whenever you like."},{"id":"C","text":"Only one single one of the three may ever be used within a given org, so a team must commit to just one mechanism up front."},{"id":"D","text":"They are all strictly internal-only mechanisms that, by design, never reach external systems or outside agents."}],"correct":["A"],"explanation":"Correct: A — MCP (agent to tools/data), A2A (agent to agent), and the Agent API (external system to agent) address complementary directions of interoperability. Why not the others: B — they solve different problems; C — an org can use multiple mechanisms; D — all commonly involve external systems or agents.","reference":"Salesforce Developers — Agentforce interoperability overview"},{"id":"MA-060","domain":"multi-agent","topic":"Choosing the mechanism","difficulty":"hard","type":"single","stem":"Pizza Time wants three things: (1) its public website to ask the Agentforce agent questions and show structured replies, (2) the agent to fetch live store inventory from an external system via a standard interface, and (3) the agent to hand a complex logistics subtask to a partner's third-party agent. Which mapping is correct?","options":[{"id":"A","text":"(1) MCP, (2) A2A, and (3) Agent API."},{"id":"B","text":"(1) A2A, (2) Agent API, and (3) MCP."},{"id":"C","text":"(1) Agent API, (2) A2A, and (3) MCP."},{"id":"D","text":"(1) Agent API, (2) MCP, and (3) A2A."}],"correct":["D"],"explanation":"Correct: D — an external site invoking the agent is the Agent API; the agent reaching a standardized external tool or data source is MCP; delegating to a partner's agent is A2A. Why not the others: A, B, and C — each misassigns at least one mechanism to the wrong direction, such as using A2A for tool and data access or the Agent API for the agent's own outbound tool calls.","reference":"Salesforce Developers — Agentforce interoperability overview"},{"id":"PE-001","domain":"prompt-engineering","topic":"Prompt Builder","difficulty":"easy","type":"single","stem":"Northern Trail Outfitters reps are familiar with public generative AI tools but find it time-consuming to type prompts by hand, and results are inconsistent across the team. Which Salesforce capability best addresses this?","options":[{"id":"A","text":"Einstein Recommendation Builder, which suggests next-best offers"},{"id":"B","text":"Einstein Prompt Builder with reusable prompt templates"},{"id":"C","text":"Agent Builder using a Query Records action to fetch data"},{"id":"D","text":"Flow Builder screen flow that collects free-text prompts"}],"correct":["B"],"explanation":"Correct: B — Prompt Builder gives reusable, grounded templates so reps trigger a consistent generative task instead of hand-typing prompts. Why not the others: A recommends next-best offers, not generative text; C queries records but doesn't standardize a generative prompt; D collects free text but generates nothing.","reference":"Salesforce Help — Einstein Prompt Builder"},{"id":"PE-002","domain":"prompt-engineering","topic":"Prompt Templates","difficulty":"medium","type":"single","stem":"Cloud Kicks wants every service rep to generate case summaries the same way, using approved wording and pulling live case data, without each rep writing their own prompt. What should the admin build?","options":[{"id":"A","text":"A static prompt reps copy-paste into an external public chatbot"},{"id":"B","text":"A knowledge article with tips for reps on writing prompts"},{"id":"C","text":"A report listing open cases for reps to summarize manually"},{"id":"D","text":"A grounded Prompt Builder template run from the case record"}],"correct":["D"],"explanation":"Correct: D — a grounded template standardizes wording and injects live case data with no manual prompt writing. Why not the others: A a static prompt in a public chatbot is inconsistent and ungoverned; B an article still leaves reps writing prompts; C a report lists cases but generates no summary.","reference":"Salesforce Help — Prompt Templates"},{"id":"PE-003","domain":"prompt-engineering","topic":"Prompt Templates","difficulty":"medium","type":"single","stem":"A company already uses Agentforce agents and wants a repeatable generative step — \"draft a renewal outreach email using the account's data\" — that an agent can invoke. Which approach is most appropriate?","options":[{"id":"A","text":"Create a prompt template and expose it as an agent action"},{"id":"B","text":"Hard-code the full email text inside the agent's instructions"},{"id":"C","text":"Have users paste account data into a public AI chatbot"},{"id":"D","text":"Build a Flow that sends one fixed email with no AI grounding"}],"correct":["A"],"explanation":"Correct: A — a prompt template can be exposed as an agent action, giving a reusable, grounded generative step. Why not the others: B hard-coded text can't ground per account and bloats instructions; C a public chatbot is ungoverned and manual; D a fixed-email Flow isn't generative or personalized.","reference":"Salesforce Help — Add Prompt Templates as Agent Actions"},{"id":"PE-004","domain":"prompt-engineering","topic":"Prompt Builder","difficulty":"medium","type":"single","stem":"Ursa Major Solar's marketing team repeatedly writes similar product-launch blurbs by pasting notes into a public chatbot. Leadership worries about inconsistent tone and data leaving the org. What is the best Salesforce-native fix?","options":[{"id":"A","text":"Keep the public chatbot but publish a written style guide"},{"id":"B","text":"Disable generative AI across the entire org to stop leaks"},{"id":"C","text":"Use Prompt Builder templates that run inside the Trust Layer"},{"id":"D","text":"Build a Lightning component that calls a public AI API directly"}],"correct":["C"],"explanation":"Correct: C — Prompt Builder templates standardize tone and run generation inside the Trust Layer. Why not the others: A a style guide doesn't stop data leaving or enforce consistency; B disabling gen AI blocks a valuable capability; D a component calling a public API bypasses the Trust Layer.","reference":"Salesforce Help — Einstein Trust Layer"},{"id":"PE-005","domain":"prompt-engineering","topic":"Prompt Templates","difficulty":"hard","type":"single","stem":"Pizza Time wants managers to get a one-click, consistently formatted summary of each franchise account directly on the record page, populated from Salesforce data. Which approach is the best fit?","options":[{"id":"A","text":"A validation rule that checks required fields before save"},{"id":"B","text":"A Record Summary prompt template on the account record page"},{"id":"C","text":"A dashboard component charting the account's KPIs and trends"},{"id":"D","text":"An email alert that fires when the account record changes"}],"correct":["B"],"explanation":"Correct: B — a Record Summary template produces a consistent, grounded narrative on the record page. Why not the others: A a validation rule enforces data entry, not summaries; C a dashboard shows KPIs but no narrative; D an email alert notifies, it doesn't summarize.","reference":"Salesforce Help — Record Summary Prompt Templates"},{"id":"PE-006","domain":"prompt-engineering","topic":"Prompt Templates","difficulty":"medium","type":"multi","stem":"An admin is justifying moving reps from ad-hoc public AI prompts to Einstein Prompt Builder templates. Which of the following are valid benefits of prompt templates? (Select 2)","options":[{"id":"A","text":"They standardize a repeated generative task for consistency"},{"id":"B","text":"They guarantee the model will never make a factual error"},{"id":"C","text":"They ground generation in live Salesforce data via retrievers"},{"id":"D","text":"They remove any need to test the prompt before rollout"},{"id":"E","text":"They auto-train a brand-new custom model on your org data"}],"correct":["A","C"],"explanation":"Correct: A and C — templates make a repeated task consistent and ground on real Salesforce/Data Cloud data. Why not the others: B no tool guarantees zero factual errors; D testing is still required; E templates use foundation models and don't auto-train custom ones.","reference":"Salesforce Help — Einstein Prompt Builder"},{"id":"PE-007","domain":"prompt-engineering","topic":"Prompt Templates","difficulty":"medium","type":"single","stem":"A company asks whether it should build a dedicated prompt template or simply write longer instructions inside every agent. When is a dedicated prompt template the better choice?","options":[{"id":"A","text":"When a generative task recurs and needs consistent grounding"},{"id":"B","text":"Only when exactly one user in the org will ever run it"},{"id":"C","text":"Never, since agent instructions always fully replace templates"},{"id":"D","text":"Only when the data lives entirely outside Salesforce"}],"correct":["A"],"explanation":"Correct: A — a reusable, grounded template fits when the same task recurs and must stay consistent. Why not the others: B user count is irrelevant; C instructions and templates are complementary, not replacements; D templates work with Salesforce and Data Cloud data alike.","reference":"Trailhead — Prompt Builder Basics"},{"id":"PE-008","domain":"prompt-engineering","topic":"Template Types","difficulty":"medium","type":"single","stem":"A Cloud Kicks sales rep wants to draft a personalized outreach email to a specific lead directly from the lead record, referencing the lead's details. Which prompt template type is designed for this?","options":[{"id":"A","text":"Record Summary, to recap the lead's important record details"},{"id":"B","text":"Field Generation, to fill one field on the lead record"},{"id":"C","text":"Flex, to assemble a custom multi-object generative prompt"},{"id":"D","text":"Sales Email, to draft a personalized outreach email to the lead"}],"correct":["D"],"explanation":"Correct: D — Sales Email generates a personalized email grounded on the recipient, right in the composer. Why not the others: A Record Summary recaps a record rather than drafting an email; B Field Generation fills one field; C Flex is general-purpose, but Sales Email is purpose-built.","reference":"Salesforce Help — Sales Email Prompt Templates"},{"id":"PE-009","domain":"prompt-engineering","topic":"Template Types","difficulty":"medium","type":"single","stem":"Northern Trail Outfitters wants Einstein to auto-draft the Description text field on the Product record from other product attributes, so users can review and save it. Which template type fits?","options":[{"id":"A","text":"Sales Email, to send a product email to a contact"},{"id":"B","text":"Record Summary, to summarize the entire product record"},{"id":"C","text":"Field Generation, to draft the Description field"},{"id":"D","text":"Flow template, to update a record without any AI"}],"correct":["C"],"explanation":"Correct: C — Field Generation targets a specific record field for review and save. Why not the others: A Sales Email drafts emails; B Record Summary recaps the whole record, not one field; D there is no 'Flow template' prompt type.","reference":"Salesforce Help — Field Generation Prompt Templates"},{"id":"PE-010","domain":"prompt-engineering","topic":"Template Types","difficulty":"medium","type":"single","stem":"Ursa Major Solar wants agents and users to see a concise narrative overview of an Account — its recent activity and key details — generated on demand. Which template type is intended for this?","options":[{"id":"A","text":"Record Summary, for an on-demand account overview"},{"id":"B","text":"Sales Email, to draft an email to the account contact"},{"id":"C","text":"Field Generation, to populate one account field"},{"id":"D","text":"Validation template, to block saves on bad data"}],"correct":["A"],"explanation":"Correct: A — Record Summary generates an on-demand narrative overview of a record. Why not the others: B Sales Email produces emails; C Field Generation targets a single field; D there is no 'validation template' prompt type.","reference":"Salesforce Help — Record Summary Prompt Templates"},{"id":"PE-011","domain":"prompt-engineering","topic":"Template Types","difficulty":"medium","type":"multi","stem":"A company needs a prompt template that combines data from several objects and can be invoked as an agent action, from Flow, and from Apex. Which statements about the Flex template type are correct? (Select 2)","options":[{"id":"A","text":"Flex templates run only within the email composer window"},{"id":"B","text":"Flex is the most flexible type, referencing multiple objects"},{"id":"C","text":"Flex templates cannot be grounded with Salesforce data"},{"id":"D","text":"Flex can be invoked as an agent action and from Flow or Apex"},{"id":"E","text":"Flex is only for summarizing a single record's fields"}],"correct":["B","D"],"explanation":"Correct: B and D — Flex is the most flexible type and can be invoked as an agent action or from Flow/Apex. Why not the others: A composer-only describes Sales Email; C Flex supports rich grounding; E single-record summaries are Record Summary's job.","reference":"Salesforce Help — Flex Prompt Templates"},{"id":"PE-012","domain":"prompt-engineering","topic":"Template Types","difficulty":"medium","type":"single","stem":"Pizza Time built a Flex prompt template that drafts a delivery-delay apology message. They want their service agent to call it during a conversation. What must they do?","options":[{"id":"A","text":"Paste the template text into the agent's welcome message"},{"id":"B","text":"Add the template as an action available to the agent"},{"id":"C","text":"Convert the template into a case validation rule"},{"id":"D","text":"Nothing; agents auto-run every prompt template in the org"}],"correct":["B"],"explanation":"Correct: B — a template is made available to an agent by adding it as an action. Why not the others: A a welcome message can't ground or generate dynamically; C validation rules aren't generative; D agents only use actions you assign.","reference":"Salesforce Help — Add Prompt Templates as Agent Actions"},{"id":"PE-013","domain":"prompt-engineering","topic":"Template Types","difficulty":"hard","type":"single","stem":"A rep needs to generate a tailored email to a contact, sent from the Salesforce email composer, that references the related opportunity. Which template type should the admin choose to minimize configuration?","options":[{"id":"A","text":"Flex, but you configure every input and context by hand"},{"id":"B","text":"Field Generation aimed at the contact's Email field"},{"id":"C","text":"Record Summary of the contact and recent activity"},{"id":"D","text":"Sales Email, built for the composer with recipient grounding"}],"correct":["D"],"explanation":"Correct: D — Sales Email is built for the composer and grounds on the recipient with minimal setup. Why not the others: A Flex works but needs manual input/context configuration; B Field Generation fills a field, not an email; C Record Summary only summarizes.","reference":"Salesforce Help — Sales Email Prompt Templates"},{"id":"PE-014","domain":"prompt-engineering","topic":"Template Types","difficulty":"medium","type":"multi","stem":"An admin is mapping business needs to prompt template types. Which pairings are correct? (Select 3)","options":[{"id":"A","text":"Draft a personalized outbound email to a lead → Sales Email"},{"id":"B","text":"Enforce that a required field is filled on save → Flex"},{"id":"C","text":"Populate one record field with generated text → Field Generation"},{"id":"D","text":"Send an automated SMS with no AI involved → Record Summary"},{"id":"E","text":"Produce an on-demand narrative record overview → Record Summary"}],"correct":["A","C","E"],"explanation":"Correct: A, C, E — these match Sales Email, Field Generation, and Record Summary to their purposes. Why not the others: B enforcing a required field is a validation rule, not Flex; D automated SMS with no AI isn't a prompt template use case.","reference":"Salesforce Help — Prompt Template Types"},{"id":"PE-015","domain":"prompt-engineering","topic":"Template Types","difficulty":"hard","type":"single","stem":"Universal Containers needs one template that grounds on a Case, its parent Account, and a related Knowledge article, then is reused by both an agent and a Flow. Which type best supports this multi-object, multi-context need?","options":[{"id":"A","text":"Sales Email, scoped to a single recipient email"},{"id":"B","text":"Field Generation, scoped to one target field only"},{"id":"C","text":"Flex, for multiple objects and reuse across agents and Flow"},{"id":"D","text":"Record Summary, scoped to a single record recap"}],"correct":["C"],"explanation":"Correct: C — Flex supports multiple object inputs and reuse across agents, Flow, and Apex. Why not the others: A Sales Email is email-scoped; B Field Generation targets one field; D Record Summary recaps a single record, not multi-context reuse.","reference":"Salesforce Help — Flex Prompt Templates"},{"id":"PE-016","domain":"prompt-engineering","topic":"Grounding","difficulty":"medium","type":"single","stem":"Cloud Kicks wants a prompt to include the actual customer name and order number from the record instead of placeholders. Which grounding technique inserts these live values into the prompt?","options":[{"id":"A","text":"Record merge fields that pull the record's live values"},{"id":"B","text":"A hard-coded sample customer typed into the instructions"},{"id":"C","text":"Increasing the model's sampling temperature for more variety"},{"id":"D","text":"Switching to a custom fine-tuned LLM for the org"}],"correct":["A"],"explanation":"Correct: A — merge fields resolve to the record's real values at runtime. Why not the others: B a hard-coded sample isn't the record's data; C temperature only affects randomness; D a custom LLM doesn't add record data.","reference":"Trailhead — Ground Your Prompts"},{"id":"PE-017","domain":"prompt-engineering","topic":"Grounding","difficulty":"medium","type":"single","stem":"Northern Trail Outfitters wants a case summary prompt to also consider the case's related list of recent emails and comments. How should the admin ground this data?","options":[{"id":"A","text":"Ask reps to paste the emails into the prompt each time"},{"id":"B","text":"Configure a higher max-tokens setting on the model"},{"id":"C","text":"Turn off the Trust Layer to allow more data through"},{"id":"D","text":"Ground using related-list merge fields on the Case object"}],"correct":["D"],"explanation":"Correct: D — related-list merge fields pull the associated emails and comments automatically. Why not the others: A pasting is manual and inconsistent; B max-tokens only changes output length; C turning off the Trust Layer weakens governance and adds no data.","reference":"Salesforce Help — Ground Prompt Templates with Related Records"},{"id":"PE-018","domain":"prompt-engineering","topic":"Grounding","difficulty":"hard","type":"single","stem":"Ursa Major Solar needs a prompt to include a complex, calculated eligibility value that requires custom logic across several objects. Merge fields alone can't compute it. Which grounding technique is most appropriate?","options":[{"id":"A","text":"Manually type the computed value into the prompt each run"},{"id":"B","text":"Ground with an Apex data source that returns the value"},{"id":"C","text":"Raise the model's temperature so it merely estimates the value"},{"id":"D","text":"Switch to a Sales Email template to compute the value"}],"correct":["B"],"explanation":"Correct: B — an Apex data source runs custom logic and returns the computed value. Why not the others: A typing it manually is unscalable; C higher temperature invites hallucination; D changing the template type adds no computed data.","reference":"Salesforce Help — Ground Prompt Templates with Apex"},{"id":"PE-019","domain":"prompt-engineering","topic":"Grounding","difficulty":"hard","type":"single","stem":"A company already has a Flow that assembles a customer's loyalty status from multiple sources. They want a prompt template to reuse that logic for grounding without rewriting it in Apex. What should they do?","options":[{"id":"A","text":"Copy the Flow's logic into the prompt as static text"},{"id":"B","text":"Delete the Flow and hard-code the loyalty values"},{"id":"C","text":"Ground the prompt template using the existing Flow"},{"id":"D","text":"Use a Record Summary template with no grounding"}],"correct":["C"],"explanation":"Correct: C — a template can be grounded with the existing Flow, reusing declarative logic. Why not the others: A instructions can't execute Flow logic; B hard-coding loses the dynamic values; D a Record Summary with no grounding provides nothing.","reference":"Salesforce Help — Ground Prompt Templates with Flow"},{"id":"PE-020","domain":"prompt-engineering","topic":"Grounding","difficulty":"hard","type":"single","stem":"Pizza Time wants an agent's prompt to pull the most relevant passages from thousands of unstructured policy PDFs unified in Data Cloud, so answers reflect current policy. Which grounding technique fits?","options":[{"id":"A","text":"A Data Cloud retriever running RAG over the indexed PDFs"},{"id":"B","text":"A single merge field pulling one Case field value"},{"id":"C","text":"Hard-coding the top three policies into the prompt"},{"id":"D","text":"Raising the number of generated answer options in the template"}],"correct":["A"],"explanation":"Correct: A — a Data Cloud retriever performs RAG, returning the most relevant indexed passages. Why not the others: B a single merge field can't search unstructured docs; C hard-coding doesn't scale or stay current; D more answer options is unrelated to grounding.","reference":"Salesforce Help — Ground with Data Cloud Retrievers"},{"id":"PE-021","domain":"prompt-engineering","topic":"Grounding","difficulty":"medium","type":"multi","stem":"An admin lists the ways a Flex prompt template can be grounded in real data. Which of the following are valid grounding techniques? (Select 3)","options":[{"id":"A","text":"Raising the model's temperature parameter"},{"id":"B","text":"Record and related-record merge field data"},{"id":"C","text":"Apex- or Flow-based custom data sources"},{"id":"D","text":"Data Cloud retrievers for RAG over content"},{"id":"E","text":"Writing the answer as fixed text in the prompt"}],"correct":["B","C","D"],"explanation":"Correct: B, C, D — merge fields, Apex/Flow data sources, and Data Cloud retrievers are all grounding techniques. Why not the others: A temperature controls randomness, not grounding; E fixed text isn't dynamic and goes stale.","reference":"Salesforce Help — Grounding Prompt Templates"},{"id":"PE-022","domain":"prompt-engineering","topic":"Grounding","difficulty":"medium","type":"single","stem":"A company's ungrounded prompts sometimes produce plausible but incorrect customer details. Why does adding grounding help?","options":[{"id":"A","text":"It boosts the model's creativity and word variety"},{"id":"B","text":"It disables the Einstein Trust Layer for speed"},{"id":"C","text":"It forces the model to reply in a different language"},{"id":"D","text":"It supplies real Salesforce data instead of guesses"}],"correct":["D"],"explanation":"Correct: D — grounding supplies real data so the model uses facts instead of guessing. Why not the others: A more creativity increases errors; B the Trust Layer stays on; C language choice is unrelated.","reference":"Salesforce Help — Grounding and Hallucination Reduction"},{"id":"PE-023","domain":"prompt-engineering","topic":"Grounding","difficulty":"hard","type":"single","stem":"A Universal Containers rep needs a pre-call brief combining CRM opportunity data and a customer's product-interest signals that live only in Data Cloud. Which grounding combination is correct?","options":[{"id":"A","text":"Only a hard-coded product list typed into the prompt"},{"id":"B","text":"Merge fields for the opportunity and a Data Cloud retriever"},{"id":"C","text":"A custom fine-tuned model used with no grounding at all"},{"id":"D","text":"Related-list grounding on an object that lacks those signals entirely"}],"correct":["B"],"explanation":"Correct: B — use merge fields for the CRM opportunity and a Data Cloud retriever for the Data Cloud-only signals. Why not the others: A hard-coding ignores real data; C fine-tuning injects no current data; D that object lacks the signals, so grounding returns nothing.","reference":"Salesforce Help — Grounding with CRM and Data Cloud"},{"id":"PE-024","domain":"prompt-engineering","topic":"Testing & Activation","difficulty":"medium","type":"single","stem":"Before rolling out a template, a Cloud Kicks admin wants to see exactly what the model will receive after merge fields resolve for a specific record. What should they use?","options":[{"id":"A","text":"A validation rule configured on that record"},{"id":"B","text":"The browser's view-source view of the record page"},{"id":"C","text":"Prompt Builder's Preview using a chosen sample record"},{"id":"D","text":"A report listing every record in the org today"}],"correct":["C"],"explanation":"Correct: C — Preview resolves merge fields against a sample record and shows the compiled prompt. Why not the others: A validation rules don't render prompts; B view-source shows page HTML, not the resolved prompt; D reports don't compile prompts.","reference":"Salesforce Help — Preview and Test Prompt Templates"},{"id":"PE-025","domain":"prompt-engineering","topic":"Testing & Activation","difficulty":"medium","type":"multi","stem":"An admin is finalizing a prompt template. Which steps are recommended before making it available to users? (Select 3)","options":[{"id":"A","text":"Preview the resolved prompt on sample records"},{"id":"B","text":"Delete all grounding to speed up responses"},{"id":"C","text":"Turn off the Trust Layer to see raw output"},{"id":"D","text":"Test across diverse scenarios and edge cases"},{"id":"E","text":"Activate the template once it passes testing"}],"correct":["A","D","E"],"explanation":"Correct: A, D, E — preview the resolution, test varied scenarios, then activate. Why not the others: B removing grounding harms accuracy; C the Trust Layer can't be turned off and shouldn't be.","reference":"Salesforce Help — Preview and Activate Prompt Templates"},{"id":"PE-026","domain":"prompt-engineering","topic":"Testing & Activation","difficulty":"medium","type":"single","stem":"An admin finished configuring a prompt template and previewed it successfully, but it doesn't appear for users or agents. What is the most likely reason?","options":[{"id":"A","text":"The org has too many records to index"},{"id":"B","text":"Merge fields must be typed in uppercase"},{"id":"C","text":"The Trust Layer blocks all templates by default"},{"id":"D","text":"The template has not been activated yet"}],"correct":["D"],"explanation":"Correct: D — templates must be activated before users or agents can use them. Why not the others: A record volume is irrelevant; B merge-field casing isn't the issue; C the Trust Layer governs output, it doesn't block templates.","reference":"Salesforce Help — Activate Prompt Templates"},{"id":"PE-027","domain":"prompt-engineering","topic":"Testing & Activation","difficulty":"hard","type":"single","stem":"A template works well for a large enterprise account, but the team hasn't tried it on small accounts, records with blank fields, or unusual data. What is the best practice before rollout?","options":[{"id":"A","text":"Roll out now since a single test already passed"},{"id":"B","text":"Test diverse records and edge cases with sparse data"},{"id":"C","text":"Only test the single largest enterprise account"},{"id":"D","text":"Skip testing since the Trust Layer ensures correctness"}],"correct":["B"],"explanation":"Correct: B — testing diverse records and edge cases (including sparse data) surfaces issues before rollout. Why not the others: A and C narrow tests miss edge cases; D the Trust Layer governs safety, not completeness.","reference":"Salesforce Help — Test Prompt Templates Across Scenarios"},{"id":"PE-028","domain":"prompt-engineering","topic":"Testing & Activation","difficulty":"hard","type":"single","stem":"A generated summary is missing the account's region. An admin wants to confirm whether the region data actually made it into the prompt sent to the model. What should they inspect?","options":[{"id":"A","text":"The resolved prompt in Preview for that merge field"},{"id":"B","text":"The user's browser cache and stored cookies"},{"id":"C","text":"The number of paid user licenses in the org"},{"id":"D","text":"The org's outbound email deliverability configuration"}],"correct":["A"],"explanation":"Correct: A — the resolved prompt in Preview shows whether the merge field populated or came through empty. Why not the others: B, C, and D are unrelated to how the prompt was compiled.","reference":"Salesforce Help — Inspect the Resolved Prompt"},{"id":"PE-029","domain":"prompt-engineering","topic":"Testing & Activation","difficulty":"easy","type":"single","stem":"In Prompt Builder, what does selecting a sample record during Preview allow an admin to do?","options":[{"id":"A","text":"Permanently change that record's field values"},{"id":"B","text":"Permanently delete that record from the org"},{"id":"C","text":"Grant that record a new permission set assignment"},{"id":"D","text":"See the resolved prompt using the record's data"}],"correct":["D"],"explanation":"Correct: D — choosing a sample record previews the resolved prompt and response with real data. Why not the others: A Preview doesn't edit the record; B it doesn't delete data; C permission sets apply to users, not records.","reference":"Salesforce Help — Preview Prompt Templates"},{"id":"PE-030","domain":"prompt-engineering","topic":"Testing & Activation","difficulty":"hard","type":"single","stem":"During Preview, a merge field for Primary Contact Email resolves to blank on many records. What is the most appropriate fix?","options":[{"id":"A","text":"Ignore it and let the model invent a plausible email address"},{"id":"B","text":"Add fallback instructions or fix the field population"},{"id":"C","text":"Increase the model's temperature so it simply fills in the gap"},{"id":"D","text":"Remove Trust Layer masking to reveal the raw field"}],"correct":["B"],"explanation":"Correct: B — fix the gap with fallback handling or proper field population. Why not the others: A and C invite hallucinated data; D masking is unrelated to a blank merge field.","reference":"Salesforce Help — Troubleshoot Grounding and Merge Fields"},{"id":"PE-031","domain":"prompt-engineering","topic":"Model Access","difficulty":"medium","type":"single","stem":"Cloud Kicks wants no-code, grounded summaries of CRM and Data Cloud data. Leadership asks whether they need to build a custom model. What is the best guidance?","options":[{"id":"A","text":"Standard foundation models with grounding are enough"},{"id":"B","text":"They must fine-tune a model before summaries work"},{"id":"C","text":"They must bring their own LLM to summarize records"},{"id":"D","text":"Summarizing is impossible without training a new model"}],"correct":["A"],"explanation":"Correct: A — standard foundation models plus grounding handle grounded summaries with no custom model. Why not the others: B, C, and D fine-tuning, BYOLLM, and new training are overkill here.","reference":"Trailhead — Foundation Models in Agentforce"},{"id":"PE-032","domain":"prompt-engineering","topic":"Model Access","difficulty":"hard","type":"single","stem":"A Universal Containers stakeholder wants to fine-tune a custom model just to generate grounded case summaries. Why is this usually overkill?","options":[{"id":"A","text":"Fine-tuning is mandatory before any prompt template runs"},{"id":"B","text":"Standard models simply cannot read Salesforce data at all"},{"id":"C","text":"Grounding provides context at runtime, not fine-tuning"},{"id":"D","text":"Fine-tuning removes the need for the Trust Layer"}],"correct":["C"],"explanation":"Correct: C — grounding injects the data at runtime, so standard models suffice without fine-tuning. Why not the others: A fine-tuning is optional and rare; B grounded standard models do use Salesforce data; D the Trust Layer still applies.","reference":"Salesforce Help — When to Use Custom Models"},{"id":"PE-033","domain":"prompt-engineering","topic":"Model Access","difficulty":"hard","type":"single","stem":"A company has a regulatory requirement to use a specific model it already hosts in its own cloud environment. Which capability lets it use that model with Agentforce?","options":[{"id":"A","text":"Sales Email templates for outbound messaging"},{"id":"B","text":"Bring Your Own LLM (BYOLLM) via Model Builder"},{"id":"C","text":"Related-list grounding for extra record context"},{"id":"D","text":"Prompt defense guardrails in the Trust Layer"}],"correct":["B"],"explanation":"Correct: B — BYOLLM in Model Builder connects an externally hosted model when required. Why not the others: A is a template type; C is a grounding method; D is a Trust Layer guardrail — none connect a custom model.","reference":"Salesforce Help — Bring Your Own Large Language Model (BYOLLM)"},{"id":"PE-034","domain":"prompt-engineering","topic":"Model Access","difficulty":"easy","type":"single","stem":"Where in Salesforce would an admin configure model options — such as connecting an external model or managing available foundation models — for generative features?","options":[{"id":"A","text":"Flow Builder, for automating multi-step processes"},{"id":"B","text":"Report Builder, for building tabular reports"},{"id":"C","text":"Schema Builder, for designing data objects"},{"id":"D","text":"Model Builder, for foundation and custom models"}],"correct":["D"],"explanation":"Correct: D — Model Builder configures foundation models and connects external/custom ones. Why not the others: A automates processes; B builds reports; C designs data objects — none configure LLMs.","reference":"Salesforce Help — Model Builder"},{"id":"PE-035","domain":"prompt-engineering","topic":"Model Access","difficulty":"hard","type":"multi","stem":"When deciding whether the standard foundation model is enough versus bringing a custom model, which considerations are most relevant? (Select 2)","options":[{"id":"A","text":"Whether the org has more than 100 active users"},{"id":"B","text":"Whether the template text uses double or single quotes"},{"id":"C","text":"Whether grounding already supplies the needed context"},{"id":"D","text":"The color theme configured for the Salesforce org UI"},{"id":"E","text":"Whether a special need exceeds standard models' limits"}],"correct":["C","E"],"explanation":"Correct: C and E — if grounding covers the context and no special requirement exists, standard models suffice. Why not the others: A user count, B formatting, and D theme don't affect model choice.","reference":"Salesforce Help — Choosing a Model"},{"id":"PE-036","domain":"prompt-engineering","topic":"Model Access","difficulty":"medium","type":"single","stem":"Universal Containers wants one particular prompt template to use a different supported model than the org default. Where is this typically set?","options":[{"id":"A","text":"In the template's model setting in Prompt Builder"},{"id":"B","text":"In the record's Lightning page layout editor"},{"id":"C","text":"By editing the running user's profile photo settings"},{"id":"D","text":"In the company's external DNS zone settings"}],"correct":["A"],"explanation":"Correct: A — the model is chosen in the template's model configuration in Prompt Builder. Why not the others: B page layouts control field display; C and D are unrelated to model selection.","reference":"Salesforce Help — Select a Model for a Prompt Template"},{"id":"PE-037","domain":"prompt-engineering","topic":"Einstein Trust Layer","difficulty":"medium","type":"single","stem":"When a grounded prompt containing a customer's phone number and email is sent to the LLM, Ursa Major Solar wants that sensitive data hidden from the provider but restored in the final response. Which Einstein Trust Layer capability does this?","options":[{"id":"A","text":"Toxicity scoring of every generated reply"},{"id":"B","text":"Prompt defense guarding against injection attempts"},{"id":"C","text":"Dynamic PII masking, de-masked on the response"},{"id":"D","text":"Zero data retention by the model provider"}],"correct":["C"],"explanation":"Correct: C — data masking hides PII before the prompt reaches the LLM and de-masks the response. Why not the others: A scores harmful content; B guards against manipulation; D prevents retention but doesn't mask fields.","reference":"Salesforce Help — Einstein Trust Layer Data Masking"},{"id":"PE-038","domain":"prompt-engineering","topic":"Einstein Trust Layer","difficulty":"medium","type":"single","stem":"A security reviewer asks whether the third-party LLM provider will store or train on the company's prompts and responses. Which Trust Layer principle addresses this?","options":[{"id":"A","text":"Field-level security within the Salesforce org"},{"id":"B","text":"Zero data retention with the LLM provider"},{"id":"C","text":"Sales Email recipient grounding logic"},{"id":"D","text":"Record Summary narrative formatting"}],"correct":["B"],"explanation":"Correct: B — zero data retention means the provider doesn't store or train on your prompts and responses. Why not the others: A controls field visibility in Salesforce; C and D are template features, not retention controls.","reference":"Salesforce Help — Einstein Trust Layer Zero Data Retention"},{"id":"PE-039","domain":"prompt-engineering","topic":"Einstein Trust Layer","difficulty":"medium","type":"single","stem":"Cloud Kicks wants generated replies flagged when they contain harmful or offensive language, with the score recorded for review. Which Trust Layer capability provides this?","options":[{"id":"A","text":"Toxicity detection and scoring of replies"},{"id":"B","text":"Merge-field grounding of live record values"},{"id":"C","text":"Bring Your Own LLM model connection"},{"id":"D","text":"Field Generation prompt template type"}],"correct":["A"],"explanation":"Correct: A — toxicity detection scores responses for harmful content and logs the score. Why not the others: B injects data; C connects a custom model; D is a template type — none score toxicity.","reference":"Salesforce Help — Einstein Trust Layer Toxicity Detection"},{"id":"PE-040","domain":"prompt-engineering","topic":"Einstein Trust Layer","difficulty":"hard","type":"single","stem":"A company worries users might try to manipulate an agent's prompt to bypass its intended behavior (for example, jailbreak attempts). Which Trust Layer capability helps mitigate this?","options":[{"id":"A","text":"Zero data retention at the model provider side"},{"id":"B","text":"Dynamic PII data masking before sending"},{"id":"C","text":"Prompt defense guardrails against jailbreaks"},{"id":"D","text":"Related-list record data grounding setup"}],"correct":["C"],"explanation":"Correct: C — prompt defense adds guardrails that reduce injection and jailbreak risk. Why not the others: A prevents retention; B hides PII; D adds data — none defend against manipulation.","reference":"Salesforce Help — Einstein Trust Layer Prompt Defense"},{"id":"PE-041","domain":"prompt-engineering","topic":"Einstein Trust Layer","difficulty":"medium","type":"single","stem":"A compliance team needs a record of prompts, responses, masked fields, and toxicity scores for governance reviews. Which Trust Layer capability captures this?","options":[{"id":"A","text":"The Sales Email template for drafting emails"},{"id":"B","text":"The model's temperature and randomness control setting"},{"id":"C","text":"Schema Builder for modeling custom data objects"},{"id":"D","text":"The audit trail logging prompts and safety data"}],"correct":["D"],"explanation":"Correct: D — the audit trail logs prompts, responses, masking, and toxicity data for governance. Why not the others: A drafts emails; B affects randomness; C models data structure — none provide the audit log.","reference":"Salesforce Help — Einstein Trust Layer Audit Trail"},{"id":"PE-042","domain":"prompt-engineering","topic":"Einstein Trust Layer","difficulty":"hard","type":"single","stem":"How does the Einstein Trust Layer help ensure that grounding data respects the running user's access when a prompt is assembled?","options":[{"id":"A","text":"It grants every user System Administrator access"},{"id":"B","text":"Secure data retrieval that honors the user's permissions"},{"id":"C","text":"It disables all sharing rules during generation time"},{"id":"D","text":"It sends the entire org database to the LLM"}],"correct":["B"],"explanation":"Correct: B — secure data retrieval means grounding honors the running user's permissions. Why not the others: A and C would violate security; D contradicts scoped retrieval.","reference":"Salesforce Help — Einstein Trust Layer Secure Data Retrieval"},{"id":"PE-043","domain":"prompt-engineering","topic":"Einstein Trust Layer","difficulty":"medium","type":"multi","stem":"Which of the following are capabilities of the Einstein Trust Layer? (Select 3)","options":[{"id":"A","text":"Automatically writing prompt templates for you"},{"id":"B","text":"Dynamic PII masking before data reaches the LLM"},{"id":"C","text":"Guaranteeing the model is always factually correct"},{"id":"D","text":"Toxicity scoring applied to model responses"},{"id":"E","text":"Zero data retention with the model provider"}],"correct":["B","D","E"],"explanation":"Correct: B, D, E — masking, toxicity scoring, and zero data retention are core Trust Layer features. Why not the others: A admins author templates, not the Trust Layer; C no layer guarantees factual correctness.","reference":"Trailhead — Einstein Trust Layer"},{"id":"PE-044","domain":"prompt-engineering","topic":"Einstein Trust Layer","difficulty":"hard","type":"single","stem":"A stakeholder claims that because the Einstein Trust Layer is enabled, the team no longer needs to ground prompts or test outputs. Why is this incorrect?","options":[{"id":"A","text":"It writes and grounds every prompt for you automatically"},{"id":"B","text":"It replaces the need for any foundation model entirely"},{"id":"C","text":"It governs safety, not accuracy; testing still matters"},{"id":"D","text":"It disables all prompt templates in the org by default"}],"correct":["C"],"explanation":"Correct: C — the Trust Layer governs safety, but accuracy still depends on grounding and testing. Why not the others: A it doesn't author or ground prompts; B models are still used; D it doesn't disable templates.","reference":"Salesforce Help — Einstein Trust Layer Overview"},{"id":"PE-045","domain":"prompt-engineering","topic":"Permissions","difficulty":"medium","type":"single","stem":"An admin needs to let a small enablement team create and edit prompt templates in Prompt Builder. Which permission set is appropriate?","options":[{"id":"A","text":"Prompt Template Manager, to build them"},{"id":"B","text":"Prompt Template User, to run templates"},{"id":"C","text":"Read Only, granting view-only record access"},{"id":"D","text":"Marketing User, for marketing tools access"}],"correct":["A"],"explanation":"Correct: A — Prompt Template Manager grants building and managing templates. Why not the others: B only runs templates; C Read Only blocks building; D Marketing User is unrelated to Prompt Builder.","reference":"Salesforce Help — Prompt Builder Permission Sets"},{"id":"PE-046","domain":"prompt-engineering","topic":"Permissions","difficulty":"medium","type":"single","stem":"Cloud Kicks wants service reps to run existing prompt templates but not create or modify them. Which permission set fits?","options":[{"id":"A","text":"Prompt Template Manager, to build and edit"},{"id":"B","text":"System Administrator, for full org control"},{"id":"C","text":"Author Apex, for Apex code development"},{"id":"D","text":"Prompt Template User, to run them"}],"correct":["D"],"explanation":"Correct: D — Prompt Template User lets people run templates without building them. Why not the others: A Manager can build (too much); B System Administrator is broad; C Author Apex is for code.","reference":"Salesforce Help — Prompt Builder Permission Sets"},{"id":"PE-047","domain":"prompt-engineering","topic":"Permissions","difficulty":"hard","type":"single","stem":"Following least privilege, how should Northern Trail Outfitters assign access so that two admins build templates and hundreds of reps only run them?","options":[{"id":"A","text":"Give every user Prompt Template Manager access"},{"id":"B","text":"Admins get Template Manager; reps get Template User"},{"id":"C","text":"Give every user System Administrator access"},{"id":"D","text":"Reps get Template Manager while admins get Template User"}],"correct":["B"],"explanation":"Correct: B — managers build and users run, matching least privilege. Why not the others: A and C over-provision; D reverses the roles, letting reps edit templates.","reference":"Salesforce Help — Prompt Builder Permission Sets"},{"id":"PE-048","domain":"prompt-engineering","topic":"Permissions","difficulty":"medium","type":"multi","stem":"To let a user both run prompt templates and have generative AI available, which of the following are relevant prerequisites? (Select 2)","options":[{"id":"A","text":"Einstein generative AI is enabled for the org"},{"id":"B","text":"The user is a Marketing Cloud administrator"},{"id":"C","text":"The org disables the Einstein Trust Layer"},{"id":"D","text":"Every user is given Prompt Template Manager"},{"id":"E","text":"The user has the right Prompt Template permission set"}],"correct":["A","E"],"explanation":"Correct: A and E — generative AI must be enabled and the user needs the right Prompt Template permission set. Why not the others: B Marketing Cloud admin is unrelated; C the Trust Layer should stay on; D Manager is only for builders.","reference":"Salesforce Help — Set Up Einstein Prompt Builder"},{"id":"PE-049","domain":"prompt-engineering","topic":"Permissions","difficulty":"hard","type":"single","stem":"A rep reports they can run a template but now needs to edit its wording. They currently have only Prompt Template User. If the org wants reps to keep only running templates, what is the correct, least-privilege action?","options":[{"id":"A","text":"Keep run-only access; a Manager makes the edit"},{"id":"B","text":"Grant the rep full System Administrator access"},{"id":"C","text":"Grant every rep Prompt Template Manager rights"},{"id":"D","text":"Disable the Trust Layer to permit template edits"}],"correct":["A"],"explanation":"Correct: A — keep run-only access and let a Prompt Template Manager make the edit. Why not the others: B and C over-provision; D the Trust Layer is unrelated to edit rights.","reference":"Salesforce Help — Prompt Builder Permission Sets"},{"id":"PE-050","domain":"prompt-engineering","topic":"Prompt Best Practices","difficulty":"medium","type":"single","stem":"A prompt says \"Write something about the account.\" Outputs are vague and inconsistent. What is the best improvement?","options":[{"id":"A","text":"Increase the model temperature for more variety"},{"id":"B","text":"Remove all grounding to simplify the prompt"},{"id":"C","text":"Specify audience, content, length, and format"},{"id":"D","text":"Switch to a custom fine-tuned model instead"}],"correct":["C"],"explanation":"Correct: C — clear, specific instructions (audience, content, length, format) yield consistent output. Why not the others: A more randomness worsens consistency; B removing grounding reduces accuracy; D a custom model won't fix a vague prompt.","reference":"Trailhead — Prompt Writing Best Practices"},{"id":"PE-051","domain":"prompt-engineering","topic":"Prompt Best Practices","difficulty":"medium","type":"single","stem":"Ursa Major Solar wants generated emails to never promise discounts and to stay under 150 words. How should this be enforced in the template?","options":[{"id":"A","text":"Add explicit constraints to the instructions"},{"id":"B","text":"Hope the model just infers these rules on its own"},{"id":"C","text":"Only raise the model's output token limit"},{"id":"D","text":"Switch to a Record Summary template type"}],"correct":["A"],"explanation":"Correct: A — explicit constraints and guardrails in the instructions steer the model. Why not the others: B relying on inference is unreliable; C token limits don't enforce content rules; D changing type adds no constraints.","reference":"Salesforce Help — Add Guardrails to Prompts"},{"id":"PE-052","domain":"prompt-engineering","topic":"Prompt Best Practices","difficulty":"medium","type":"single","stem":"Pizza Time wants apology messages to sound warm and empathetic rather than formal. What is the most direct way to achieve this in a prompt template?","options":[{"id":"A","text":"Change the org's default display language setting"},{"id":"B","text":"Add more record merge fields to the prompt"},{"id":"C","text":"State the desired tone in the instructions"},{"id":"D","text":"Raise the max-tokens output limit setting"}],"correct":["C"],"explanation":"Correct: C — stating the tone (warm, empathetic) in the instructions guides the style. Why not the others: A language isn't tone; B more data doesn't set tone; D length isn't tone.","reference":"Salesforce Help — Prompt Writing Best Practices"},{"id":"PE-053","domain":"prompt-engineering","topic":"Prompt Best Practices","difficulty":"hard","type":"single","stem":"An admin wants generated product descriptions to consistently follow a specific structure the team already uses. Beyond instructions, which technique most improves adherence to the desired format?","options":[{"id":"A","text":"Remove the instructions from the template"},{"id":"B","text":"Add a well-formatted example (few-shot)"},{"id":"C","text":"Drastically lower the output token limit"},{"id":"D","text":"Turn off grounding for this template"}],"correct":["B"],"explanation":"Correct: B — a few-shot example shows the exact structure to imitate. Why not the others: A removing instructions loses control; C tiny token limits truncate output; D grounding is unrelated to format.","reference":"Salesforce Help — Provide Examples in Prompts"},{"id":"PE-054","domain":"prompt-engineering","topic":"Prompt Best Practices","difficulty":"medium","type":"single","stem":"A prompt asks the model to \"summarize recent activity,\" but \"recent\" is interpreted inconsistently. What is the best fix?","options":[{"id":"A","text":"Let the model guess what recent means each run"},{"id":"B","text":"Increase the model's temperature setting"},{"id":"C","text":"Add a second, unrelated instruction line"},{"id":"D","text":"Define \"recent\" precisely, e.g., last 30 days"}],"correct":["D"],"explanation":"Correct: D — defining ambiguous terms precisely produces consistent output. Why not the others: A guessing perpetuates inconsistency; B randomness worsens it; C unrelated instructions add noise.","reference":"Salesforce Help — Avoid Ambiguity in Prompts"},{"id":"PE-055","domain":"prompt-engineering","topic":"Prompt Best Practices","difficulty":"hard","type":"single","stem":"A company is unsure whether to put a reusable, grounded generative task's detailed instructions in the agent's topic instructions or in a prompt template. Which guidance is best?","options":[{"id":"A","text":"Put it in a grounded, testable template the agent invokes"},{"id":"B","text":"Put all generative detail in the agent welcome message"},{"id":"C","text":"Never use prompt templates with agents at all"},{"id":"D","text":"Duplicate the full instructions in every topic"}],"correct":["A"],"explanation":"Correct: A — a reusable, grounded task belongs in a template the agent calls as an action. Why not the others: B welcome messages can't ground or generate reliably; C agents and templates work together; D duplication is unmaintainable.","reference":"Salesforce Help — Prompt Templates as Agent Actions"},{"id":"PE-056","domain":"prompt-engineering","topic":"Prompt Best Practices","difficulty":"medium","type":"multi","stem":"Which of the following are recognized prompt-writing best practices? (Select 3)","options":[{"id":"A","text":"Be clear and specific about the task and output"},{"id":"B","text":"Include explicit constraints and the desired tone"},{"id":"C","text":"Keep instructions vague so the model is creative"},{"id":"D","text":"Provide examples of the expected output format"},{"id":"E","text":"Rely on the model to invent any missing data"}],"correct":["A","B","D"],"explanation":"Correct: A, B, D — clarity, constraints and tone, and examples all improve results. Why not the others: C vagueness causes inconsistency; E inventing data causes hallucination.","reference":"Trailhead — Prompt Writing Best Practices"},{"id":"PE-057","domain":"prompt-engineering","topic":"Dynamic Content","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters wants a template to include a loyalty-program paragraph only when the customer is a loyalty member, and omit it otherwise. What is a valid approach?","options":[{"id":"A","text":"Always include it and have reps delete it manually"},{"id":"B","text":"Build dozens of near-identical templates per case"},{"id":"C","text":"Use conditional content driven by grounded data"},{"id":"D","text":"Raise the temperature so the model decides randomly"}],"correct":["C"],"explanation":"Correct: C — conditional content based on grounded data shows the paragraph only when applicable. Why not the others: A manual deletion is error-prone; B per-case templates don't scale; D randomness isn't reliable logic.","reference":"Salesforce Help — Conditional Content in Prompt Templates"},{"id":"PE-058","domain":"prompt-engineering","topic":"Dynamic Content","difficulty":"hard","type":"single","stem":"Universal Containers has a Flex template whose output must be consumed by a downstream Flow that expects specific fields. How should the admin design the prompt?","options":[{"id":"A","text":"Write free-form prose and hope the Flow parses it"},{"id":"B","text":"Return structured output (a defined JSON shape)"},{"id":"C","text":"Return a different output format on every run"},{"id":"D","text":"Disable grounding to simplify the parsing"}],"correct":["B"],"explanation":"Correct: B — a defined structured format (like JSON with named fields) makes downstream parsing reliable. Why not the others: A free-form prose is hard to parse; C inconsistent formats break automation; D grounding is unrelated to structure.","reference":"Salesforce Help — Structured Output from Prompts"},{"id":"PE-059","domain":"prompt-engineering","topic":"Dynamic Content","difficulty":"medium","type":"multi","stem":"An admin wants a single template to adapt its content to each record instead of maintaining many templates. Which techniques support this? (Select 2)","options":[{"id":"A","text":"A separate template for every possible record"},{"id":"B","text":"Hard-coding one customer's details in the prompt"},{"id":"C","text":"Grounding with merge fields to insert live data"},{"id":
