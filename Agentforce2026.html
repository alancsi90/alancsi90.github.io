ion volume grows over time. Why not the others: A is Optimizer technical debt; C is a model setting; E is a Trust Layer compliance count, not adoption.","reference":"Salesforce Help — Agent Adoption Metrics"},{"id":"GO-020","domain":"governance-observability","topic":"Metric Selection","difficulty":"medium","type":"single","stem":"A support manager only wants to reduce repeat contacts. Which single metric most directly signals that the agent fully resolves issues the first time?","options":[{"id":"A","text":"The number of distinct topics currently enabled on the agent"},{"id":"B","text":"Session volume, the raw count of chats handled per day"},{"id":"C","text":"First-contact resolution rate, issues fully solved on the first try"},{"id":"D","text":"Average tokens consumed per prompt sent to the model"}],"correct":["C"],"explanation":"Correct: C — First-contact resolution rate most directly signals issues are fully solved the first time, reducing repeat contacts. Why not the others: A is configuration; B measures activity, not resolution; D is a model-level detail.","reference":"Salesforce Help — Agent Performance Metrics"},{"id":"GO-021","domain":"governance-observability","topic":"Optimization Workflow","difficulty":"medium","type":"single","stem":"After launch, Universal Containers wants a repeatable loop to keep improving its agent. Which sequence reflects the recommended optimization workflow?","options":[{"id":"A","text":"Refine settings at random, then glance at the analytics roughly once a year"},{"id":"B","text":"Review analytics for weak spots, refine config and grounding, re-measure"},{"id":"C","text":"Delete every underperforming topic permanently without any analysis"},{"id":"D","text":"Raise the model temperature repeatedly until the escalation rate drops"}],"correct":["B"],"explanation":"Correct: B — The loop is data-driven: find weak topics/actions in analytics, refine the relevant configuration and grounding, then re-measure and iterate. Why not the others: A abandons continuous measurement; C deletes without diagnosis; D blindly tunes the model with no evidence.","reference":"Salesforce Help — Optimize Your Agent"},{"id":"GO-022","domain":"governance-observability","topic":"Optimization Workflow","difficulty":"hard","type":"single","stem":"Cloud Kicks finds via Agent Analytics that the \"Order Status\" topic has the lowest resolution score. Session Tracing shows the agent often lacks the data to answer. What is the best next optimization step?","options":[{"id":"A","text":"Delete the \"Order Status\" topic so it stops lowering the score"},{"id":"B","text":"Raise the agent's response temperature to make it more creative"},{"id":"C","text":"Turn off the Einstein Trust Layer for that one topic to speed responses up"},{"id":"D","text":"Strengthen the grounding and actions so the topic can retrieve order data"}],"correct":["D"],"explanation":"Correct: D — If tracing shows missing data, strengthen the grounding or actions feeding the topic so it can answer. Why not the others: A removes needed functionality; B changes randomness, not data availability; C disabling safety won't supply data and harms compliance.","reference":"Salesforce Help — Optimize Your Agent"},{"id":"GO-023","domain":"governance-observability","topic":"Optimization Workflow","difficulty":"medium","type":"single","stem":"Session Tracing reveals a specific action frequently errors out mid-conversation at Pizza Time. Which optimization is most appropriate?","options":[{"id":"A","text":"Diagnose and fix that action's inputs, logic, or permissions, then re-test"},{"id":"B","text":"Add several unrelated topics to distract users from the failing action"},{"id":"C","text":"Increase the overall session volume so those frequent failures simply average out"},{"id":"D","text":"Export the Digital Wallet statement to try to see the action error"}],"correct":["A"],"explanation":"Correct: A — A frequently failing action should be diagnosed and fixed (inputs, logic, permissions), then re-tested. Why not the others: B adds noise; C hides rather than fixes failures; D shows cost, not action errors.","reference":"Salesforce Help — Optimize Your Agent"},{"id":"GO-024","domain":"governance-observability","topic":"Optimization Workflow","difficulty":"hard","type":"multi","stem":"When Agent Analytics highlights an underperforming topic at Ursa Major Solar, which THREE levers are appropriate to refine as part of optimization? (Choose 3)","options":[{"id":"A","text":"The org's deprecated Apex classes flagged by Optimizer"},{"id":"B","text":"The customer's home internet connection quality during the chat"},{"id":"C","text":"The topic's own instructions and the scope you define for it"},{"id":"D","text":"The set of actions you make available to that topic"},{"id":"E","text":"The grounding and knowledge sources the topic can retrieve"}],"correct":["C","D","E"],"explanation":"Correct: C, D, E — Optimization refines the weak topic's instructions, actions, and grounding. Why not the others: A is Salesforce Optimizer technical debt unrelated to agent quality; B is outside Salesforce's control and not a configuration lever.","reference":"Salesforce Help — Optimize Your Agent"},{"id":"GO-025","domain":"governance-observability","topic":"Optimization Workflow","difficulty":"medium","type":"single","stem":"An admin wants to optimize the agent but isn't sure where to start. What is the recommended data-driven starting point?","options":[{"id":"A","text":"Rewrite every instruction in the agent regardless of how it performs"},{"id":"B","text":"Start by disabling grounding everywhere to simplify the agent's whole setup"},{"id":"C","text":"Begin by lowering the pass threshold configured in Testing Center"},{"id":"D","text":"Let Agent Analytics find the lowest-resolution topics and failing actions"}],"correct":["D"],"explanation":"Correct: D — Use analytics to target the weakest topics/actions so effort goes where it matters. Why not the others: A is untargeted busywork; B removes grounding the agent likely needs; C masks problems by weakening the tests.","reference":"Salesforce Help — Optimize Your Agent"},{"id":"GO-026","domain":"governance-observability","topic":"Optimization Workflow","difficulty":"medium","type":"single","stem":"After refining instructions for a weak topic, what should Northern Trail Outfitters do to confirm the change worked?","options":[{"id":"A","text":"Assume the change worked and simply move on to the next topic"},{"id":"B","text":"Delete the analytics history so the topic can start from a clean slate"},{"id":"C","text":"Re-measure that topic's resolution score in Agent Analytics"},{"id":"D","text":"Run the Salesforce Optimizer report to confirm the improvement landed"}],"correct":["C"],"explanation":"Correct: C — Optimization is iterative: re-measure the topic's metrics after changing it to verify improvement. Why not the others: A skips verification; B destroys the baseline needed for comparison; D Optimizer measures technical debt, not topic resolution.","reference":"Salesforce Help — Optimize Your Agent"},{"id":"GO-027","domain":"governance-observability","topic":"Unresolved Patterns","difficulty":"hard","type":"single","stem":"Analytics show many conversations at Universal Containers ask about \"warranty extensions,\" a subject the agent has no topic for, causing escalations. What is the best optimization?","options":[{"id":"A","text":"Ignore these requests since no matching topic happens to exist in the agent yet"},{"id":"B","text":"Create a new topic and action with grounding to handle warranty extensions"},{"id":"C","text":"Increase the handling-time limit so those chats can run longer"},{"id":"D","text":"Mask the word \"warranty\" inside the Einstein Trust Layer settings"}],"correct":["B"],"explanation":"Correct: B — Recurrent unhandled requests signal a coverage gap; build a new topic/action with grounding to handle it. Why not the others: A leaves the gap and the escalations; C adds no capability; D masking is for PII/safety, not adding functionality.","reference":"Salesforce Help — Optimize Your Agent"},{"id":"GO-028","domain":"governance-observability","topic":"Optimization Workflow","difficulty":"medium","type":"single","stem":"With limited time, Cloud Kicks must choose which topic to optimize first. Which prioritization is most sound?","options":[{"id":"A","text":"Prioritize high-volume topics that also carry the lowest resolution scores"},{"id":"B","text":"Optimize whichever topic currently has the fewest total conversations first"},{"id":"C","text":"Optimize the topics in alphabetical order by their display name"},{"id":"D","text":"Optimize whichever topic happened to be created most recently"}],"correct":["A"],"explanation":"Correct: A — Focusing on high-volume, low-resolution topics yields the greatest improvement per unit of effort. Why not the others: B, C, and D ignore impact and the data entirely.","reference":"Salesforce Help — Optimize Your Agent"},{"id":"GO-029","domain":"governance-observability","topic":"Optimization Workflow","difficulty":"hard","type":"single","stem":"Which single analytics signal most strongly indicates that a topic needs optimization at a company?","options":[{"id":"A","text":"A high number of grounding sources attached to the topic"},{"id":"B","text":"The topic simply appearing first in alphabetical order"},{"id":"C","text":"A large count of unused fields sitting in the org"},{"id":"D","text":"A persistently low resolution or coherence score for that topic"}],"correct":["D"],"explanation":"Correct: D — A low resolution/coherence score directly flags a topic that isn't serving customers well. Why not the others: A a high source count doesn't imply poor performance; B naming is irrelevant; C unused fields are Salesforce Optimizer technical debt.","reference":"Salesforce Help — Optimize Your Agent"},{"id":"GO-030","domain":"governance-observability","topic":"Optimization Workflow","difficulty":"medium","type":"single","stem":"Before pushing an optimized topic to production, what complements production analytics to validate the change safely?","options":[{"id":"A","text":"Push the change straight to production without any further testing at all"},{"id":"B","text":"Only glance at the Digital Wallet before releasing the new version"},{"id":"C","text":"Re-run evaluations in Testing Center or Conversation Preview first"},{"id":"D","text":"Delete the previous topic version from every sandbox in the org"}],"correct":["C"],"explanation":"Correct: C — Validate optimizations with Testing Center/Conversation Preview before deploying, complementing production analytics. Why not the others: A risks regressions; B shows only cost; D is destructive and validates nothing about behavior.","reference":"Salesforce Help — Test and Optimize Agents"},{"id":"GO-031","domain":"governance-observability","topic":"Einstein Trust Layer","difficulty":"medium","type":"single","stem":"A compliance officer at Universal Containers needs a record of every prompt sent to the LLM and every response returned, for audit purposes. Which Einstein Trust Layer capability provides this?","options":[{"id":"A","text":"The Agent Analytics dashboards summarizing performance KPIs"},{"id":"B","text":"The audit trail, which logs each prompt sent and response returned"},{"id":"C","text":"The Salesforce Optimizer report on deprecated components"},{"id":"D","text":"The Digital Wallet view of usage measured against your credit entitlement"}],"correct":["B"],"explanation":"Correct: B — The Trust Layer audit trail logs prompts and responses (plus masking and toxicity metadata) for compliance. Why not the others: A is performance analytics, not a compliance log; C scans technical debt; D tracks usage and cost.","reference":"Salesforce Help — Einstein Trust Layer Audit Trail"},{"id":"GO-032","domain":"governance-observability","topic":"Data Masking","difficulty":"medium","type":"single","stem":"Cloud Kicks must ensure customer PII isn't exposed to the third-party LLM. Which Trust Layer feature addresses this?","options":[{"id":"A","text":"Deflection-rate trend tracking shown on the Agent Analytics dashboards"},{"id":"B","text":"Session Tracing, which records the flow of each conversation"},{"id":"C","text":"Conversation completion rate reported across all the sessions"},{"id":"D","text":"Dynamic masking of sensitive fields before the prompt reaches the LLM"}],"correct":["D"],"explanation":"Correct: D — Data masking detects and masks PII/sensitive data before the prompt reaches the model, then demasks the response. Why not the others: A, B, and C are performance/observability features, not data protection.","reference":"Salesforce Help — Einstein Trust Layer Data Masking"},{"id":"GO-033","domain":"governance-observability","topic":"Toxicity Detection","difficulty":"medium","type":"single","stem":"Northern Trail Outfitters wants responses screened for harmful or offensive content and scored accordingly. Which Trust Layer capability applies?","options":[{"id":"A","text":"Toxicity detection, which screens responses and assigns a safety score"},{"id":"B","text":"Escalation-rate reporting drawn from the Agent Analytics dashboard"},{"id":"C","text":"Adoption metrics showing how many distinct users actively engage the agent"},{"id":"D","text":"The Session Tracing Data Model that captures interaction detail"}],"correct":["A"],"explanation":"Correct: A — The Trust Layer scans responses for toxic/harmful content and assigns a toxicity score. Why not the others: B, C, and D are observability/performance capabilities, not safety scoring.","reference":"Salesforce Help — Einstein Trust Layer Toxicity Scoring"},{"id":"GO-034","domain":"governance-observability","topic":"Einstein Trust Layer","difficulty":"hard","type":"multi","stem":"A security architect at Ursa Major Solar is documenting what the Einstein Trust Layer provides for governance and compliance. Which THREE are Trust Layer capabilities? (Choose 3)","options":[{"id":"A","text":"Dynamic PII data masking applied before prompts reach the model"},{"id":"B","text":"Toxicity detection that screens responses and scores them"},{"id":"C","text":"Aggregated deflection-rate dashboards for the support leadership team"},{"id":"D","text":"Zero data retention agreed with the external model provider"},{"id":"E","text":"Scanning the org for deprecated and unused components"}],"correct":["A","B","D"],"explanation":"Correct: A, B, D — Data masking, toxicity scoring, and zero data retention are core Trust Layer trust/safety features. Why not the others: C is Agent Analytics (performance), not the Trust Layer; E is Salesforce Optimizer technical-debt scanning.","reference":"Salesforce Help — Einstein Trust Layer"},{"id":"GO-035","domain":"governance-observability","topic":"Zero Data Retention","difficulty":"hard","type":"single","stem":"A Pizza Time legal reviewer worries the LLM provider might store and train on company prompts. Which Trust Layer principle addresses this concern?","options":[{"id":"A","text":"Deflection rate, the share of chats resolved without a human"},{"id":"B","text":"Session completion rate measured across every conversation"},{"id":"C","text":"Zero data retention, so the provider won't store prompts or train on them"},{"id":"D","text":"The toxicity score attached to each response in the audit trail"}],"correct":["C"],"explanation":"Correct: C — Zero data retention means the provider doesn't store prompts/responses or train on them, directly addressing the legal concern. Why not the others: A and B are performance metrics; D is a safety score, not a retention guarantee.","reference":"Salesforce Help — Einstein Trust Layer Zero Retention"},{"id":"GO-036","domain":"governance-observability","topic":"Feedback Capture","difficulty":"medium","type":"single","stem":"Universal Containers wants to capture end-user or agent feedback (for example, thumbs up/down) on responses to improve quality over time. Which Trust Layer capability supports this?","options":[{"id":"A","text":"The Salesforce Optimizer scan of the org's technical debt"},{"id":"B","text":"Feedback capture, stored alongside the Trust Layer audit data"},{"id":"C","text":"Digital Wallet consumption logs measured against credits"},{"id":"D","text":"The topic resolution score shown on the main analytics dashboard"}],"correct":["B"],"explanation":"Correct: B — The Trust Layer captures feedback alongside audit data, enabling quality review over time. Why not the others: A scans technical debt; C tracks cost; D is a performance metric, not feedback capture.","reference":"Salesforce Help — Einstein Trust Layer Feedback"},{"id":"GO-037","domain":"governance-observability","topic":"Einstein Trust Layer","difficulty":"hard","type":"single","stem":"A new admin assumes the Einstein Trust Layer will tell them the agent's escalation rate and CSAT. Why is this assumption incorrect?","options":[{"id":"A","text":"The Trust Layer measures only CSAT and nothing beyond that score"},{"id":"B","text":"The Trust Layer is simply another name for the Agent Analytics app"},{"id":"C","text":"The Trust Layer replaces Session Tracing as the source of agent KPIs"},{"id":"D","text":"It governs trust, safety, and compliance, not performance KPIs"}],"correct":["D"],"explanation":"Correct: D — The Trust Layer is about trust, safety, and compliance, not performance KPIs like escalation or CSAT (that's Agent Analytics). Why not the others: A, B, and C wrongly equate the Trust Layer with performance analytics.","reference":"Salesforce Help — Einstein Trust Layer"},{"id":"GO-038","domain":"governance-observability","topic":"Audit Trail","difficulty":"medium","type":"single","stem":"A governance team wants to periodically review masked prompts, responses, and toxicity scores captured by the Trust Layer. Where is this audit data made available for review?","options":[{"id":"A","text":"Inside the Salesforce Optimizer report on the org's technical debt"},{"id":"B","text":"Inside the Digital Wallet view of usage-based consumption against entitlement"},{"id":"C","text":"In the Trust Layer audit trail, surfaced through Data Cloud / Data 360"},{"id":"D","text":"Only within the Agent Builder canvas used to design the agent"}],"correct":["C"],"explanation":"Correct: C — Trust Layer audit data (masked prompts/responses, toxicity scores, feedback) is captured in the audit trail and surfaced through Data Cloud / Data 360. Why not the others: A is technical-debt scanning; B tracks usage/cost; D is the build canvas, not an audit store.","reference":"Salesforce Help — Einstein Trust Layer Audit Trail"},{"id":"GO-039","domain":"governance-observability","topic":"Einstein Trust Layer","difficulty":"hard","type":"multi","stem":"A company must separate compliance questions from performance questions. Which TWO questions are answered by the Einstein Trust Layer rather than Agent Analytics? (Choose 2)","options":[{"id":"A","text":"\"What is our overall deflection rate for this whole quarter?\""},{"id":"B","text":"\"Which topic currently has the lowest resolution score?\""},{"id":"C","text":"\"How many sessions did the agent handle yesterday?\""},{"id":"D","text":"\"Was customer PII masked before it reached the model?\""},{"id":"E","text":"\"Did a response get flagged as toxic, and with what score?\""}],"correct":["D","E"],"explanation":"Correct: D, E — PII masking and toxicity flags/scores are Trust Layer (compliance/safety) concerns. Why not the others: A, B, and C are performance metrics answered by Agent Analytics/Observability.","reference":"Salesforce Help — Einstein Trust Layer"},{"id":"GO-040","domain":"governance-observability","topic":"Audit Trail","difficulty":"medium","type":"single","stem":"An analyst tries to compute the agent's escalation rate by exporting raw prompt/response logs from the Trust Layer audit trail. Why is this the wrong approach?","options":[{"id":"A","text":"Audit logs are compliance records; escalation rate is an Agent Analytics KPI"},{"id":"B","text":"The audit trail already displays the current escalation rate on its home page"},{"id":"C","text":"Raw prompt logs are actually the only valid source for escalation rate"},{"id":"D","text":"Escalation rate simply cannot be measured anywhere within Agentforce"}],"correct":["A"],"explanation":"Correct: A — Audit-trail logs are compliance artifacts; use Agent Analytics for aggregated KPIs like escalation rate. Why not the others: B the audit trail isn't a KPI dashboard; C raw logs aren't the authoritative KPI source; D escalation rate is available in Agent Analytics.","reference":"Salesforce Help — Agent Analytics vs Trust Layer"},{"id":"GO-041","domain":"governance-observability","topic":"Tool Selection","difficulty":"medium","type":"single","stem":"A manager wants aggregated agent KPIs. Which capability is the correct source?","options":[{"id":"A","text":"The Einstein Trust Layer audit trail of prompts and responses"},{"id":"B","text":"Agentforce Observability, using the Agent Analytics dashboards"},{"id":"C","text":"The Salesforce Optimizer scan of the org's technical debt"},{"id":"D","text":"Data Loader, the tool built for bulk importing and exporting records"}],"correct":["B"],"explanation":"Correct: B — Aggregated agent KPIs come from Agentforce Observability / Agent Analytics. Why not the others: A is compliance logging; C scans org technical debt; D is a data import/export tool.","reference":"Salesforce Help — Agentforce Observability"},{"id":"GO-042","domain":"governance-observability","topic":"Salesforce Optimizer","difficulty":"medium","type":"single","stem":"An admin suggests running \"Salesforce Optimizer\" to improve the agent's escalation rate. Why is this a category error?","options":[{"id":"A","text":"Optimizer is actually the primary KPI dashboard for the whole agent"},{"id":"B","text":"Optimizer masks PII in the prompts before they reach the external model"},{"id":"C","text":"Optimizer captures the session traces for each agent conversation"},{"id":"D","text":"Optimizer scans the org for technical debt, not agent conversation performance"}],"correct":["D"],"explanation":"Correct: D — Optimizer is an org health/technical-debt report, unrelated to agent conversation performance. Why not the others: A agent KPIs come from Agent Analytics; B masking is the Trust Layer; C tracing is Observability.","reference":"Salesforce Help — Salesforce Optimizer"},{"id":"GO-043","domain":"governance-observability","topic":"Tool Selection","difficulty":"hard","type":"single","stem":"Ursa Major Solar's auditors ask for evidence that PII was masked and that responses were screened for toxicity. Which tool provides this evidence?","options":[{"id":"A","text":"The Agent Analytics dashboards summarizing deflection and CSAT trends"},{"id":"B","text":"The Salesforce Optimizer report on deprecated org components"},{"id":"C","text":"The Trust Layer audit trail, which records masking and toxicity data"},{"id":"D","text":"The Session Tracing Data Model that maps each conversation flow"}],"correct":["C"],"explanation":"Correct: C — The Trust Layer audit trail records masking and toxicity-screening evidence for auditors. Why not the others: A shows performance KPIs; B scans technical debt; D traces conversation flow, not compliance evidence.","reference":"Salesforce Help — Einstein Trust Layer Audit Trail"},{"id":"GO-044","domain":"governance-observability","topic":"Tool Selection","difficulty":"hard","type":"single","stem":"A director wants to know which topics underperform and then drill into failing sessions. Which tool is correct?","options":[{"id":"A","text":"The Einstein Trust Layer, which logs prompts, responses, and masking"},{"id":"B","text":"Agentforce Observability, combining Agent Analytics with Session Tracing"},{"id":"C","text":"The Salesforce Optimizer report scanning the org's accumulated technical debt"},{"id":"D","text":"The Digital Wallet view of consumption against your entitlement"}],"correct":["B"],"explanation":"Correct: B — Agent Analytics surfaces underperforming topics and Session Tracing drills into failing sessions. Why not the others: A is compliance/safety; C is technical debt; D is cost and usage.","reference":"Salesforce Help — Agentforce Observability"},{"id":"GO-045","domain":"governance-observability","topic":"Tool Selection","difficulty":"hard","type":"multi","stem":"A company is training new admins to pick the right tool. Which TWO mappings are correct? (Choose 2)","options":[{"id":"A","text":"Aggregated performance KPIs map to Agent Analytics / Observability"},{"id":"B","text":"Agent escalation rate maps to the Salesforce Optimizer health report"},{"id":"C","text":"PII masking evidence maps to the Session Tracing Data Model"},{"id":"D","text":"Prompt and response compliance logging maps to the audit trail"},{"id":"E","text":"Topic resolution score maps to the Digital Wallet statement"}],"correct":["A","D"],"explanation":"Correct: A, D — Performance KPIs come from Agent Analytics; compliance logging comes from the Trust Layer audit trail. Why not the others: B Optimizer is technical debt; C masking evidence lives in the Trust Layer, not Session Tracing; E resolution scores are in Agent Analytics, not the Digital Wallet.","reference":"Salesforce Help — Agentforce Governance & Observability"},{"id":"GO-046","domain":"governance-observability","topic":"Usage & Cost","difficulty":"medium","type":"single","stem":"Finance at Pizza Time wants to monitor how many Agentforce actions/conversations are consumed against their entitlement. Which tool is most appropriate?","options":[{"id":"A","text":"The Digital Wallet, the usage-based consumption view in Setup"},{"id":"B","text":"The Agent Analytics resolution dashboard broken out by topic"},{"id":"C","text":"The Einstein Trust Layer audit trail of prompts, responses, and masking"},{"id":"D","text":"The Salesforce Optimizer scan of the org's technical debt"}],"correct":["A"],"explanation":"Correct: A — The Digital Wallet shows usage-based consumption against entitlements. Why not the others: B measures conversation quality, not consumption; C is compliance logging; D is technical debt.","reference":"Salesforce Help — Digital Wallet & Usage-Based Entitlements"},{"id":"GO-047","domain":"governance-observability","topic":"Tool Selection","difficulty":"hard","type":"single","stem":"A stakeholder says: \"I need to prove to legal that we don't send unmasked SSNs to the model, AND separately I need to show the VP our deflection trend.\" Which combination is correct?","options":[{"id":"A","text":"Agent Analytics for both the masking proof and the deflection trend"},{"id":"B","text":"The Einstein Trust Layer for both the masking proof and the trend"},{"id":"C","text":"Salesforce Optimizer for both the masking proof and the deflection trend line"},{"id":"D","text":"Trust Layer audit trail for the masking proof; Agent Analytics for the trend"}],"correct":["D"],"explanation":"Correct: D — Masking evidence is a Trust Layer/compliance artifact; the deflection trend is an Agent Analytics performance KPI. Why not the others: A, B, and C force one tool onto two fundamentally different needs.","reference":"Salesforce Help — Governance & Observability"},{"id":"GO-048","domain":"governance-observability","topic":"Salesforce Optimizer","difficulty":"medium","type":"single","stem":"Evaluate this claim: \"The Salesforce Optimizer report will tell me which subagents are deprecated and how my agent is performing.\" Which response is accurate?","options":[{"id":"A","text":"Optimizer reports both accumulated technical debt and the full set of agent KPIs"},{"id":"B","text":"Optimizer is genuinely the only place to view any agent performance"},{"id":"C","text":"Optimizer covers org technical debt, not agent performance; use Agent Analytics"},{"id":"D","text":"Optimizer masks PII in prompts and also tracks the overall CSAT score"}],"correct":["C"],"explanation":"Correct: C — Optimizer covers org technical debt; agent performance comes from Agent Analytics. Why not the others: A, B, and D overstate Optimizer's scope and confuse it with Observability/Trust Layer.","reference":"Salesforce Help — Salesforce Optimizer"},{"id":"GO-049","domain":"governance-observability","topic":"Tool Selection","difficulty":"medium","type":"single","stem":"A teammate insists the Trust Layer audit trail is \"just another analytics dashboard.\" What is the most accurate correction?","options":[{"id":"A","text":"It is effectively identical to the Agent Analytics dashboards"},{"id":"B","text":"It's a compliance log of prompts, responses, and toxicity — not analytics"},{"id":"C","text":"It stores only the CSAT scores gathered after each conversation"},{"id":"D","text":"It scans the org for unused fields, limits, and other deprecated components"}],"correct":["B"],"explanation":"Correct: B — The audit trail is a compliance/safety record, distinct from performance analytics. Why not the others: A it isn't Agent Analytics; C it captures far more than CSAT, which isn't its purpose; D field scanning is Salesforce Optimizer.","reference":"Salesforce Help — Einstein Trust Layer Audit Trail"},{"id":"GO-050","domain":"governance-observability","topic":"Tool Selection","difficulty":"hard","type":"single","stem":"A customer reports the agent returned an offensive response at Northern Trail Outfitters. Compliance wants to confirm whether it was flagged and see the exact exchange. Which tool is correct?","options":[{"id":"A","text":"The Agent Analytics deflection dashboard summarized across every session"},{"id":"B","text":"The Salesforce Optimizer report on the org's deprecated components"},{"id":"C","text":"The Digital Wallet view of consumption against your entitlement"},{"id":"D","text":"The Trust Layer audit trail, with the toxicity score and logged exchange"}],"correct":["D"],"explanation":"Correct: D — The audit trail shows the logged exchange and its toxicity score, confirming whether it was flagged. Why not the others: A shows aggregate deflection, not the specific unsafe exchange; B is technical debt; C is usage and cost.","reference":"Salesforce Help — Einstein Trust Layer Audit Trail"},{"id":"GO-051","domain":"governance-observability","topic":"Guardrails","difficulty":"medium","type":"single","stem":"Universal Containers wants to ensure its agent never discusses competitor products or gives legal advice. Which governance approach keeps the agent within policy?","options":[{"id":"A","text":"Define clear topic scope and instructions that constrain the agent"},{"id":"B","text":"Rely on the Digital Wallet to block those off-limits topics"},{"id":"C","text":"Lower the model temperature all the way down to zero"},{"id":"D","text":"Increase session volume so those questions get diluted"}],"correct":["A"],"explanation":"Correct: A — Guardrails via topic scope and instructions keep the agent acting within policy. Why not the others: B tracks cost, not behavior; C reduces randomness but doesn't enforce scope; D is unrelated activity.","reference":"Salesforce Help — Agent Guardrails & Instructions"},{"id":"GO-052","domain":"governance-observability","topic":"Data Governance","difficulty":"hard","type":"single","stem":"To govern what data the agent can access, Cloud Kicks wants the agent limited to only the records and fields it truly needs. Which approach aligns with governance best practice?","options":[{"id":"A","text":"Give the Agent User the System Administrator profile for simplicity"},{"id":"B","text":"Disable the Einstein Trust Layer entirely to remove all access restrictions"},{"id":"C","text":"Scope the Agent User's profile and permission sets to least privilege"},{"id":"D","text":"Turn off Session Tracing so less data is captured about access"}],"correct":["C"],"explanation":"Correct: C — Governing data access means scoping the Agent User's permissions and sharing to least privilege. Why not the others: A over-provisions and violates least privilege; B removes safety controls; D disables observability, not data access.","reference":"Salesforce Help — Agent User Security Model"},{"id":"GO-053","domain":"governance-observability","topic":"Usage & Cost","difficulty":"medium","type":"single","stem":"Pizza Time wants to avoid unexpectedly exhausting its Agentforce consumption. Which governance practice helps manage usage and cost?","options":[{"id":"A","text":"Turn off Agent Analytics to cut down on monitoring costs"},{"id":"B","text":"Monitor consumption in the Digital Wallet and set usage thresholds"},{"id":"C","text":"Remove the Trust Layer to reduce the number of tokens used"},{"id":"D","text":"Delete the Session Tracing data every single week to save on storage"}],"correct":["B"],"explanation":"Correct: B — Track usage-based consumption in the Digital Wallet and manage against entitlements/thresholds. Why not the others: A analytics doesn't drive consumption cost; C the Trust Layer isn't a cost lever and is needed for compliance; D deleting traces harms observability, not cost.","reference":"Salesforce Help — Manage Agentforce Usage & Digital Wallet"},{"id":"GO-054","domain":"governance-observability","topic":"Data Governance","difficulty":"hard","type":"multi","stem":"A company is building an Agentforce governance program. Which THREE practices belong in it? (Choose 3)","options":[{"id":"A","text":"Raising the model temperature to boost the agent's creativity"},{"id":"B","text":"Guardrails and topic scoping that keep agents within policy"},{"id":"C","text":"Publishing every internal field to the agent for convenience"},{"id":"D","text":"Least-privilege data access via the Agent User security model"},{"id":"E","text":"Monitoring usage and cost against your entitlements"}],"correct":["B","D","E"],"explanation":"Correct: B, D, E — Guardrails, least-privilege data access, and usage/cost monitoring are core governance practices. Why not the others: A is a tuning choice that can reduce reliability, not governance; C violates least-privilege data governance.","reference":"Salesforce Help — Agentforce Governance"},{"id":"GO-055","domain":"governance-observability","topic":"Unresolved Patterns","difficulty":"medium","type":"single","stem":"As part of governance and continuous improvement, Northern Trail Outfitters wants to regularly review what customers ask that the agent fails to resolve. Which practice supports this?","options":[{"id":"A","text":"Review only the Digital Wallet statement once every month"},{"id":"B","text":"Rely on Salesforce Optimizer to surface all the unresolved queries"},{"id":"C","text":"Disable escalations so that nothing ever appears as unresolved"},{"id":"D","text":"Periodically review unresolved and escalated query patterns"}],"correct":["D"],"explanation":"Correct: D — Reviewing unresolved/escalated query patterns in analytics informs the improvement roadmap. Why not the others: A tracks cost, not unresolved topics; B Optimizer doesn't analyze conversations; C hides the problem rather than resolving it.","reference":"Salesforce Help — Review Unresolved Conversations"},{"id":"GO-056","domain":"governance-observability","topic":"Guardrails","difficulty":"hard","type":"single","stem":"Ursa Major Solar wants ongoing assurance that the agent stays within policy after launch, not just at build time. Which governance practice fits?","options":[{"id":"A","text":"Assume the initial build-time configuration will remain fully sufficient forever"},{"id":"B","text":"Monitor only on the first day of launch and then stop entirely"},{"id":"C","text":"Continuously monitor with analytics, the audit trail, and trace spot-checks"},{"id":"D","text":"Rely exclusively on customers to report any problems they hit"}],"correct":["C"],"explanation":"Correct: C — Governance is ongoing: monitor with analytics, the audit trail, and trace spot-checks, then tighten guardrails as needed. Why not the others: A, B, and D treat governance as one-time or purely reactive.","reference":"Salesforce Help — Monitor and Govern Agents"},{"id":"GO-057","domain":"governance-observability","topic":"Data Governance","difficulty":"hard","type":"single","stem":"When designing governance, which pairing of concern-to-owner is most appropriate?","options":[{"id":"A","text":"Compliance via the Trust Layer for security; performance via Agent Analytics"},{"id":"B","text":"Both compliance and performance owned only by finance via the Digital Wallet"},{"id":"C","text":"All governance concerns handled solely through the Salesforce Optimizer report"},{"id":"D","text":"Compliance handled via Agent Analytics; performance via the Trust Layer audit trail"}],"correct":["A"],"explanation":"Correct: A — Compliance/safety is reviewed through the Trust Layer by security; performance through Agent Analytics by support — each by the right owner. Why not the others: B the Digital Wallet is cost only; C Optimizer is technical debt; D swaps the correct tools for each concern.","reference":"Salesforce Help — Governance & Observability"},{"id":"GO-058","domain":"governance-observability","topic":"Usage & Cost","difficulty":"hard","type":"single","stem":"A company notices high consumption on a low-value topic that rarely resolves issues. From a governance standpoint, what is the best response?","options":[{"id":"A","text":"Immediately double the entitlement so the topic can keep running"},{"id":"B","text":"Optimize or scope down that topic so spend aligns with its value"},{"id":"C","text":"Ignore the cost entirely, since usage is not a governance concern"},{"id":"D","text":"Disable the Einstein Trust Layer for that topic to cut its token costs"}],"correct":["B"],"explanation":"Correct: B — Combine performance analytics with usage data to optimize or rescope low-value, high-cost topics. Why not the others: A spends more without fixing value; C usage/cost is a governance concern; D removing compliance controls isn't a valid cost lever.","reference":"Salesforce Help — Manage Agentforce Usage"},{"id":"GO-059","domain":"governance-observability","topic":"Audit Trail","difficulty":"medium","type":"single","stem":"A regulated financial client of a company requires proof of every AI interaction for examiners. Which governance capability satisfies this requirement?","options":[{"id":"A","text":"The Trust Layer audit trail, retaining logged prompts and responses"},{"id":"B","text":"The Agent Analytics adoption dashboard summarizing active user counts"},{"id":"C","text":"The Salesforce Optimizer report on the org's technical debt"},{"id":"D","text":"Session completion rate measured across all conversations"}],"correct":["A"],"explanation":"Correct: A — The audit trail provides the retained, examinable record of AI interactions with masking/safety metadata. Why not the others: B shows adoption, not compliance records; C is technical debt; D is a performance metric.","reference":"Salesforce Help — Einstein Trust Layer Audit Trail"},{"id":"GO-060","domain":"governance-observability","topic":"Tool Selection","difficulty":"hard","type":"multi","stem":"A support VP at Universal Containers wants a complete post-launch operating model. Which THREE statements correctly pair a need with the right Agentforce capability? (Choose 3)","options":[{"id":"A","text":"Track deflection, escalation, and CSAT trends with Agent Analytics dashboards"},{"id":"B","text":"Measure the agent's overall conversation quality using the Salesforce Optimizer"},{"id":"C","text":"Drill into one underperforming conversation with the Session Tracing model"},{"id":"D","text":"Improve a weak topic by exporting the Digital Wallet statement"},{"id":"E","text":"Prove PII masking and review toxicity scores with the audit trail"}],"correct":["A","C","E"],"explanation":"Correct: A, C, E — Analytics for KPI trends, Session Tracing for per-conversation drill-down, and the Trust Layer for masking/toxicity compliance. Why not the others: B Optimizer measures technical debt, not conversation quality; D the Digital Wallet shows cost, not how to improve a topic.","reference":"Salesforce Help — Agentforce Governance & Observability"},{"id":"MA-001","domain":"multi-agent","topic":"SOMA","difficulty":"easy","type":"single","stem":"In Salesforce's Single-Org Multi-Agent (SOMA) architecture, what best describes how agents are arranged?","options":[{"id":"A","text":"One single all-purpose agent must handle every use case in the org, with no supported way to add any others."},{"id":"B","text":"Each agent has to be deployed into its own separate Salesforce org and cannot run beside the others."},{"id":"C","text":"Several specialized agents coexist in one org, often with a coordinating agent routing to specialists."},{"id":"D","text":"Every agent is capped at exactly one topic and is blocked from calling any actions to do its work."}],"correct":["C"],"explanation":"Correct: C — SOMA means several specialized agents live in the same org, frequently with an orchestrator routing requests to the right specialist. Why not the others: A — SOMA exists precisely to allow more than one agent; B — the whole point is multiple agents in a single org, not separate orgs; D — agents can have multiple topics and actions.","reference":"Salesforce Architects — Single-Org Multi-Agent (SOMA)"},{"id":"MA-002","domain":"multi-agent","topic":"SOMA","difficulty":"medium","type":"single","stem":"Universal Containers runs one Agentforce agent that now mixes customer returns, HR time-off, and IT password resets, and the reasoning engine increasingly picks the wrong topic. What SOMA-aligned change is most appropriate?","options":[{"id":"A","text":"Split the responsibilities into focused customer-service, HR, and IT agents and route between them."},{"id":"B","text":"Delete the customer-returns topic so only the HR and IT time-off topics remain for the engine to weigh."},{"id":"C","text":"Merge every instruction into one broad topic so the engine only ever has a single option to select."},{"id":"D","text":"Lower the model's temperature setting so the reasoning engine is forced into more accurate topic picks."}],"correct":["A"],"explanation":"Correct: A — distinct audiences and functions plus topic sprawl is the classic signal to split into focused specialist agents and route between them. Why not the others: B — deleting a needed capability loses functionality; C — collapsing everything into one topic makes reasoning worse, not better; D — temperature is not the lever for routing or topic accuracy.","reference":"Salesforce Architects — Agentforce agent design patterns"},{"id":"MA-003","domain":"multi-agent","topic":"SOMA","difficulty":"medium","type":"single","stem":"Cloud Kicks wants an agent to answer order-status questions and process simple returns — closely related retail-service tasks for the same customer audience. What is the recommended first approach before reaching for multiple agents?","options":[{"id":"A","text":"Immediately build two separate agents plus an orchestrator to divide order status from returns."},{"id":"B","text":"Use the A2A protocol to split the order-status and returns work between two collaborating agents."},{"id":"C","text":"Expose each task as its own external MCP server that the agent must call out to over the network."},{"id":"D","text":"Model the two related capabilities as separate topics, each with its own actions, in one agent."}],"correct":["D"],"explanation":"Correct: D — related tasks for one audience are best handled as separate topics within a single agent; multi-agent orchestration adds overhead you don't need yet. Why not the others: A — premature multi-agent complexity; B — A2A is for agent-to-agent collaboration, not internal topic segmentation; C — MCP exposes external tools and data, not a way to structure internal topics.","reference":"Salesforce Help — Agent Topics and Actions"},{"id":"MA-004","domain":"multi-agent","topic":"SOMA","difficulty":"medium","type":"single","stem":"Northern Trail Outfitters implements an agent that inspects each incoming request and forwards it to the correct specialist agent. What is this coordinating agent commonly called in a SOMA design?","options":[{"id":"A","text":"A retriever, since it is the piece that fetches grounding data and can pass requests to specialists."},{"id":"B","text":"An orchestrator, the router agent that classifies each request and delegates to specialists."},{"id":"C","text":"A prompt template, because it formats the incoming request and can direct it to the right agent."},{"id":"D","text":"A Data Library, which stores grounding content and can route each question to the correct specialist."}],"correct":["B"],"explanation":"Correct: B — the agent that classifies requests and delegates to specialists is the orchestrator or router. Why not the others: A — a retriever fetches grounding data, it does not route; C — a prompt template only formats LLM input; D — a Data Library stores grounding content, it does not route.","reference":"Salesforce Architects — Orchestrator and specialist agents"},{"id":"MA-005","domain":"multi-agent","topic":"SOMA","difficulty":"hard","type":"single","stem":"In a SOMA setup at Ursa Major Solar, a billing specialist agent must take over a conversation from the orchestrator without forcing the customer to repeat information. What must the handoff preserve?","options":[{"id":"A","text":"Only the customer's IP address, which the specialist could use to look up the rest."},{"id":"B","text":"Nothing at all; each agent should start the conversation fresh so no stale data leaks."},{"id":"C","text":"The relevant conversation context and session variables so the specialist can continue seamlessly."},{"id":"D","text":"The base LLM's internal model weights, so the specialist reasons like the previous one."}],"correct":["C"],"explanation":"Correct: C — a good handoff passes conversation context and session variables so the specialist can continue without re-asking. Why not the others: A — an IP address is not the conversational context needed; B — starting fresh forces repetition and poor CX; D — model weights are not transferable session state.","reference":"Salesforce Architects — Agent handoff and context"},{"id":"MA-006","domain":"multi-agent","topic":"SOMA","difficulty":"hard","type":"multi","stem":"Pizza Time is deciding whether to split its single agent into multiple specialized agents. Which factors legitimately favor a multi-agent (SOMA) split? (Choose 3)","options":[{"id":"A","text":"You simply want the same single audience to get one extra, closely related FAQ answer added on."},{"id":"B","text":"The tasks serve very different audiences, such as external customers versus internal kitchen staff."},{"id":"C","text":"Separate teams need to own, deploy, and iterate on each agent independently on their own schedule."},{"id":"D","text":"You want to permanently avoid ever having to configure any topics or actions on the agent again."},{"id":"E","text":"The topics have grown so numerous that topic-selection accuracy is now visibly starting to degrade."}],"correct":["B","C","E"],"explanation":"Correct: B, C, E — differing audiences and security contexts, independent team ownership, and topic sprawl hurting selection are all valid reasons to split into specialized agents. Why not the others: A — a single extra related FAQ is just another topic in the existing agent; D — splitting agents does not remove the need for topics and actions.","reference":"Salesforce Architects — When to use multiple agents"},{"id":"MA-007","domain":"multi-agent","topic":"SOMA","difficulty":"medium","type":"single","stem":"A company runs several agents in one org and wants each to access only the data its role requires. What mechanism enforces this per-agent least privilege?","options":[{"id":"A","text":"Give every agent the full System Administrator profile so it never lacks a permission it might need."},{"id":"B","text":"Turn off the Einstein Trust Layer for that agent so permission checks stop slowing its responses."},{"id":"C","text":"Store all of the org's data in one publicly readable field that every agent can freely query at will."},{"id":"D","text":"Give each agent user a permission set granting only the objects, fields, and actions that it needs."}],"correct":["D"],"explanation":"Correct: D — each agent runs as an agent user whose permission set scopes its data and actions, enforcing least privilege. Why not the others: A — admin access violates least privilege; B — disabling the Trust Layer removes guardrails; C — making data public is a security risk.","reference":"Salesforce Help — Agentforce Agent User and permissions"},{"id":"MA-008","domain":"multi-agent","topic":"SOMA","difficulty":"medium","type":"single","stem":"Which is a real trade-off to weigh before adopting a multi-agent orchestration pattern instead of one focused agent?","options":[{"id":"A","text":"Orchestration adds routing complexity and handoff design that a single focused agent avoids."},{"id":"B","text":"Multi-agent designs remove essentially all need for testing once the routing has been set up once."},{"id":"C","text":"Multiple agents are not allowed to exist inside the same Salesforce org and must be split apart."},{"id":"D","text":"Orchestration removes the need for the Atlas Reasoning Engine because the router does the thinking."}],"correct":["A"],"explanation":"Correct: A — splitting into specialists introduces routing, handoff, and context-passing complexity you must design and test. Why not the others: B — more moving parts means more testing; C — SOMA is defined by multiple agents in one org; D — each agent still uses the reasoning engine.","reference":"Salesforce Architects — Trade-offs of multi-agent designs"},{"id":"MA-009","domain":"multi-agent","topic":"SOMA","difficulty":"medium","type":"single","stem":"Universal Containers wants each specialist agent's instructions to stay tight and unambiguous. Why does narrowing a specialist agent's scope help?","options":[{"id":"A","text":"It guarantees the agent will never need any grounding data because its scope is already so small."},{"id":"B","text":"It removes the need for user authentication, since a narrow agent handles less sensitive material."},{"id":"C","text":"A focused scope reduces topic and action ambiguity, so the engine selects actions more reliably."},{"id":"D","text":"It lets the agent skip the Trust Layer, because a tightly scoped agent has nothing risky to check."}],"correct":["C"],"explanation":"Correct: C — a tighter scope means fewer competing topics and actions, improving selection reliability. Why not the others: A — grounding is still needed for accurate answers; B and D — scope has nothing to do with removing authentication or Trust Layer protections.","reference":"Salesforce Help — Designing focused agents"},{"id":"MA-010","domain":"multi-agent","topic":"SOMA","difficulty":"medium","type":"single","stem":"A company already has an external customer-facing service agent. It now needs an internal employee helpdesk agent with access to HR records. What SOMA approach fits best?","options":[{"id":"A","text":"Add HR record access to the existing external customer agent so one agent can simply do everything."},{"id":"B","text":"Build a separate internal employee agent with its own permissions, distinct from the customer agent."},{"id":"C","text":"Delete the working customer agent and rebuild both experiences together from scratch in one place."},{"id":"D","text":"Expose the HR data publicly so that the existing customer-facing agent is able to read it as needed."}],"correct":["B"],"explanation":"Correct: B — different audiences and sensitive HR data call for a separate internal agent with its own permission scope. Why not the others: A — mixing external customer access with HR data is a security and design risk; C — no need to discard the working customer agent; D — publicly exposing HR data is a serious violation.","reference":"Salesforce Help — Internal vs external agents"},{"id":"MA-011","domain":"multi-agent","topic":"SOMA","difficulty":"hard","type":"multi","stem":"In a SOMA orchestration at Cloud Kicks, which responsibilities typically belong to the orchestrator/router agent? (Choose 2)","options":[{"id":"A","text":"Physically storing the org's entire database of records on behalf of every specialist agent."},{"id":"B","text":"Replacing the need for any specialist agents by simply answering every request all by itself."},{"id":"C","text":"Interpreting the user's intent and selecting which specialist agent should handle the request."},{"id":"D","text":"Passing along the context that a specialist needs when the request is delegated to it."},{"id":"E","text":"Encrypting the whole Salesforce platform down at the physical disk level for compliance reasons."}],"correct":["C","D"],"explanation":"Correct: C, D — the orchestrator classifies intent, routes to the right specialist, and forwards context on delegation. Why not the others: A — data storage is the platform's job, not the router's; B — the orchestrator delegates to specialists, it does not replace them; E — disk-level encryption is platform infrastructure, unrelated to routing.","reference":"Salesforce Architects — Orchestrator agent responsibilities"},{"id":"MA-012","domain":"multi-agent","topic":"SOMA","difficulty":"medium","type":"single","stem":"What does the \"Single-Org\" in SOMA specifically emphasize?","options":[{"id":"A","text":"Only a single agent is ever permitted to be active within the org on any given calendar day."},{"id":"B","text":"Agents must be spread out across many separate orgs in order for the design to scale up."},{"id":"C","text":"The whole org may contain just one single topic in total across all of its agents."},{"id":"D","text":"All agents and their orchestration run within one org's governance and security model."}],"correct":["D"],"explanation":"Correct: D — SOMA keeps multiple agents inside one org, sharing that org's governance, security, and data model. Why not the others: A — there is no one-agent-per-day limit; B — that contradicts single-org; C — an org can have many topics across its agents.","reference":"Salesforce Architects — Single-Org Multi-Agent (SOMA)"},{"id":"MA-013","domain":"multi-agent","topic":"MCP","difficulty":"easy","type":"single","stem":"What is the Model Context Protocol (MCP) in the context of Agentforce?","options":[{"id":"A","text":"A proprietary Salesforce-only database file format used to store an agent's configuration records."},{"id":"B","text":"A paid billing plan for Data 360 that meters how many external tool calls an agent may make."},{"id":"C","text":"An open standard that lets agents connect to external tools, data, and systems in a uniform way."},{"id":"D","text":"A drop-in replacement for the Salesforce login page that authenticates users into external tools."}],"correct":["C"],"explanation":"Correct: C — MCP is an open standard for connecting AI agents to external tools, data, and systems through a common interface. Why not the others: A — it is an open, cross-vendor standard, not a proprietary format; B — it is not a pricing plan; D — it has nothing to do with login pages.","reference":"Salesforce Developers — Model Context Protocol (MCP)"},{"id":"MA-014","domain":"multi-agent","topic":"MCP","difficulty":"medium","type":"single","stem":"When an Agentforce agent uses MCP to reach an external inventory system, which role does the agent play and what does the external system expose?","options":[{"id":"A","text":"The agent acts as an MCP client connecting to an MCP server that exposes both tools and resources."},{"id":"B","text":"The agent is the MCP server while the external inventory system connects in as the client."},{"id":"C","text":"Both the agent and the inventory system are MCP servers, with no client involved at all."},{"id":"D","text":"Neither side uses client or server roles, since MCP is strictly peer-to-peer messaging."}],"correct":["A"],"explanation":"Correct: A — MCP is client-server; the agent (host/client) connects to an MCP server that exposes tools and resources. Why not the others: B — the roles are reversed; C — a client is required to consume the server; D — MCP is defined as client-server, not peer-to-peer.","reference":"Salesforce Developers — MCP client and server roles"},{"id":"MA-015","domain":"multi-agent","topic":"MCP","difficulty":"medium","type":"single","stem":"An Ursa Major Solar agent needs to call an external weather service and a third-party ticketing tool through one standardized interface rather than building bespoke integrations for each. Which mechanism fits best?","options":[{"id":"A","text":"The A2A protocol, delegating each lookup to a separate vendor's autonomous agent to run for you."},{"id":"B","text":"The Model Context Protocol (MCP), a standard interface to reach several external tools and data."},{"id":"C","text":"A nightly CSV export from each service, refreshed once every evening and read by the agent later."},{"id":"D","text":"Hard-coded fetch() calls placed directly into the chat widget's front-end JavaScript on the page."}],"correct":["B"],"explanation":"Correct: B — MCP standardizes how an agent connects to multiple external tools and data sources, avoiding one-off integrations. Why not the others: A — A2A is for agent-to-agent collaboration, not tool and data access; C — a nightly export is stale and not interactive; D — client-side hard-coded calls are insecure and unstandardized.","reference":"Salesforce Developers — Extending agents with MCP"},{"id":"MA-016","domain":"multi-agent","topic":"MCP","difficulty":"medium","type":"single","stem":"Universal Containers wants to expose its existing governed APIs as MCP tools and control which callers may use them. Which Salesforce-family capability supports turning managed APIs into governed MCP servers?","options":[{"id":"A","text":"Salesforce Scheduler, whose appointment-booking engine can publish those managed APIs as MCP servers."},{"id":"B","text":"The browser favicon service, which can wrap each managed API and present it as an MCP server."},{"id":"C","text":"A Lightning record page, whose layout components can expose the managed APIs as MCP servers."},{"id":"D","text":"MuleSoft (for example, Anypoint and Flex Gateway) can expose governed APIs as MCP servers."}],"correct":["D"],"explanation":"Correct: D — MuleSoft can expose and govern APIs as MCP servers (for example via Anypoint and Flex Gateway), adding policy and control. Why not the others: A — Scheduler books appointments; B — a favicon is a UI icon; C — a record page is a UI layout, not an MCP capability.","reference":"MuleSoft — MCP support and API governance"},{"id":"MA-017","domain":"multi-agent","topic":"MCP","difficulty":"medium","type":"single","stem":"When connecting an Agentforce agent to an external MCP server, how should outbound authentication typically be handled?","options":[{"id":"A","text":"Embed the API key directly inside the agent's public instructions so the model can read it easily."},{"id":"B","text":"Ask the end user to type the MCP server's administrator password into the chat before each call."},{"id":"C","text":"Use Named and External Credentials so secrets stay secure and are never exposed to the model."},{"id":"D","text":"Disable authentication on the connection entirely to keep the whole integration simple to set up."}],"correct":["C"],"explanation":"Correct: C — outbound credentials should live in Named and External Credentials, keeping secrets out of prompts and out of user view. Why not the others: A — putting keys in instructions leaks them; B — users should never handle server admin passwords; D — disabling authentication is insecure.","reference":"Salesforce Help — Named Credentials for external callouts"},{"id":"MA-018","domain":"multi-agent","topic":"MCP","difficulty":"hard","type":"multi","stem":"A company is evaluating MCP to extend its agents. Which statements about MCP are accurate? (Choose 3)","options":[{"id":"A","text":"It is an open standard, so tools built for it can be reused across compatible clients."},{"id":"B","text":"It removes any need for a security review, since anything called a standard is safe by default."},{"id":"C","text":"It gives agents a standardized way to reach external tools, data, and systems."},{"id":"D","text":"Governance still applies: you control which servers and tools an agent may use."},{"id":"E","text":"It is a proprietary format that only ever functions inside one single Salesforce org."}],"correct":["A","C","D"],"explanation":"Correct: A, C, D — MCP is an open, reusable standard for external tool and data access, and you still govern which servers and tools are allowed and how credentials are handled. Why not the others: B — standardization does not remove the need for a security review; E — MCP is open and cross-vendor, not single-org proprietary.","reference":"Salesforce Developers — Model Context Protocol (MCP)"},{"id":"MA-019","domain":"multi-agent","topic":"MCP","difficulty":"medium","type":"single","stem":"Cloud Kicks confuses MCP with the Agent API. Which statement correctly distinguishes their direction of integration?","options":[{"id":"A","text":"They are completely identical and interchangeable, so either name refers to the exact same feature."},{"id":"B","text":"MCP lets an agent reach out to external tools and data; the Agent API lets systems call the agent."},{"id":"C","text":"MCP lets external systems invoke the agent, while the Agent API is what gives the agent new tools."},{"id":"D","text":"Both of them exist only to support agent-to-agent delegation across different software vendors."}],"correct":["B"],"explanation":"Correct: B — MCP is outbound (the agent consumes external tools and data); the Agent API is inbound (external systems invoke the agent). Why not the others: A — they solve different problems; C — this reverses the two; D — agent-to-agent delegation is A2A's job, not these.","reference":"Salesforce Developers — MCP vs Agent API"},{"id":"MA-020","domain":"multi-agent","topic":"MCP","difficulty":"medium","type":"single","stem":"Why might Pizza Time prefer MCP over writing a custom integration for every external system its agent must reach?","options":[{"id":"A","text":"Custom integrations are outright prohibited by Salesforce, so MCP is the only path that is allowed."},{"id":"B","text":"MCP guarantees the agent will never require any credentials to reach the systems it connects to."},{"id":"C","text":"MCP converts the agent itself into a full database that stores every external record it retrieves."},{"id":"D","text":"MCP offers a common, reusable interface, cutting bespoke connector work and easing maintenance."}],"correct":["D"],"explanation":"Correct: D — a standardized protocol means less one-off connector code and simpler maintenance as tools are added. Why not the others: A — custom integrations are allowed, just costlier to maintain; B — external systems still require secure credentials; C — MCP connects to tools and data, it does not turn the agent into a database.","reference":"Salesforce Developers — Why MCP"},{"id":"MA-021","domain":"multi-agent","topic":"MCP","difficulty":"medium","type":"single","stem":"An admin connects an agent to an MCP server that exposes many tools, but the agent only needs two of them. What is the best governance practice?","options":[{"id":"A","text":"Limit the agent to only the specific tools it needs, applying the least-privilege principle."},{"id":"B","text":"Expose every available tool to the agent, just to be safe in case one happens to be needed later."},{"id":"C","text":"Grant the agent write access to all connected systems now, in case a future task happens to need it."},{"id":"D","text":"Turn off logging on the connection so that routine tool use is not tracked or recorded anywhere."}],"correct":["A"],"explanation":"Correct: A — least privilege means enabling only the tools the agent actually needs. Why not the others: B — exposing everything widens the attack surface; C — unnecessary write access is dangerous; D — disabling logging harms observability and governance.","reference":"Salesforce Help — Governing agent tool access"},{"id":"MA-022","domain":"multi-agent","topic":"MCP","difficulty":"medium","type":"single","stem":"An agent needs live access to an external, frequently changing system of record during a conversation, using a standardized tool interface. Which is the most appropriate approach?","options":[{"id":"A","text":"Copy the whole external system into a spreadsheet each morning for the agent to read."},{"id":"B","text":"Retrain the base LLM every night on the external data so its answers reflect it."},{"id":"C","text":"Connect via MCP so the agent can query the external system in real time over a standard interface."},{"id":"D","text":"Ask users to paste the relevant records into the chat whenever the agent needs them."}],"correct":["C"],"explanation":"Correct: C — MCP gives the agent a standardized, real-time connection to the external system of record. Why not the others: A — a morning copy is stale; B — you do not retrain the base model for changing operational data; D — manual pasting is not scalable or reliable.","reference":"Salesforce Developers — Real-time tool access with MCP"},{"id":"MA-023","domain":"multi-agent","topic":"MCP","difficulty":"hard","type":"multi","stem":"Northern Trail Outfitters wants to keep its MCP usage secure and governed. Which controls are appropriate? (Choose 2)","options":[{"id":"A","text":"Publish the agent's client secret openly in the public help center for reuse."},{"id":"B","text":"Allow the agent unrestricted access to reach any server anywhere on the internet."},{"id":"C","text":"Remove all audit logging on the integration to cut down on background noise."},{"id":"D","text":"Restrict which MCP servers and tools each agent is allowed to call."},{"id":"E","text":"Store credentials in Named and External Credentials rather than in prompts."}],"correct":["D","E"],"explanation":"Correct: D, E — scoping the allowed servers and tools and securing credentials outside prompts are core MCP governance practices. Why not the others: A — publishing secrets is a breach; B — unrestricted access violates least privilege; C — removing logging destroys auditability.","reference":"Salesforce Help — MCP governance and security"},{"id":"MA-024","domain":"multi-agent","topic":"MCP","difficulty":"medium","type":"single","stem":"How does the Einstein Trust Layer relate to an agent's MCP connections?","options":[{"id":"A","text":"Turning on MCP disables the Einstein Trust Layer entirely for that agent's remaining interactions."},{"id":"B","text":"MCP fully replaces the Einstein Trust Layer, taking over its masking and guardrail responsibilities."},{"id":"C","text":"The Trust Layer only applies during the times when MCP is switched off for the agent in question."},{"id":"D","text":"The Trust Layer's monitoring, masking, and guardrails still govern the agent as it uses MCP tools."}],"correct":["D"],"explanation":"Correct: D — Trust Layer protections continue to apply to the agent regardless of whether it uses MCP tools. Why not the others: A and B — MCP neither disables nor replaces the Trust Layer; C — the Trust Layer is not conditional on MCP being off.","reference":"Salesforce Help — Einstein Trust Layer"},{"id":"MA-025","domain":"multi-agent","topic":"A2A","difficulty":"easy","type":"single","stem":"What is the Agent-to-Agent (A2A) protocol designed to enable?","options":[{"id":"A","text":"Encrypting the org's server hard drives at rest so that stored agent data cannot be read by others."},{"id":"B","text":"An open standard for agents, even across vendors, to discover, share context, and delegate work."},{"id":"C","text":"A faster developer workflow for writing and deploying the Apex triggers that back an agent's actions."},{"id":"D","text":"A configurable UI color theme applied to the agent's chat windows across every customer channel."}],"correct":["B"],"explanation":"Correct: B — A2A is an open standard that lets agents across vendors discover one another, share context, and delegate work. Why not the others: A — that describes disk encryption; C — A2A is not an Apex tool; D — it is a protocol, not a UI theme.","reference":"Salesforce — Agent2Agent (A2A) Protocol"},{"id":"MA-026","domain":"multi-agent","topic":"A2A","difficulty":"medium","type":"single","stem":"Universal Containers' Agentforce agent must delegate a specialized task to a partner company's non-Salesforce agent and get results back. Which standard is purpose-built for this?","options":[{"id":"A","text":"A2A, the standard built for delegating a task to another vendor's agent and getting results back."},{"id":"B","text":"MCP, to connect the agent to a set of external tools and data sources over a standard interface."},{"id":"C","text":"The Agent API, so that external systems are able to reach in and invoke your own Salesforce agent."},{"id":"D","text":"SOQL, the language used to read and filter records already stored in the Salesforce database."}],"correct":["A"],"explanation":"Correct: A — A2A is built for interoperability between agents across different vendors and platforms, including delegation. Why not the others: B — MCP connects an agent to tools and data, not to another agent as a peer; C — the Agent API lets external systems invoke your Salesforce agent, not delegate to a third-party agent; D — SOQL queries Salesforce data.","reference":"Salesforce — A2A cross-vendor interoperability"},{"id":"MA-027","domain":"multi-agent","topic":"A2A","difficulty":"medium","type":"single","stem":"In the A2A protocol, how does one agent typically learn what another agent can do before deciding whether to delegate?","options":[{"id":"A","text":"By guessing from the other agent's display name and assuming what it is probably able to do."},{"id":"B","text":"By scraping the other company's public website every night to infer what the agent can do."},{"id":"C","text":"By reading the other agent's Agent Card, which advertises the capabilities it exposes."},{"id":"D","text":"By reading the agent's raw model weights to infer which skills it must have learned."}],"correct":["C"],"explanation":"Correct: C — A2A uses Agent Cards to advertise an agent's capabilities for discovery. Why not the others: A — guessing is unreliable and not part of the standard; B — scraping is not the discovery mechanism; D — weights are not exposed or human-readable capability descriptors.","reference":"A2A Protocol — Agent Card discovery"},{"id":"MA-028","domain":"multi-agent","topic":"A2A","difficulty":"medium","type":"single","stem":"Which statement best captures how A2A and MCP complement each other?","options":[{"id":"A","text":"They are actually the same single protocol, just referred to by two different marketing names."},{"id":"B","text":"A2A connects agents to backing databases, while MCP is what connects the agents to one another."},{"id":"C","text":"Both of them work only inside one org and cannot cross between different software vendors."},{"id":"D","text":"MCP connects an agent to tools and data; A2A connects an agent to other agents to collaborate."}],"correct":["D"],"explanation":"Correct: D — MCP is for tools and data access while A2A is for agent-to-agent collaboration, so together they cover different interoperability needs. Why not the others: A — they are distinct standards; B — this reverses their roles; C — both are open, cross-vendor standards.","reference":"Salesforce Developers — MCP and A2A"},{"id":"MA-029","domain":"multi-agent","topic":"A2A","difficulty":"hard","type":"single","stem":"A2A lets a Cloud Kicks agent collaborate with a partner agent without either exposing its internal implementation. Why is treating agents as \"opaque\" valuable?","options":[{"id":"A","text":"It forces both parties to publish their full agent source code so each can audit the other openly."},{"id":"B","text":"Agents interoperate through the protocol without exposing internal tools, prompts, or their IP."},{"id":"C","text":"It requires both agents to be running on the exact same underlying LLM from the very same provider."},{"id":"D","text":"It disables all authentication between the two agents so that messages can flow without friction."}],"correct":["B"],"explanation":"Correct: B — A2A lets agents cooperate as opaque endpoints, so neither must expose internal tools, prompts, or IP. Why not the others: A — the opposite is true; no source sharing is required; C — vendors and models can differ; D — A2A still uses authentication between agents.","reference":"A2A Protocol — opaque agent interoperability"},{"id":"MA-030","domain":"multi-agent","topic":"A2A","difficulty":"hard","type":"multi","stem":"Which capabilities are characteristic of the A2A protocol? (Choose 3)","options":[{"id":"A","text":"Discovering another agent's capabilities, for example through its published Agent Card."},{"id":"B","text":"Replacing the Salesforce data model with a shared spreadsheet passed between the agents."},{"id":"C","text":"Guaranteeing that the two agents always share the exact same database tables underneath."},{"id":"D","text":"Delegating a task from one agent to another and then receiving the results back."},{"id":"E","text":"Enabling interoperability across agents built by different vendors and frameworks."}],"correct":["A","D","E"],"explanation":"Correct: A, D, E — discovery, task delegation, and cross-vendor interoperability are core A2A features. Why not the others: B — A2A does not alter the data model; C — collaborating agents need not share database tables.","reference":"Salesforce — Agent2Agent (A2A) Protocol"},{"id":"MA-031","domain":"multi-agent","topic":"A2A","difficulty":"medium","type":"single","stem":"An admin wants their single agent to call an internal calculation function. A colleague suggests using A2A. Why is A2A a poor fit here?","options":[{"id":"A","text":"A2A connections are only ever able to operate on Tuesdays, so they cannot serve a daily calculation."},{"id":"B","text":"A2A has no supported way to be secured, so it must never touch an internal calculation at all."},{"id":"C","text":"A2A is meant for agent-to-agent collaboration, not for giving one agent a simple internal tool."},{"id":"D","text":"A2A is a closed Salesforce-only system, so it cannot reach the org's own internal functions."}],"correct":["C"],"explanation":"Correct: C — a simple internal capability is better modeled as an agent action (or MCP for an external tool); A2A is overkill and mismatched. Why not the others: A — there is no such time restriction; B — A2A supports authentication; D — A2A is an open, cross-vendor standard, not Salesforce-only.","reference":"Salesforce Developers — Choosing A2A vs actions"},{"id":"MA-032","domain":"multi-agent","topic":"A2A","difficulty":"medium","type":"single","stem":"When a company's agent delegates to an external agent via A2A, what security consideration is most important?","options":[{"id":"A","text":"Authenticate the partner agent and control which context and data cross the trust boundary."},{"id":"B","text":"Nothing special is required, because external agents reached through A2A are automatically trusted."},{"id":"C","text":"Share all available customer PII with the partner agent by default, to be as helpful as possible."},{"id":"D","text":"Disable the Einstein Trust Layer for the delegated call so the two agents can exchange data faster."}],"correct":["A"],"explanation":"Correct: A — you must authenticate the counterpart agent and govern exactly what context crosses the trust boundary. Why not the others: B — external agents are not automatically trustworthy; C — oversharing PII is a privacy violation; D — disabling guardrails is unsafe.","reference":"Salesforce Help — A2A trust and data sharing"},{"id":"MA-033","domain":"multi-agent","topic":"A2A","difficulty":"medium","type":"single","stem":"Why is it significant that A2A is an open protocol backed by many industry participants?","options":[{"id":"A","text":"It means that in everyday practice only agents built by Salesforce itself will ever be able to use it."},{"id":"B","text":"It guarantees that agents using it will never require any governance or oversight from an admin."},{"id":"C","text":"It forces every participating agent onto one single shared cloud provider chosen by the standard."},{"id":"D","text":"It enables an ecosystem where agents from many vendors interoperate instead of being locked in."}],"correct":["D"],"explanation":"Correct: D — an open, multi-vendor standard enables broad interoperability instead of single-vendor lock-in. Why not the others: A — open is the opposite of Salesforce-only; B — governance is still required; C — it is cloud-agnostic, not single-provider.","reference":"Salesforce — A2A open ecosystem"},{"id":"MA-034","domain":"multi-agent","topic":"A2A","difficulty":"medium","type":"single","stem":"Pizza Time's ordering agent needs a partner logistics company's routing agent to compute an optimal delivery route and return it. Assuming both support A2A, what is the correct interaction?","options":[{"id":"A","text":"Pizza Time hard-codes the logistics company's database password into its public web widget."},{"id":"B","text":"Pizza Time's agent discovers and delegates the routing task to the logistics agent, then uses the result."},{"id":"C","text":"Pizza Time exports its delivery routes to a static CSV file once every single night."},{"id":"D","text":"A staff member emails the logistics team by hand and waits for a reply with the route."}],"correct":["B"],"explanation":"Correct: B — A2A enables discovery and delegation to the partner's agent with results returned in real time. Why not the others: A — hard-coding a partner's database password is a severe breach; C — nightly exports are stale for live routing; D — manual email is not real-time or scalable.","reference":"Salesforce — A2A task delegation"},{"id":"MA-035","domain":"multi-agent","topic":"A2A","difficulty":"hard","type":"multi","stem":"For each need below, which pairings are correctly matched? (Choose 2)","options":[{"id":"A","text":"Give an agent a brand-new external tool to call → A2A."},{"id":"B","text":"Give an agent standardized access to an external CRM's data → MCP."},{"id":"C","text":"Let two agents from different vendors collaborate → MCP."},{"id":"D","text":"Query records that already live in Salesforce → A2A."},{"id":"E","text":"Let your agent delegate a task to a third-party vendor's agent → A2A."}],"correct":["B","E"],"explanation":"Correct: B, E — MCP gives standardized tool and data access, and A2A enables cross-vendor agent delegation. Why not the others: A — a new external tool is an MCP use case, not A2A; C — cross-vendor agent collaboration is A2A, not MCP; D — Salesforce records are queried via platform features such as SOQL or actions, not A2A.","reference":"Salesforce Developers — MCP vs A2A decision guide"},{"id":"MA-036","domain":"multi-agent","topic":"A2A","difficulty":"medium","type":"single","stem":"A2A supports long-running, asynchronous delegated tasks between agents. Why is asynchronous support important for some cross-agent workflows?","options":[{"id":"A","text":"Some delegated tasks take time, so the protocol supports ongoing status updates, not one reply."},{"id":"B","text":"Because every agent task, without any exception at all, always finishes within a few milliseconds."},{"id":"C","text":"Because agents are technically unable to make any synchronous calls to one another at all, ever."},{"id":"D","text":"Because asynchronous work inherently means that no security controls are needed on the exchange."}],"correct":["A"],"explanation":"Correct: A — A2A supports longer-running tasks with status updates, which suits work that is not instantaneous. Why not the others: B — not all
