:root{color-scheme:light;--ink:#163333;--muted:#657878;--teal:#08695f;--line:#dce5df;--paper:#fff;--bg:#f3f5ef;--gold:#b2862e;--red:#a13636}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Microsoft JhengHei",sans-serif;line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button,select,input{min-height:44px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d1a643;outline-offset:3px}header{border-bottom:1px solid var(--line);background:#fff;padding:18px max(22px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;letter-spacing:.02em}.mark{display:inline-grid;place-items:center;background:var(--teal);color:white;width:32px;height:32px;border-radius:9px;margin-right:10px;font-size:14px}.badge{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:3px 11px;font-size:12px;color:var(--muted)}main{max-width:1120px;margin:auto;padding:40px 22px 60px}h1{font-size:clamp(28px,4vw,44px);line-height:1.25;letter-spacing:-.035em;margin:10px 0 16px}h2{font-size:22px;margin:0 0 15px}h3{font-size:17px;margin:0 0 10px}p{margin:0 0 14px}.muted,small{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--teal);font-weight:800}.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:40px;align-items:center;margin-bottom:34px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{border-left:2px solid var(--line);padding-left:16px}.stat b{display:block;font-size:30px;line-height:1.2}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px}.card.accent{background:#eaf1e8}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 17px;color:var(--ink);font-weight:650}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.danger{color:var(--red)}.btn.small{font-size:13px;min-height:36px;padding:5px 10px}label.field{display:block;margin:15px 0}label.field>span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}select,input[type=number]{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:white;color:var(--ink)}.checks{display:flex;gap:18px;flex-wrap:wrap}.checks label{display:flex;gap:7px;align-items:center;font-size:14px}.checks input{min-height:0;width:17px;height:17px;accent-color:var(--teal)}.section{margin-top:28px}.domains{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.domain{padding:16px;border:1px solid var(--line);border-radius:12px;background:white}.domain b{display:block;font-size:14px}.domain span{font-size:12px;color:var(--muted)}.notice{background:#fff5dc;border:1px solid #eadba9;border-radius:10px;padding:12px 16px;font-size:14px;margin-bottom:18px}.hidden{display:none!important}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:32px;padding-top:20px}details{margin-top:12px}summary{cursor:pointer;font-weight:650}a{color:var(--teal)}.exam-layout{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:22px}.progress{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin:15px 0 24px}.progress i{display:block;height:100%;background:var(--teal)}.stem{font-size:20px;line-height:1.6;white-space:pre-wrap;margin:22px 0}.option{display:flex;width:100%;align-items:flex-start;text-align:left;gap:13px;padding:16px;margin:11px 0;border:1px solid var(--line);background:white;border-radius:12px;color:var(--ink);font-weight:400}.option .letter{flex-shrink:0;border:1px solid var(--line);border-radius:7px;width:30px;text-align:center;font-weight:750}.option.selected{border-color:var(--teal);background:#edf6f1;box-shadow:inset 3px 0 var(--teal)}.option.correct{border-color:#37864e;background:#edf8ed}.option.wrong{border-color:#bd5858;background:#fff1ef}.option:disabled{opacity:1}.option small{display:block;font-weight:750}.explanation{background:#f0f4ed;border-left:3px solid var(--teal);padding:17px;margin-top:20px;white-space:pre-wrap}.explanation.bad{border-color:var(--red)}textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fafbf7;color:var(--ink)}.nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}.nav-grid button{min-height:35px;border:1px solid var(--line);background:white;border-radius:6px;font-size:12px;position:relative}.nav-grid button.answered{background:#dfede4}.nav-grid button.current{border:2px solid var(--teal)}.nav-grid button.flagged:after{content:'';position:absolute;right:2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--gold)}.timer{font-variant-numeric:tabular-nums;font-weight:750}.warn{color:var(--red)}.nav-scroll{max-height:440px;overflow:auto}.review-item{border-top:1px solid var(--line);padding:20px 0}.review-item:first-child{border-top:0}.answer-list{padding-left:20px}.answer-list li{margin:8px 0}.correct-text{color:#24723b}.wrong-text{color:var(--red)}.score{font-size:55px;line-height:1.2;font-weight:800}.bar{height:7px;background:var(--line);margin-top:8px;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.history-item{padding:14px 0;border-bottom:1px solid var(--line)}dialog{border:1px solid var(--line);border-radius:16px;padding:26px;max-width:430px;width:calc(100% - 32px);color:var(--ink)}dialog::backdrop{background:#142c2c77}@media(max-width:780px){.hero,.grid,.exam-layout{grid-template-columns:1fr}.hero{gap:20px}.domains{grid-template-columns:repeat(2,1fr)}main{padding-top:24px}.card{padding:20px}.exam-layout aside{order:2}.nav-grid{grid-template-columns:repeat(10,1fr)}.nav-scroll{max-height:180px}}@media(max-width:440px){.domains{grid-template-columns:1fr}.nav-grid{grid-template-columns:repeat(6,1fr)}.stem{font-size:18px}.badge{font-size:10px}}
</style>

<script id="bank" type="application/json">[{"id":"AIA-001","domain":"ai-agents","topic":"Agentforce Fundamentals","difficulty":"easy","type":"single","stem":"A company currently uses a menu-driven chatbot that only follows predefined decision trees. Leadership asks how an Agentforce agent fundamentally differs from this bot. What is the best description?","options":[{"id":"A","text":"It is the same decision-tree chatbot with a new name, still following fixed, pre-scripted dialog branches."},{"id":"B","text":"It is only a large language model that writes free-text answers and cannot take actions in Salesforce."},{"id":"C","text":"It uses the Atlas Reasoning Engine to interpret intent, plan, and choose actions dynamically."},{"id":"D","text":"It requires a human agent to review and approve each response before it is sent to the customer."}],"correct":["C"],"explanation":"Correct: C — an agent reasons over intent and dynamically selects subagents/actions via the Atlas Reasoning Engine instead of following a rigid script. Why not the others: A describes the scripted bot an agent replaces; B is wrong because agents execute real actions (Flow, Apex, API), not just chat; D is wrong because agents act autonomously within guardrails, not with mandatory per-message human approval.","reference":"Salesforce Help — What Is Agentforce"},{"id":"AIA-002","domain":"ai-agents","topic":"Agentforce Fundamentals","difficulty":"medium","type":"single","stem":"Cloud Kicks wants to understand what 'autonomy' means for an Agentforce agent before rolling it out. Which statement best captures how an autonomous agent operates?","options":[{"id":"A","text":"It independently plans the steps and actions needed to reach a goal, within its configured guardrails."},{"id":"B","text":"It performs only the one action a user explicitly names in each message, then waits for the next command."},{"id":"C","text":"It elevates its own profile and permission sets at runtime whenever a request needs broader access."},{"id":"D","text":"It always pauses and escalates to a human supervisor before taking any action for the customer."}],"correct":["A"],"explanation":"Correct: A — autonomy means the agent plans and selects the steps needed to reach a goal, bounded by configured guardrails and permissions. Why not the others: B describes a scripted single command, not autonomy; C is wrong because agents never elevate their own permissions (security is fixed by the admin); D defeats the purpose, since escalation is reserved for defined conditions.","reference":"Salesforce Help — How Agentforce Works"},{"id":"AIA-003","domain":"ai-agents","topic":"Atlas Reasoning Engine","difficulty":"medium","type":"multi","stem":"An Agentforce Specialist is explaining how the Atlas Reasoning Engine processes a customer request. Which three behaviors accurately describe the reasoning loop? (Select 3)","options":[{"id":"A","text":"It sends the raw prompt straight to the LLM once and returns that first response with no planning."},{"id":"B","text":"It requires the specialist to hard-code every possible conversation branch and reply in advance."},{"id":"C","text":"It runs a reason-act-observe loop: interpret the request, plan, execute actions, and evaluate results."},{"id":"D","text":"It can dynamically re-plan when an action fails or new information appears, instead of stopping."},{"id":"E","text":"It supports hybrid reasoning, blending LLM inference with deterministic logic the specialist defines."}],"correct":["C","D","E"],"explanation":"Correct: C, D, E — the ReAct-style loop, dynamic re-planning, and hybrid reasoning are core Atlas behaviors. Why not the others: A describes a single-shot LLM call, not Atlas's multi-step 'System 2' planning; B is wrong because agents generalize through reasoning rather than requiring every branch to be scripted.","reference":"Salesforce Help — Atlas Reasoning Engine"},{"id":"AIA-004","domain":"ai-agents","topic":"Atlas Reasoning Engine","difficulty":"medium","type":"single","stem":"During an Ursa Major Solar conversation, the first action the agent tries returns an error because a record is missing. In a well-configured agent, what does the Atlas Reasoning Engine do next?","options":[{"id":"A","text":"It immediately ends the session with a generic error message and makes no further attempts to help."},{"id":"B","text":"It retries the identical failing action over and over in a loop until the record eventually appears."},{"id":"C","text":"It escalates straight to a human queue without attempting any alternative, ignoring its configuration."},{"id":"D","text":"It reflects on the failure and re-plans, trying another action or asking the customer for details."}],"correct":["D"],"explanation":"Correct: D — reflection plus dynamic re-planning let Atlas recover by choosing another path or gathering more input. Why not the others: A is wrong because the agent does not simply give up; B is wrong because blindly repeating is not reasoning and risks a loop; C is wrong because escalation is triggered by defined conditions, not as the automatic first response to any error.","reference":"Salesforce Help — Atlas Reasoning Engine"},{"id":"AIA-005","domain":"ai-agents","topic":"Atlas Reasoning Engine","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters wants strictly predictable behavior for a compliance-sensitive step but flexible, natural conversation everywhere else. Which capability of the 2026 Atlas Reasoning Engine best addresses this?","options":[{"id":"A","text":"Turn off the LLM entirely and script every response so the whole agent is fully deterministic."},{"id":"B","text":"Hybrid reasoning: run the compliance step as deterministic logic while the LLM handles conversation."},{"id":"C","text":"Raise the model temperature on the compliance step so the LLM phrases each answer more creatively."},{"id":"D","text":"Rely solely on natural-language instructions and trust the LLM to follow the compliance rule every time."}],"correct":["B"],"explanation":"Correct: B — hybrid reasoning separates deterministic execution (code/logic) from probabilistic LLM reasoning, so the compliance step is guaranteed while conversation stays flexible. Why not the others: A needlessly loses conversational ability; C adds creativity where a compliance step needs certainty; D is wrong because natural-language guidelines only suggest and cannot guarantee the step.","reference":"Salesforce Developers — Introducing Hybrid Reasoning with Agent Script"},{"id":"AIA-006","domain":"ai-agents","topic":"Agent Use Cases","difficulty":"medium","type":"single","stem":"A service team handles 5,000 cases a month; about 60% are routine order-status, returns, and account-update questions. The director wants an Agentforce agent to take the routine load. How should the specialist prioritize the use cases?","options":[{"id":"A","text":"Deploy the agent to all 5,000 cases on the first day to maximize case deflection immediately."},{"id":"B","text":"Begin with the most complex, lowest-volume cases first to prove the agent can handle anything."},{"id":"C","text":"Wait until the agent can fully handle 100% of all case types before deploying anything to production."},{"id":"D","text":"Start with high-volume, low-complexity cases, ground them in existing data, and escalate the rest."}],"correct":["D"],"explanation":"Correct: D — target high-volume, low-complexity work first, ground it in available data, and escalate the rest to humans. Why not the others: A deploys to everything at once, which is high-risk and ignores complexity; B tackles complex, low-volume work first for poor ROI and higher failure risk; C delays all value with a '100% or nothing' stance.","reference":"Trailhead — Agentforce Use Case Discovery"},{"id":"AIA-007","domain":"ai-agents","topic":"Agent Use Cases","difficulty":"medium","type":"single","stem":"Pizza Time has a task that is a single, fixed, deterministic record update triggered by a button, with no conversation or judgment involved. Should the specialist build an Agentforce agent for it?","options":[{"id":"A","text":"Yes — every button-triggered automation like this should now be rebuilt as an Agentforce agent."},{"id":"B","text":"Yes — in 2026 any record update triggered from a button must be performed by an Agentforce agent."},{"id":"C","text":"No — a single deterministic step is better handled by Flow; an agent adds needless cost."},{"id":"D","text":"No — but only because Flow can no longer perform record updates and must delegate them to an agent."}],"correct":["C"],"explanation":"Correct: C — agents shine for open-ended, multi-step, judgment-based conversational work, so a single deterministic step is a Flow job. Why not the others: A over-applies agents to everything; B is false, since agents are not required for DML; D is false, since Flow still performs record updates.","reference":"Salesforce Help — When to Use Agentforce"},{"id":"AIA-008","domain":"ai-agents","topic":"Agent Types","difficulty":"medium","type":"single","stem":"Universal Containers wants a customer-facing agent on its public help site to answer questions and resolve cases 24/7 without a human. Which agent type fits best?","options":[{"id":"A","text":"Agentforce Service Agent, purpose-built for autonomous customer service and case resolution."},{"id":"B","text":"Sales Coach Agent, which role-plays with reps and coaches them through live customer calls."},{"id":"C","text":"SDR Agent, which autonomously qualifies inbound sales leads and books meetings for reps."},{"id":"D","text":"A Sales Cloud opportunity automation that updates pipeline stages on a nightly batch schedule."}],"correct":["A"],"explanation":"Correct: A — the Agentforce Service Agent is purpose-built for autonomous customer service and case deflection across channels. Why not the others: B (Sales Coach) trains reps internally; C (SDR) engages sales leads, not service cases; D is not an agent and does not hold customer conversations.","reference":"Salesforce Help — Agentforce Service Agent"},{"id":"AIA-009","domain":"ai-agents","topic":"Agent Types","difficulty":"medium","type":"multi","stem":"Cloud Kicks is mapping business needs to the right Agentforce agent. Which two pairings are appropriate? (Select 2)","options":[{"id":"A","text":"Deflect inbound customer service cases on the public website — SDR Agent."},{"id":"B","text":"Qualify and nurture inbound sales leads around the clock — Sales Coach Agent."},{"id":"C","text":"Practice negotiation and objection role-plays with reps — Service Agent."},{"id":"D","text":"Autonomously engage and qualify inbound leads and book meetings — SDR Agent."},{"id":"E","text":"Give sales reps realistic role-play practice and feedback — Sales Coach Agent."}],"correct":["D","E"],"explanation":"Correct: D, E — the SDR Agent qualifies/nurtures inbound leads and books meetings, while the Sales Coach gives reps role-play practice and feedback. Why not the others: A is wrong because service deflection is the Service Agent's job; B is wrong because lead qualification belongs to the SDR Agent, not the Sales Coach; C is wrong because role-play is Sales Coach, not the Service Agent.","reference":"Salesforce Help — Agentforce Sales Agents"},{"id":"AIA-010","domain":"ai-agents","topic":"Agent Types","difficulty":"medium","type":"single","stem":"Northern Trail Outfitters generates more inbound leads than reps can follow up on. Leadership wants autonomous 24/7 engagement that answers product questions and books meetings. Which agent should the specialist recommend?","options":[{"id":"A","text":"Sales Coach Agent, which gives reps practice pitches and feedback rather than engaging leads."},{"id":"B","text":"SDR Agent (Sales Development Representative), for autonomous inbound lead engagement."},{"id":"C","text":"Agentforce Service Agent, which deflects inbound support cases rather than qualifying sales leads."},{"id":"D","text":"Employee (internal) Agent, which answers staff HR and IT questions inside Slack."}],"correct":["B"],"explanation":"Correct: B — the SDR Agent autonomously engages inbound leads, answers product questions, nurtures, and books meetings. Why not the others: A coaches reps rather than engaging leads; C handles service, not sales lead engagement; D supports internal employee productivity, not lead follow-up.","reference":"Salesforce Help — Agentforce SDR Agent"},{"id":"AIA-011","domain":"ai-agents","topic":"Agent Types","difficulty":"medium","type":"single","stem":"A sales manager at Ursa Major Solar wants new reps to rehearse pitches and objection handling and receive feedback, without risking real prospects. Which agent fits?","options":[{"id":"A","text":"SDR Agent, which engages real inbound prospects rather than running practice sessions."},{"id":"B","text":"Agentforce Service Agent, which resolves customer support cases, not rep training."},{"id":"C","text":"Commerce merchant agent, which manages storefront and product catalog tasks."},{"id":"D","text":"Sales Coach Agent, for safe role-play practice and objection-handling feedback."}],"correct":["D"],"explanation":"Correct: D — the Sales Coach Agent provides autonomous role-play and feedback for reps. Why not the others: A engages real leads rather than practice scenarios; B is for customer service; C handles commerce/storefront tasks.","reference":"Salesforce Help — Agentforce Sales Coach"},{"id":"AIA-012","domain":"ai-agents","topic":"Agent Types","difficulty":"medium","type":"single","stem":"A company wants employees to ask HR and IT questions and take internal actions directly from Slack. Which approach is correct?","options":[{"id":"A","text":"Deploy an Agentforce Service Agent on the public guest website for external customers."},{"id":"B","text":"Use an SDR Agent, since its lead-qualification skills also cover employee HR questions."},{"id":"C","text":"Deploy an internal employee agent (Agentforce for employees) surfaced in Slack."},{"id":"D","text":"Build a Sales Coach Agent and repurpose its coaching flows to resolve internal IT tickets."}],"correct":["C"],"explanation":"Correct: C — employee/internal agents serve authenticated employees and run in Slack and other internal channels. Why not the others: A is a public, customer-facing deployment; B is for sales leads, not internal HR; D is for rep training, not IT support.","reference":"Salesforce Help — Agentforce in Slack"},{"id":"AIA-013","domain":"ai-agents","topic":"Agent Types","difficulty":"hard","type":"single","stem":"Universal Containers will deploy a Service Agent that must retrieve a customer's private order history. Some visitors are logged in and some are anonymous. What is the correct design?","options":[{"id":"A","text":"Require verification before any action that exposes personal data; give guests public actions only."},{"id":"B","text":"Allow every visitor, verified or not, to retrieve any customer's full order history on request."},{"id":"C","text":"Disable the agent for logged-in users and serve only anonymous guests with their order history."},{"id":"D","text":"Store each visitor's order data on the shared guest user record so any visitor can read it."}],"correct":["A"],"explanation":"Correct: A — private actions that expose personal or account data require verification, while public actions are safe for guests. Why not the others: B exposes personal data to anyone, a security breach; C is backwards, since authenticated users are exactly who should get personalized data; D dumps personal data into a shared guest context, a serious data-exposure risk.","reference":"Salesforce Developers — Secure Service Agents with Customer Verification"},{"id":"AIA-014","domain":"ai-agents","topic":"Agent Builder","difficulty":"medium","type":"single","stem":"While configuring an agent in Agent Builder, the specialist completes the agent's role, the company name, and a description. What is the primary purpose of these fields?","options":[{"id":"A","text":"They are cosmetic labels shown only in Setup and have no effect on how the agent responds."},{"id":"B","text":"They replace the need to build any subagents or actions for the agent to do its work."},{"id":"C","text":"They automatically grant the agent full System Administrator permissions to complete requests."},{"id":"D","text":"They give the agent business context that grounds its tone, scope, and behavior."}],"correct":["D"],"explanation":"Correct: D — role, company, and description give the reasoning engine context that shapes tone and behavior. Why not the others: A is wrong because these fields materially influence responses; B is wrong because you still need subagents and actions to do work; C is wrong because these are context, not permissions, and security is configured separately.","reference":"Salesforce Help — Configure Agent Details in Agent Builder"},{"id":"AIA-015","domain":"ai-agents","topic":"Agent Builder","difficulty":"medium","type":"multi","stem":"Which two elements configured in Agent Builder directly influence how an agent decides what to do and how it responds? (Select 2)","options":[{"id":"A","text":"The Salesforce org's default currency and locale format settings."},{"id":"B","text":"The color, font, and background branding of the messaging window."},{"id":"C","text":"The subagent (topic) classification descriptions used for routing."},{"id":"D","text":"The total number of report and dashboard folders configured in the org."},{"id":"E","text":"The natural-language instructions defined within each subagent."}],"correct":["C","E"],"explanation":"Correct: C, E — classification descriptions drive routing and instructions govern in-topic behavior. Why not the others: A and D are unrelated org settings that do not affect agent decisioning; B changes visual appearance, not reasoning.","reference":"Salesforce Help — Agentforce Agent Builder"},{"id":"AIA-016","domain":"ai-agents","topic":"Agent Builder","difficulty":"easy","type":"single","stem":"What is Agent Builder in Agentforce?","options":[{"id":"A","text":"A code-generation tool that automatically writes Apex triggers and classes for the agent."},{"id":"B","text":"The low-code workspace for configuring an agent's subagents, actions, and instructions."},{"id":"C","text":"The billing console for tracking Agentforce usage and per-conversation costs."},{"id":"D","text":"A Data 360 pipeline that ingests and unifies external source data for grounding."}],"correct":["B"],"explanation":"Correct: B — Agent Builder is where you assemble, configure, and test agents. Why not the others: A is wrong because it is not an Apex generator; C is wrong because it is not a billing tool; D is wrong because data ingestion belongs to Data 360, a separate area.","reference":"Salesforce Help — Agentforce Agent Builder"},{"id":"AIA-017","domain":"ai-agents","topic":"Agent Builder","difficulty":"medium","type":"single","stem":"While building an agent, the specialist wants to see which subagent the reasoning engine selected and why, in order to debug misrouting. Where in Agent Builder can they check this?","options":[{"id":"A","text":"The org's login history, which records which subagent handled each authenticated session."},{"id":"B","text":"The Apex debug logs only, since the Builder itself surfaces nothing about routing decisions."},{"id":"C","text":"The conversation preview's reasoning details, which show the selected subagent and why."},{"id":"D","text":"The Setup audit trail, which logs each routing decision the reasoning engine makes."}],"correct":["C"],"explanation":"Correct: C — the preview panel exposes reasoning/interaction details, including which subagent was chosen. Why not the others: A tracks authentication, not reasoning; B is wrong because Builder does surface reasoning, so Apex logs are not required for routing; D tracks configuration changes, not runtime reasoning.","reference":"Salesforce Help — Preview and Test Agents in Agent Builder"},{"id":"AIA-018","domain":"ai-agents","topic":"Agent Builder","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters wants maximum deterministic control over action ordering and conversation state in a complex agent. Which building approach in 2026 best supports this?","options":[{"id":"A","text":"Build in the new Agentforce Builder and use Agent Script for deterministic logic."},{"id":"B","text":"Use only natural-language instructions and avoid any deterministic logic or variables."},{"id":"C","text":"Put all ordering logic into the LLM prompt text and remove the agent's state variables."},{"id":"D","text":"Skip Agent Builder entirely and hand-code the whole agent as a scheduled Apex batch job."}],"correct":["A"],"explanation":"Correct: A — the new Agentforce Builder with Agent Script provides hybrid, deterministic control over action ordering and state. Why not the others: B relies on suggestions that are not deterministic; C reduces reliability by stuffing logic into the prompt; D produces an Apex batch job, not a conversational agent.","reference":"Salesforce Developers — Agentforce Builder and Agent Script"},{"id":"AIA-019","domain":"ai-agents","topic":"Topics & Subagents","difficulty":"easy","type":"single","stem":"In 2026 Agentforce, what is a subagent (formerly called a topic)?","options":[{"id":"A","text":"A single Apex class that runs on a nightly schedule to update related records."},{"id":"B","text":"A job-to-be-done grouping that bundles related actions and instructions with a scope."},{"id":"C","text":"A permission set assigned to the Agent User to grant it object access."},{"id":"D","text":"A messaging channel configuration that connects the agent to a website widget."}],"correct":["B"],"explanation":"Correct: B — a subagent (renamed from topic in 2026) is a job-to-be-done defined by a classification description, scope, instructions, and actions. Why not the others: A is backend automation; C is a security construct; D is a channel configuration.","reference":"Salesforce Help — Agent Topics and Subagents"},{"id":"AIA-020","domain":"ai-agents","topic":"Topics & Subagents","difficulty":"medium","type":"single","stem":"The reasoning engine keeps sending order questions to the wrong subagent. What primarily drives which subagent the engine selects?","options":[{"id":"A","text":"The order in which the subagents were created, since earlier ones are checked first."},{"id":"B","text":"The number of actions inside each subagent, since more actions win priority."},{"id":"C","text":"The agent's messaging window color and branding theme configuration."},{"id":"D","text":"The subagent's name and classification description, matched to the user's intent."}],"correct":["D"],"explanation":"Correct: D — Atlas classifies the user's message using the subagent name and classification description. Why not the others: A is wrong because creation order does not decide routing; B is wrong because the action count is not a routing signal; C is wrong because visual theme is irrelevant to classification.","reference":"Salesforce Help — How Agentforce Classifies Topics"},{"id":"AIA-021","domain":"ai-agents","topic":"Topics & Subagents","difficulty":"medium","type":"multi","stem":"An agent has two subagents that the reasoning engine keeps confusing. Which two practices improve classification accuracy? (Select 2)","options":[{"id":"A","text":"Give both subagents nearly identical descriptions so either one can handle any request."},{"id":"B","text":"Write specific classification descriptions stating what each subagent handles and excludes."},{"id":"C","text":"Remove all classification descriptions and rely only on the action names inside each subagent."},{"id":"D","text":"Ensure the subagent scopes do not overlap so each request maps cleanly to one subagent."},{"id":"E","text":"Merge every capability into one large catch-all subagent that handles all requests."}],"correct":["B","D"],"explanation":"Correct: B, D — precise, non-overlapping descriptions (including exclusions) let the classifier choose correctly. Why not the others: A creates the exact confusion described; C is wrong because the engine relies on name and description, not just action names; E makes a single subagent hard to route, test, and maintain.","reference":"Salesforce Help — Write Effective Topic Classification Descriptions"},{"id":"AIA-022","domain":"ai-agents","topic":"Topics & Subagents","difficulty":"medium","type":"single","stem":"Pizza Time has a 'Track Order' subagent and a 'Cancel Order' subagent, but cancellation requests sometimes get routed to tracking. What is the best fix?","options":[{"id":"A","text":"Delete the Cancel Order subagent and let the Track Order subagent handle cancellations too."},{"id":"B","text":"Lower the Agent User's permission set so it cannot open the wrong subagent."},{"id":"C","text":"Refine each subagent's classification to separate tracking from cancellation intents."},{"id":"D","text":"Add several more lookup and status-update actions to the Track Order subagent."}],"correct":["C"],"explanation":"Correct: C — sharpening the classification descriptions (with exclusions) resolves the overlap that causes misrouting. Why not the others: A merges two distinct jobs and harms clarity and control; B is wrong because permissions do not affect routing; D is wrong because adding actions does not fix intent classification.","reference":"Salesforce Help — Resolve Topic Overlap"},{"id":"AIA-023","domain":"ai-agents","topic":"Topics & Subagents","difficulty":"medium","type":"single","stem":"A company deploys the Agentforce Service Agent and sees prebuilt subagents plus the ability to add its own. What is the difference between standard and custom subagents (topics)?","options":[{"id":"A","text":"Standard subagents cannot contain any actions, while only custom subagents can hold them."},{"id":"B","text":"Standard subagents ship prebuilt for common jobs; custom ones are created for org needs."},{"id":"C","text":"Custom subagents are always read-only, while standard subagents are the editable ones."},{"id":"D","text":"There is no real difference; the two terms are fully interchangeable in Agentforce."}],"correct":["B"],"explanation":"Correct: B — standard subagents are prebuilt out of the box, while custom subagents are admin-created for specific needs. Why not the others: A is wrong because both can contain actions; C is wrong because custom subagents are the ones you fully control and edit; D is wrong because they are distinct concepts.","reference":"Salesforce Help — Standard and Custom Topics"},{"id":"AIA-024","domain":"ai-agents","topic":"Topics & Subagents","difficulty":"hard","type":"single","stem":"An agent's single subagent tries to handle shipping, returns, billing, and identity verification, and reliability is poor. What is the recommended redesign?","options":[{"id":"A","text":"Split the work into focused single-domain subagents, each with a clear scope."},{"id":"B","text":"Keep the single subagent but add many more example phrases to its instructions."},{"id":"C","text":"Increase the LLM temperature so a single subagent can handle more variety."},{"id":"D","text":"Move all four domains' logic into one long 2,000-word instruction block."}],"correct":["A"],"explanation":"Correct: A — small, focused subagents are easier to route, test, and maintain, improving reliability. Why not the others: B is wrong because examples alone will not fix an overloaded scope; C increases unpredictability; D creates an unwieldy instruction block that is hard to follow and debug.","reference":"Salesforce Help — Design Focused Topics"},{"id":"AIA-025","domain":"ai-agents","topic":"Agent Actions","difficulty":"medium","type":"single","stem":"Universal Containers needs the agent to look up an order by number and update its shipping address with validation and several related-record steps, deterministically. Which action type is the best fit?","options":[{"id":"A","text":"A prompt template action that generates the update text for the LLM to apply."},{"id":"B","text":"No action at all — describe the update steps in the subagent instructions instead."},{"id":"C","text":"A free-text LLM response that states the new shipping address back to the user."},{"id":"D","text":"A Flow-based action that performs the validated, multi-step record updates."}],"correct":["D"],"explanation":"Correct: D — Flow provides deterministic, structured, multi-step data operations with validation. Why not the others: A is wrong because prompt templates generate text and do not reliably perform validated DML; B and C are wrong because instructions and free text cannot reliably execute structured record updates.","reference":"Salesforce Help — Add Flow Actions to Agents"},{"id":"AIA-026","domain":"ai-agents","topic":"Agent Actions","difficulty":"medium","type":"single","stem":"Cloud Kicks wants the agent to generate a personalized, empathetic email that summarizes a resolved case and is grounded in the case record. Which action type should the specialist use?","options":[{"id":"A","text":"A Flow that concatenates case fields into one fixed, non-personalized string."},{"id":"B","text":"An Apex trigger that fires on case closure to send a templated email."},{"id":"C","text":"A prompt template action that generates grounded, personalized email text."},{"id":"D","text":"A validation rule that blocks the case from closing until an email is sent."}],"correct":["C"],"explanation":"Correct: C — generative, grounded text is exactly what prompt template actions produce. Why not the others: A produces a fixed concatenated string, not personalized generative text; B is backend automation, not conversational generation; D enforces data integrity and does not generate content.","reference":"Salesforce Help — Prompt Template Actions"},{"id":"AIA-027","domain":"ai-agents","topic":"Agent Actions","difficulty":"medium","type":"single","stem":"Northern Trail Outfitters needs an action that runs complex custom logic and a callout to an internal pricing service that cannot be modeled in Flow. Which action type fits?","options":[{"id":"A","text":"An Apex invocable action for the custom logic and pricing-service callout."},{"id":"B","text":"A prompt template action that asks the LLM to estimate the price from context."},{"id":"C","text":"A standard 'Draft Email' action that formats the pricing result for the customer."},{"id":"D","text":"A report that lists current prices from the internal pricing service each hour."}],"correct":["A"],"explanation":"Correct: A — Apex invocable actions handle complex logic and callouts beyond Flow's scope. Why not the others: B generates text, not custom compute or callouts; C drafts email and is unrelated to pricing logic; D is a report, not an executable action.","reference":"Salesforce Help — Apex Actions for Agentforce"},{"id":"AIA-028","domain":"ai-agents","topic":"Agent Actions","difficulty":"medium","type":"multi","stem":"An Agentforce Specialist is choosing action types for different needs. Which three pairings are correct? (Select 3)","options":[{"id":"A","text":"Deterministic, validated multi-step record updates — Flow action."},{"id":"B","text":"Generate free-form marketing campaign copy — a data validation rule."},{"id":"C","text":"Generate a grounded, personalized customer message — prompt template action."},{"id":"D","text":"Perform a structured record lookup by record ID — a report subscription."},{"id":"E","text":"Call an external system via its OpenAPI specification — API/external action."}],"correct":["A","C","E"],"explanation":"Correct: A, C, E — Flow for deterministic DML, prompt templates for grounded generation, and API/external actions for outside systems. Why not the others: B is wrong because validation rules do not generate copy; D is wrong because a report subscription is not an agent action for record lookups.","reference":"Salesforce Help — Agentforce Action Types"},{"id":"AIA-029","domain":"ai-agents","topic":"Agent Actions","difficulty":"hard","type":"single","stem":"Ursa Major Solar wants the agent to retrieve inventory from an external ERP that is exposed via REST with an OpenAPI specification, without building custom Apex. What is the best approach?","options":[{"id":"A","text":"Copy the ERP inventory data manually into a spreadsheet the agent reads each morning."},{"id":"B","text":"Register an API/external action from the ERP's OpenAPI specification to call it."},{"id":"C","text":"Put the ERP password in the agent's instructions so the LLM can log in and query stock."},{"id":"D","text":"Ask the LLM to estimate the current inventory levels from recent order history."}],"correct":["B"],"explanation":"Correct: B — external/API actions built from an OpenAPI specification let the agent call external systems declaratively. Why not the others: A is not real-time or scalable; C is a serious security violation, since credentials must never be placed in instructions; D is wrong because the LLM must not fabricate live inventory data.","reference":"Salesforce Help — External Services and API Actions"},{"id":"AIA-030","domain":"ai-agents","topic":"Agent Actions","difficulty":"medium","type":"single","stem":"A specialist is unsure when to use an instruction versus an action. Which statement is correct?","options":[{"id":"A","text":"Instructions and actions are simply two names for the same configuration element."},{"id":"B","text":"Actions only describe the agent's tone, while instructions perform the record DML."},{"id":"C","text":"Instructions guide how and when the agent acts; actions are the operations executed."},{"id":"D","text":"Instructions perform the API callouts, while actions merely set the conversational tone."}],"correct":["C"],"explanation":"Correct: C — instructions steer behavior and selection, while actions do the work. Why not the others: A is wrong because they are distinct; B and D reverse the roles, since actions perform operations, DML, and callouts, whereas instructions guide behavior and tone.","reference":"Salesforce Help — Instructions vs Actions in Agentforce"},{"id":"AIA-031","domain":"ai-agents","topic":"Agent Actions","difficulty":"medium","type":"single","stem":"Which of the following is an example of a standard (prebuilt) action available to an Agentforce Service Agent?","options":[{"id":"A","text":"A bespoke Apex invocable class written by the org's developers."},{"id":"B","text":"A custom screen Flow the org's admin built last week for cases."},{"id":"C","text":"A third-party ERP inventory callout the org defined via OpenAPI."},{"id":"D","text":"Answer customer questions using published Knowledge articles."}],"correct":["D"],"explanation":"Correct: D — answering with Knowledge is a prebuilt/standard action. Why not the others: A and B are custom actions (custom Apex and custom Flow), not standard; C is a custom-configured external API action, not a prebuilt standard action.","reference":"Salesforce Help — Standard Agent Actions"},{"id":"AIA-032","domain":"ai-agents","topic":"Agent Script","difficulty":"easy","type":"single","stem":"In the Agentforce Builder, what is the difference between Canvas View and Script View for Agent Script?","options":[{"id":"A","text":"Canvas View is for tracking billing, while Script View is for building usage reports."},{"id":"B","text":"Canvas View shows the agent as visual blocks; Script View exposes the raw code."},{"id":"C","text":"They are two unrelated products that cannot edit the same agent definition."},{"id":"D","text":"Canvas View deletes the script and Script View restores it from the last backup."}],"correct":["B"],"explanation":"Correct: B — Canvas is the visual/block representation, while Script View is the raw code for full control. Why not the others: A and C are wrong because both are views of the same agent definition, not billing/reporting tools or separate products; D is wrong because switching views does not delete anything.","reference":"Salesforce Developers — Agent Script Canvas and Script Views"},{"id":"AIA-033","domain":"ai-agents","topic":"Agent Script","difficulty":"medium","type":"single","stem":"A support agent inconsistently runs a mandatory fraud check before processing refunds — sometimes it fires, sometimes it skips straight to the refund. The specialist adds a procedural instruction: run @actions.fraud_check then run @actions.process_refund. What is the effect?","options":[{"id":"A","text":"The fraud check runs before the refund every time, since procedural steps are deterministic."},{"id":"B","text":"The fraud check is only suggested more strongly, so the LLM may still skip it sometimes."},{"id":"C","text":"The refund now runs first and the fraud check second, and the agent loses its empathetic tone."},{"id":"D","text":"Both actions are disabled until a human manually approves each individual conversation."}],"correct":["A"],"explanation":"Correct: A — procedural (logic) instructions deterministically enforce action order on every conversation. Why not the others: B describes a natural-language guideline, which only suggests; C misstates the order (the fraud check comes first) and tone is unaffected; D is wrong because procedural ordering does not require per-conversation human approval.","reference":"Salesforce Developers — Agent Script Procedural Instructions"},{"id":"AIA-034","domain":"ai-agents","topic":"Agent Script","difficulty":"medium","type":"multi","stem":"Why might a specialist choose Agent Script's logic instructions over relying solely on natural-language guidelines? (Select 2)","options":[{"id":"A","text":"Logic instructions run deterministically every time, enforcing rules and action order."},{"id":"B","text":"Logic instructions make the LLM more creative and far less predictable in its answers."},{"id":"C","text":"They remove the need to configure any permissions or object-level security at all."},{"id":"D","text":"Variables store state reliably instead of relying on the LLM's conversational memory."},{"id":"E","text":"They let the agent bypass Salesforce sharing rules to read any user's record."}],"correct":["A","D"],"explanation":"Correct: A, D — deterministic execution and reliable variable-based state are the core benefits. Why not the others: B is wrong because logic reduces variability rather than increasing it; C and E are wrong because Agent Script never removes permissions or bypasses Salesforce security.","reference":"Salesforce Developers — Deterministic Control with Agent Script"},{"id":"AIA-035","domain":"ai-agents","topic":"Agent Script","difficulty":"hard","type":"single","stem":"Northern Trail Outfitters wants a refund action to be selectable by the reasoning engine only after the customer is verified. Which Agent Script technique enforces this?","options":[{"id":"A","text":"Write a natural-language note politely asking the LLM to verify the customer first."},{"id":"B","text":"Delete the refund action after every use and recreate it only once the customer is verified."},{"id":"C","text":"Add a guard such as 'available when: @variables.is_verified == true' to gate the action."},{"id":"D","text":"Set the model temperature to 0 so the LLM reliably remembers to verify first."}],"correct":["C"],"explanation":"Correct: C — an availability guard tied to a variable deterministically gates when the action can be selected. Why not the others: A is only a suggestion that can be ignored; B is not runtime gating and is unworkable; D affects wording randomness, not whether an action is allowed.","reference":"Salesforce Developers — Conditional Action Availability in Agent Script"},{"id":"AIA-036","domain":"ai-agents","topic":"Agent Script","difficulty":"medium","type":"single","stem":"Why would a specialist use Agent Script variables to track whether a customer is verified, rather than relying on the LLM to remember?","options":[{"id":"A","text":"Variables automatically extend the LLM's context window and conversational memory span."},{"id":"B","text":"Variables are only decorative labels in the script and have no effect at runtime."},{"id":"C","text":"Variables temporarily disable the reasoning engine while the customer is verified."},{"id":"D","text":"Variables persist state across turns, so the agent never forgets verification status."}],"correct":["D"],"explanation":"Correct: D — variables provide reliable, explicit state instead of trusting LLM context memory. Why not the others: A is wrong because variables replace reliance on LLM memory rather than extending it; B is wrong because variables materially drive logic; C is wrong because variables work with, not disable, the engine.","reference":"Salesforce Developers — Agent Script Variables"},{"id":"AIA-037","domain":"ai-agents","topic":"Agent Script","difficulty":"medium","type":"single","stem":"An agent needs to capture the order number a customer mentions in conversation and store it for use by later actions. Which Agent Script utility fits?","options":[{"id":"A","text":"A validation rule on the Order object that captures the number when saved."},{"id":"B","text":"@utils.setVariables, which lets the LLM pull the value from chat into a variable."},{"id":"C","text":"@utils.escalate, which hands the conversation to a human agent who records the number."},{"id":"D","text":"A report filter that stores the order number the customer mentioned in chat."}],"correct":["B"],"explanation":"Correct: B — @utils.setVariables lets the LLM populate a variable from conversational context. Why not the others: A runs on records, not conversational capture; C escalates to a human rather than capturing data; D is unrelated to capturing conversation values.","reference":"Salesforce Developers — @utils.setVariables"},{"id":"AIA-038","domain":"ai-agents","topic":"Agent Script","difficulty":"hard","type":"single","stem":"In Agent Script, what distinguishes a logic instruction from a prompt instruction?","options":[{"id":"A","text":"Logic and prompt instructions are both sent to the LLM identically for interpretation."},{"id":"B","text":"Prompt instructions run deterministically, while logic instructions are only suggestions."},{"id":"C","text":"Logic instructions run as deterministic code; prompt instructions are natural language."},{"id":"D","text":"Logic instructions can only set the messaging window color and branding theme."}],"correct":["C"],"explanation":"Correct: C — logic instructions are deterministic execution, while prompt instructions are natural language for the LLM. Why not the others: A is wrong because only prompt instructions reach the LLM; B reverses the roles; D is wrong because logic controls rules, actions, and state, not UI theming.","reference":"Salesforce Developers — Reasoning Instructions in Agent Script"},{"id":"AIA-039","domain":"ai-agents","topic":"Agent Script","difficulty":"medium","type":"single","stem":"A specialist wants an account-lookup action to always run and load context before the LLM begins reasoning in a subagent. Which approach in Agent Script achieves this deterministically?","options":[{"id":"A","text":"Use a logic instruction that runs @actions.get_account_info before the prompt instructions."},{"id":"B","text":"Mention the account in a natural-language sentence and trust the LLM to call the action."},{"id":"C","text":"Rely on the customer to paste their full account details at the start of the chat."},{"id":"D","text":"Randomize whether the lookup action runs on each turn to add conversational variety."}],"correct":["A"],"explanation":"Correct: A — placing the action in a logic instruction guarantees it runs before reasoning, giving deterministic data-fetch and action chaining. Why not the others: B is a suggestion that may be skipped; C offloads the work to the customer and is not reliable context loading; D defeats determinism.","reference":"Salesforce Developers — Action Chaining in Agent Script"},{"id":"AIA-040","domain":"ai-agents","topic":"Agent Instructions","difficulty":"medium","type":"single","stem":"A vague instruction says 'Help the customer,' and the agent behaves inconsistently. What is the best improvement?","options":[{"id":"A","text":"Add more emojis and exclamation marks to the current vague 'Help the customer' line."},{"id":"B","text":"Make the instruction even shorter and vaguer so the LLM has far more freedom to improvise."},{"id":"C","text":"Remove all instructions entirely and let the LLM decide how to help on its own."},{"id":"D","text":"Rewrite the instructions to specify the task, allowed actions, steps, and constraints."}],"correct":["D"],"explanation":"Correct: D — specific, constrained instructions produce consistent behavior. Why not the others: A adds no clarity; B and C increase inconsistency and give the LLM too much freedom.","reference":"Salesforce Help — Write Effective Agent Instructions"},{"id":"AIA-041","domain":"ai-agents","topic":"Agent Instructions","difficulty":"medium","type":"single","stem":"Universal Containers wants to ensure the agent never issues a refund above a set threshold without manager approval. Where should this guardrail primarily live for reliability?","options":[{"id":"A","text":"Only as a hopeful reminder sentence added to the agent's opening greeting message."},{"id":"B","text":"As explicit guardrail instructions plus a deterministic guard on the refund action."},{"id":"C","text":"In the messaging window color and theme settings for the web deployment."},{"id":"D","text":"In the agent's display name, so reviewers can spot the approval limit."}],"correct":["B"],"explanation":"Correct: B — combine explicit guardrail instructions with deterministic checks so the limit is enforced. Why not the others: A is easily ignored by the LLM; C and D have no bearing on approval limits.","reference":"Salesforce Help — Add Guardrails to Agents"},{"id":"AIA-042","domain":"ai-agents","topic":"Agent Instructions","difficulty":"medium","type":"multi","stem":"Which three are hallmarks of effective agent instructions? (Select 3)","options":[{"id":"A","text":"Leaving the instructions blank to maximize the LLM's freedom to improvise."},{"id":"B","text":"Being specific about the desired steps, actions, and outcomes."},{"id":"C","text":"Embedding user passwords in the text so the agent can log in as anyone."},{"id":"D","text":"Including guardrails that prevent unauthorized or out-of-scope actions."},{"id":"E","text":"Providing clear tone and empathy guidance and, where helpful, examples."}],"correct":["B","D","E"],"explanation":"Correct: B, D, E — specificity, guardrails, and tone/examples make instructions effective. Why not the others: A causes inconsistency; C is a severe security violation, since credentials must never be embedded.","reference":"Salesforce Help — Instruction Best Practices"},{"id":"AIA-043","domain":"ai-agents","topic":"Agent Instructions","difficulty":"medium","type":"single","stem":"A customer-facing Service Agent sounds abrupt, and the specialist wants warmer, more empathetic replies while staying accurate. What is the best action?","options":[{"id":"A","text":"Add tone and empathy guidance to the instructions, describing the desired voice."},{"id":"B","text":"Increase the LLM temperature to its maximum so replies sound warmer and less robotic."},{"id":"C","text":"Remove all guardrails so the LLM can freely choose a friendlier wording."},{"id":"D","text":"Switch the deployment from a Service Agent to an SDR Agent for a warmer tone."}],"correct":["A"],"explanation":"Correct: A — instructions are where you shape tone and empathy. Why not the others: B adds randomness rather than reliable empathy; C is unsafe and off-point; D is for sales leads, not service tone.","reference":"Salesforce Help — Set Agent Tone and Persona"},{"id":"AIA-044","domain":"ai-agents","topic":"Channels & Deployment","difficulty":"medium","type":"single","stem":"Cloud Kicks wants the same service agent behavior on its website, mobile app, and WhatsApp, without maintaining three separate bots. What is the best approach?","options":[{"id":"A","text":"Build three fully independent agents, one per channel, each with duplicated logic."},{"id":"B","text":"Build a fresh throwaway agent for every incoming message and then discard it right afterward."},{"id":"C","text":"Configure one agent and deploy it across all three channels from one configuration."},{"id":"D","text":"Support only the website, since Agentforce cannot serve mobile apps or WhatsApp."}],"correct":["C"],"explanation":"Correct: C — a single agent configuration can be surfaced on many channels, keeping behavior consistent. Why not the others: A causes drift and maintenance overhead; B is wrong because agents are persistent configurations, not per-message; D is wrong because Agentforce supports web, mobile, messaging, and more.","reference":"Salesforce Help — Deploy Agents Across Channels"},{"id":"AIA-045","domain":"ai-agents","topic":"Channels & Deployment","difficulty":"medium","type":"multi","stem":"On which channels can an Agentforce agent be deployed? (Select 3)","options":[{"id":"A","text":"Embedded Messaging for Web and In-App deployments."},{"id":"B","text":"A physical fax machine with no digital integration."},{"id":"C","text":"Slack, for internal employee-facing conversations."},{"id":"D","text":"Experience Cloud digital experience sites."},{"id":"E","text":"Punch-card mainframe batch input terminals."}],"correct":["A","C","D"],"explanation":"Correct: A, C, D — web/in-app messaging, Slack, and Experience Cloud are supported channels (as are mobile, email, and voice). Why not the others: B and E are not supported channels.","reference":"Salesforce Help — Agentforce Channels"},{"id":"AIA-046","domain":"ai-agents","topic":"Channels & Deployment","difficulty":"medium","type":"single","stem":"A company wants to add the agent to its public marketing website as a chat widget. Which deployment fits?","options":[{"id":"A","text":"A Slack app exposed publicly to external website visitors."},{"id":"B","text":"An internal-only employee agent placed on the public site."},{"id":"C","text":"Email-to-case routing that opens a chat widget for visitors."},{"id":"D","text":"Embedded Service (Messaging for In-App and Web) deployment."}],"correct":["D"],"explanation":"Correct: D — Messaging for In-App and Web (Embedded Service) puts the agent on a website as a chat widget. Why not the others: A is for team/internal messaging, not a public website widget; B is not for public visitors; C is a different channel and process.","reference":"Salesforce Help — Messaging for In-App and Web"},{"id":"AIA-047","domain":"ai-agents","topic":"Channels & Deployment","difficulty":"hard","type":"single","stem":"Ursa Major Solar wants the agent available by phone (voice) as well as by web chat. What should the specialist keep in mind?","options":[{"id":"A","text":"Voice requires a completely separate agent brain that cannot reuse the chat subagents."},{"id":"B","text":"One agent can serve both voice and chat; just adapt to differences like speech versus text."},{"id":"C","text":"Voice deployment forces the agent to bypass the Einstein Trust Layer for latency."},{"id":"D","text":"Voice channels cannot support any escalation or handoff to a human representative."}],"correct":["B"],"explanation":"Correct: B — one agent configuration spans channels, but you should adapt to constraints such as spoken vs written interaction. Why not the others: A is wrong because subagents are shared across channels; C is wrong because the Trust Layer still applies; D is wrong because escalation is still supported on voice.","reference":"Salesforce Help — Agentforce for Voice"},{"id":"AIA-048","domain":"ai-agents","topic":"Agent Security","difficulty":"medium","type":"single","stem":"When an Agentforce agent executes actions, whose permissions and record access govern what it can do by default?","options":[{"id":"A","text":"The System Administrator's full profile, always, regardless of how the agent is configured."},{"id":"B","text":"No user's, since agents run outside of and ignore Salesforce security entirely."},{"id":"C","text":"The Agent User's — the dedicated user it runs as, per its profile and permission sets."},{"id":"D","text":"The last human who logged into the org that day, whose access the agent inherits."}],"correct":["C"],"explanation":"Correct: C — the agent runs as the Agent User, so its assigned permissions define access (unless user verification changes the running context). Why not the others: A violates least privilege and is not automatic; B is wrong because agents respect Salesforce security; D is wrong because context is not tied to arbitrary human logins.","reference":"Salesforce Help — The Agentforce Agent User"},{"id":"AIA-049","domain":"ai-agents","topic":"Agent Security","difficulty":"hard","type":"single","stem":"A specialist is assigning permissions to the Agent User for a service agent that only needs to read Knowledge and read/update Cases. What is the best practice?","options":[{"id":"A","text":"Grant a least-privilege permission set with only Knowledge read and Case read/update."},{"id":"B","text":"Assign the Agent User the full System Administrator profile for the sake of simplicity."},{"id":"C","text":"Give the Agent User Modify All Data so no action is ever blocked by permissions."},{"id":"D","text":"Assign every permission set in the whole org to the Agent User to avoid any access errors."}],"correct":["A"],"explanation":"Correct: A — least privilege limits the agent to exactly what it needs, reducing risk. Why not the others: B, C, and D (System Administrator, Modify All Data, or every permission set) massively over-permission the agent and violate least-privilege security.","reference":"Salesforce Help — Assign Least-Privilege Permissions to the Agent User"},{"id":"AIA-050","domain":"ai-agents","topic":"Agent Security","difficulty":"medium","type":"multi","stem":"Which two steps help secure an Agentforce agent following least-privilege principles? (Select 2)","options":[{"id":"A","text":"Grant the Agent User Modify All Data so that no action can ever fail."},{"id":"B","text":"Share every record with the guest user so the agent never hits an access block."},{"id":"C","text":"Assign the Agent User only the permission sets its actions actually require."},{"id":"D","text":"Restrict field-level security so the agent sees only the fields it needs."},{"id":"E","text":"Disable the Einstein Trust Layer to remove response filtering delays."}],"correct":["C","D"],"explanation":"Correct: C, D — scoped permission sets and tightened field-level security enforce least privilege. Why not the others: A is the opposite of least privilege; B broadly exposes data through guest sharing; E removes key safeguards by disabling the Trust Layer.","reference":"Salesforce Help — Secure Your Agent"},{"id":"AIA-051","domain":"ai-agents","topic":"Agent Security","difficulty":"hard","type":"single","stem":"Universal Containers deployed a Service Agent to an Experience Cloud site with Credential-Based User Verification enabled. The team notices that record updates show the authenticated community user in 'Last Modified By,' not the Agent User. What should the specialist explain?","options":[{"id":"A","text":"This is a bug, since user verification should never change the Last Modified By audit fields."},{"id":"B","text":"It means the Einstein Trust Layer was disabled when verification was first turned on."},{"id":"C","text":"It means the Agent User silently lost its assigned permission sets during that login."},{"id":"D","text":"Expected: verification runs actions as the verified user, so they appear in audit fields."}],"correct":["D"],"explanation":"Correct: D — with Credential-Based verification the agent acts as the authenticated user, so that user's sharing and field-level security apply and they appear in Last Modified By. Why not the others: A is wrong because this is expected governance behavior, not a bug; B is unrelated to the Trust Layer; C is wrong because permission sets are not removed — the running context simply reflects the verified user.","reference":"Salesforce Developers — Secure Service Agents with Customer Verification"},{"id":"AIA-052","domain":"ai-agents","topic":"Agent Security","difficulty":"hard","type":"multi","stem":"An Agentforce Specialist is comparing User Verification options for a Service Agent on Experience Cloud. Which two statements are accurate? (Select 2)","options":[{"id":"A","text":"Credential-Based verification makes the agent ignore all sharing rules and record-level access."},{"id":"B","text":"Credential-Based verification runs actions in the authenticated user's context, enforcing FLS."},{"id":"C","text":"Verification is unnecessary because guests should be able to read any customer's records."},{"id":"D","text":"Verification simply changes the messaging window's color scheme and overall branding theme."},{"id":"E","text":"Verifying identity matters before the agent runs private actions that expose personal data."}],"correct":["B","E"],"explanation":"Correct: B, E — Credential-Based verification ties actions to the authenticated user (respecting sharing and FLS and audit fields), and verification gates private, sensitive actions. Why not the others: A is wrong because Credential-Based verification enforces, not ignores, sharing; C is a serious data-exposure risk; D confuses security with UI theming.","reference":"Salesforce Help — User Verification for Agentforce"},{"id":"AIA-053","domain":"ai-agents","topic":"Agent Security","difficulty":"medium","type":"single","stem":"A company deploys a Service Agent with guest (unauthenticated) access on its public site. Which is the correct security posture?","options":[{"id":"A","text":"Let guests trigger any action, since the guest user context is completely safe by default."},{"id":"B","text":"Store customer PII on the shared guest user record so that any guest can self-serve quickly."},{"id":"C","text":"Give guests only public actions, and verify identity before any personal-data action."},{"id":"D","text":"Disable every action so the agent cannot do anything at all for guest visitors."}],"correct":["C"],"explanation":"Correct: C — guests should get only public, non-sensitive capabilities, and sensitive actions must require verification. Why not the others: A grants risky broad guest access; B exposes PII by placing it in a shared guest context; D defeats the agent's purpose, since the goal is scoped access, not none.","reference":"Salesforce Developers — Secure Service Agents with Customer Verification"},{"id":"AIA-054","domain":"ai-agents","topic":"Agent Security","difficulty":"medium","type":"single","stem":"In Agentforce customer verification, what distinguishes a public action from a private action?","options":[{"id":"A","text":"Public actions are just faster and private actions slower, but both still need verification."},{"id":"B","text":"Public actions like store hours need no verification; private ones like refunds require it."},{"id":"C","text":"Private actions are open to all guests, while public actions are the ones that require login."},{"id":"D","text":"There is no real difference between public and private actions in Agentforce today."}],"correct":["B"],"explanation":"Correct: B — public actions need no verification, while private actions require verification to protect personal or account data. Why not the others: A misframes the distinction as speed; C reverses the concept, since private actions are the ones that require verification; D is wrong because the distinction is real and important.","reference":"Trailhead — Authentication for Topics and Actions"},{"id":"AIA-055","domain":"ai-agents","topic":"Escalation & Deflection","difficulty":"medium","type":"single","stem":"When a customer's issue exceeds the agent's scope, the specialist wants a smooth handoff to a human with full context. Which design is best?","options":[{"id":"A","text":"Have the agent end the chat and tell the customer to start over by calling the phone line instead."},{"id":"B","text":"Loop the same failing action repeatedly until the frustrated customer leaves the chat."},{"id":"C","text":"Silently drop the conversation once the request exceeds the agent's defined scope."},{"id":"D","text":"Configure escalation that transfers the conversation with context via Omni-Channel routing."}],"correct":["D"],"explanation":"Correct: D — defined escalation transfers the conversation with context to a human through routing. Why not the others: A forces a restart, which is poor CX and loses context; B frustrates customers by looping; C is unacceptable because it abandons the customer.","reference":"Salesforce Help — Escalate Agent Conversations to Humans"},{"id":"AIA-056","domain":"ai-agents","topic":"Escalation & Deflection","difficulty":"medium","type":"multi","stem":"Which two situations are appropriate triggers to escalate from an Agentforce agent to a human? (Select 2)","options":[{"id":"A","text":"The request is outside scope or needs judgment the agent is not authorized to exercise."},{"id":"B","text":"Every routine order-status question, just to stay on the safe side always."},{"id":"C","text":"Whenever the agent could already answer the question directly from a Knowledge article."},{"id":"D","text":"Immediately at the very start of every single customer conversation, by default."},{"id":"E","text":"The customer explicitly asks for a human, or the sentiment clearly signals frustration."}],"correct":["A","E"],"explanation":"Correct: A, E — out-of-scope or unauthorized requests and explicit human requests or negative sentiment warrant escalation. Why not the others: B is wrong because routine, answerable questions are exactly what the agent should deflect; C is wrong because if Knowledge answers it, no human is needed; D defeats deflection by escalating everything.","reference":"Salesforce Help — Design Escalation Rules"},{"id":"AIA-057","domain":"ai-agents","topic":"Escalation & Deflection","difficulty":"medium","type":"single","stem":"Leadership asks the specialist to define 'deflection rate' as a success metric. What does it measure?","options":[{"id":"A","text":"The share of conversations the agent resolves without handing off to a person."},{"id":"B","text":"The percentage of conversations that the agent escalates to a human rep."},{"id":"C","text":"The number of Apex errors the agent logs per day across every conversation."},{"id":"D","text":"The average load time of the messaging window shown before the agent first replies."}],"correct":["A"],"explanation":"Correct: A — deflection rate is the proportion of conversations fully handled by the agent without human involvement. Why not the others: B is the escalation rate, which is the inverse; C is an error metric; D is a performance/UX metric, not deflection.","reference":"Salesforce Help — Agentforce Success Metrics"},{"id":"AIA-058","domain":"ai-agents","topic":"Escalation & Deflection","difficulty":"medium","type":"single","stem":"Pizza Time wants to maximize self-service but avoid trapping frustrated customers. What is the best design principle?","options":[{"id":"A","text":"Never allow any escalation at all, forcing customers into full self-service every time."},{"id":"B","text":"Escalate every single conversation straight to a human right away, just to be safe."},{"id":"C","text":"Resolve in-scope requests first, but escalate promptly if it cannot help the customer."},{"id":"D","text":"Hide the option to reach a human entirely so customers keep trying the agent."}],"correct":["C"],"explanation":"Correct: C — resolve what the agent can and escalate when appropriate, balancing deflection with good customer experience. Why not the others: A and D trap frustrated customers by blocking human access; B eliminates the value of the agent by escalating everything.","reference":"Salesforce Help — Balancing Deflection and Escalation"},{"id":"AIA-059","domain":"ai-agents","topic":"Product History & Branding","difficulty":"easy","type":"single","stem":"A stakeholder references 'Einstein Copilot.' How does that relate to today's Agentforce?","options":[{"id":"A","text":"Einstein Copilot is a brand-new 2026 product with no connection to Agentforce at all."},{"id":"B","text":"Agentforce is the evolved Einstein Copilot, moving from suggest-and-approve to autonomous agents."},{"id":"C","text":"Agentforce and Einstein Copilot are two separate products sold today with no relationship."},{"id":"D","text":"Einstein Copilot fully replaced and superseded Agentforce partway through 2026."}],"correct":["B"],"explanation":"Correct: B — Einstein Copilot was renamed and evolved into Agentforce, gaining autonomy and broader action and channel support. Why not the others: A and C are wrong because they share the same lineage; D reverses the actual direction (Copilot became Agentforce).","reference":"Salesforce Help — Agentforce Release Notes and History"},{"id":"AIA-060","domain":"ai-agents","topic":"Product History & Branding","difficulty":"easy","type":"single","stem":"In current documentation, the platform that unifies and grounds agent data is referred to as Data 360. What was it previously called?","options":[{"id":"A","text":"Data Cloud — rebranded Data 360, it grounds Agentforce with unified data."},{"id":"B","text":"Sales Cloud, the CRM that stores opportunity and pipeline records."},{"id":"C","text":"Service Cloud Voice, the telephony layer that powers all agent voice calls."},{"id":"D","text":"Tableau CRM, the analytics tool that unifies and grounds agent data."}],"correct":["A"],"explanation":"Correct: A — Data Cloud is now Data 360, providing the unified data that grounds agents. Why not the others: B and C are different clouds/products; D refers to analytics, not the data platform being described.","reference":"Salesforce Help — Data 360 Overview"},{"id":"DC-001","domain":"data-360","topic":"Agentforce Data Library","difficulty":"medium","type":"single","stem":"Ursa Major Solar wants its service agent to always answer customers using the most current version of published support documentation. The content changes frequently and is maintained as Salesforce Knowledge articles with a review-and-publish workflow. Which Agentforce Data Library source type best ensures the agent grounds on the current, published content automatically?","options":[{"id":"A","text":"A file-based (SFDRIVE) library, manually re-uploading the latest PDFs on every change"},{"id":"B","text":"A file-based library with a 'version management' toggle enabled to auto-serve revisions"},{"id":"C","text":"Either type, since a finished search index build always serves the newest version"},{"id":"D","text":"A Knowledge-based Data Library, which natively indexes the current published version"}],"correct":["D"],"explanation":"Correct: D — A Knowledge-based Data Library relies on Salesforce Knowledge's native versioning, so it indexes the published version and the agent grounds on current content. Why not the others: A a file-based library only updates when you manually re-upload and re-index; B file-based libraries have no 'version management' toggle; C finishing an index build never adds versioning to files — only Knowledge provides it.","reference":"Salesforce Help — Agentforce Data Library (Knowledge vs file sources)"},{"id":"DC-002","domain":"data-360","topic":"Agentforce Data Library","difficulty":"medium","type":"single","stem":"Pizza Time keeps its franchise operations manual and seasonal promo sheets as PDFs on a shared drive; this content is not in Salesforce Knowledge. They want an agent to answer staff questions from these documents. Which Data Library source type fits best?","options":[{"id":"A","text":"A file-based (SFDRIVE) Data Library, uploading the operations manual and promo PDFs"},{"id":"B","text":"A Knowledge-based library, which needs the content to already exist as published articles"},{"id":"C","text":"A custom retriever built on the CRM Case object to read the manual's structured fields"},{"id":"D","text":"A data stream that ingests the PDFs from an external transactional order database"}],"correct":["A"],"explanation":"Correct: A — The promo sheets and operations manual are unstructured PDFs that are not in Knowledge, so a file-based library lets you upload them and auto-build the RAG pipeline. Why not the others: B Knowledge-based libraries require content that already exists as published articles; C Case holds structured CRM data, not these documents; D a data stream ingests structured or streaming data, not document grounding.","reference":"Trailhead — Agentforce Data Library Basics (Build a File-Based Data Library)"},{"id":"DC-003","domain":"data-360","topic":"Agentforce Data Library","difficulty":"hard","type":"single","stem":"An admin at Cloud Kicks created a file-based Agentforce Data Library last month. Leadership now wants that same library to pull directly from Salesforce Knowledge instead. What must the admin understand?","options":[{"id":"A","text":"They can change the source type to Knowledge whenever they like from the library settings"},{"id":"B","text":"Switching the source type simply means re-running the existing search index build again"},{"id":"C","text":"The source type is fixed at creation, so they must build a new Knowledge-based library"},{"id":"D","text":"A single library can point at files and Knowledge at once by toggling additional sources"}],"correct":["C"],"explanation":"Correct: C — A Data Library's source type is set at creation and cannot be changed, so moving to Knowledge means creating a new Knowledge-based library. Why not the others: A there is no setting to switch source type after creation; B re-indexing rebuilds content but never changes the source type; D one library binds to a single source type, not several at once.","reference":"Salesforce Help — Create an Agentforce Data Library"},{"id":"DC-004","domain":"data-360","topic":"Agentforce Data Library","difficulty":"easy","type":"single","stem":"Which content can be uploaded to a file-based (SFDRIVE) Agentforce Data Library for grounding?","options":[{"id":"A","text":"Only Salesforce Knowledge articles that have already been through the publish workflow"},{"id":"B","text":"Only structured CSV rows after they are loaded into a standard or custom CRM object"},{"id":"C","text":"Audio and video recordings, which the agent transcribes and plays back on request"},{"id":"D","text":"Unstructured text, HTML, and PDF files, which are chunked and indexed for retrieval"}],"correct":["D"],"explanation":"Correct: D — File-based libraries accept unstructured documents such as text, HTML, and PDF files, which are chunked and indexed for RAG. Why not the others: A requiring published articles describes a Knowledge-based library; B CSV loaded into a CRM object is structured data grounded a different way; C file-based grounding uses document text, not audio or video playback.","reference":"Trailhead — Agentforce Data Library Basics"},{"id":"DC-005","domain":"data-360","topic":"Agentforce Data Library","difficulty":"medium","type":"multi","stem":"An architect is documenting the source types available when creating an Agentforce Data Library. Which of the following are valid Data Library source types? (Choose 3)","options":[{"id":"A","text":"A live screen-scrape of any public website the end user names at runtime"},{"id":"B","text":"Salesforce Knowledge articles drawn from a published article type"},{"id":"C","text":"Uploaded files in supported formats like text, HTML, and PDF documents"},{"id":"D","text":"A Tableau dashboard exported as an image and attached to the library"},{"id":"E","text":"An existing active Custom Retriever that the new library reuses directly"}],"correct":["B","C","E"],"explanation":"Correct: B, C, E — A Data Library can be sourced from Salesforce Knowledge, uploaded files, or an existing active Custom Retriever (a c
